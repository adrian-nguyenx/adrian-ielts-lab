    }
    byId(store, id) {
      if (!id) return null;
      if (!this._idx[store]) { const m = new Map(); this.data[store].forEach((r) => m.set(r.id, r)); this._idx[store] = m; }
      return this._idx[store].get(id) || null;
    }
    all(store) { return this.data[store] || []; }
    where(store, f) { return this.all(store).filter(f); }

    _cachePut(store, rec) {
      if (!this.data[store]) return;
      const arr = this.data[store];
      const i = arr.findIndex((r) => r.id === rec.id);
      if (i >= 0) arr[i] = rec; else arr.push(rec);
      if (this._idx[store]) this._idx[store].set(rec.id, rec);
    }
    _cacheDel(store, id) {
      if (!this.data[store]) return;
      this.data[store] = this.data[store].filter((r) => r.id !== id);
      if (this._idx[store]) this._idx[store].delete(id);
    }
    _changed(stores) { IT.bus.emit('data:changed', { stores: [].concat(stores) }); }

    /** Run a transaction and mirror the writes into the cache once it commits. */
    async _tx(stores, fn) {
      const ops = [];
      const res = await this.dbi.tx(stores, (t) => {
        const w = Object.assign({}, t, {
          put: (s, o) => { ops.push(['put', s, o]); return t.put(s, o); },
          del: (s, id) => { ops.push(['del', s, id]); return t.del(s, id); },
          clear: (s) => { ops.push(['clear', s]); return t.clear(s); },
        });
        return fn(w);
      });
      ops.forEach(([op, s, x]) => {
        if (op === 'put') this._cachePut(s, x);
        else if (op === 'del') this._cacheDel(s, x);
        else if (op === 'clear' && this.data[s]) { this.data[s] = []; delete this._idx[s]; }
      });
      if (ops.find((o) => o[1] === 'settings')) this.settings = this._mergeSettings(this.data.settings.find((x) => x.id === 'app'));
      this._changed(stores);
      return res;
    }

    _stamp(store, obj, existing) {
      const o = Object.assign({}, obj);
      if (!o.id) o.id = U.uid(C.ID_PREFIX[store] || store);
      const now = U.nowIso();
      o.createdAt = (existing && existing.createdAt) || o.createdAt || now;
      o.updatedAt = now;
      return o;
    }

    /* ---------------- settings ---------------- */
    async saveSettings(patch) {
      const s = this._mergeSettings(Object.assign({}, this.settings, patch, { targets: Object.assign({}, this.settings.targets, (patch && patch.targets) || {}) }));
      s.id = 'app';
      await this._tx(['settings'], (t) => t.put('settings', s));
      return this.settings;
    }

    /* ---------------- generic save with validation ---------------- */
    async save(store, obj) {
      if (store === 'vocab') return this.saveVocab(obj);
      if (store === 'essays') return this.saveEssay(obj);
      const existing = obj.id ? this.byId(store, obj.id) : null;
      const rec = this._stamp(store, this.normalize(store, obj, existing), existing);
      this.validate(store, rec, existing);
      await this._tx([store], (t) => t.put(store, rec));
      return rec;
    }

    normalize(store, o, existing) {
      o = Object.assign({}, o);
      if (store === 'readingTests' || store === 'listeningTests') {
        const n = store === 'readingTests' ? 3 : 4;
        const parts = (o.parts || []).slice(0, n);
        while (parts.length < n) parts.push({});
        o.parts = parts.map((p, i) => this._normPart(p, i, store === 'listeningTests'));
      }
      if (store === 'sectionAttempts') {
        o.kind = this.byId('listeningTests', o.testId) ? 'listening' : 'reading';
        o.correct = U.num(o.correct, 0); o.total = U.num(o.total, 0); o.durationMin = U.num(o.durationMin, 0); o.replays = U.num(o.replays, 0);
      }
      if (store === 'studyLogs') {
        if (o.start && o.end) o.minutes = U.minutesBetween(o.start, o.end);
        o.minutes = U.num(o.minutes, 0);
        o.focus = U.num(o.focus);
      }
      if (store === 'speakingSessions') {
        o.prepSec = U.num(o.prepSec, 0); o.answerSec = U.num(o.answerSec, 0);
        o.part = U.num(o.part); o.fillers = U.num(o.fillers);
        o.criteria = Object.assign({ fc: null, lr: null, gra: null, p: null }, o.criteria || {});
        ['fc', 'lr', 'gra', 'p'].forEach((k) => { o.criteria[k] = U.num(o.criteria[k]); });
        o.selfBand = U.num(o.selfBand);
      }
      if (store === 'corrections') {
        o.scores = Object.assign({ overall: null, ta: null, cc: null, lr: null, gra: null }, o.scores || {});
        Object.keys(o.scores).forEach((k) => { o.scores[k] = U.num(o.scores[k]); });
      }
      if (store === 'calendarPlans') o.plannedMin = U.num(o.plannedMin, 0);
      if (store === 'goals') o.target = U.num(o.target);
      if (store === 'bandEntries') ['overall', 'reading', 'listening', 'writing', 'speaking'].forEach((k) => { o[k] = U.num(o[k]); });
      return o;
    }

    _normPart(p, i, listening) {
      const q = (p.questionTypes || []).map((r) => ({ type: r.type || '', total: U.num(r.total, 0), correct: U.num(r.correct, 0) }))
        .filter((r) => r.type || r.total || r.correct);
      const base = {
        id: p.id || (listening ? 's' : 'p') + (i + 1),
        idx: i + 1,
        title: p.title || '',
        topic: p.topic || '',
        questionTypes: q,
        durationMin: U.num(p.durationMin, 0),
        notes: p.notes || '',
      };
      if (listening) Object.assign(base, { audioUrl: p.audioUrl || '', audioBlobId: p.audioBlobId || null, transcript: p.transcript || '', transcriptUrl: p.transcriptUrl || '', replays: U.num(p.replays, 0) });
      else Object.assign(base, { content: p.content || '', sourceUrl: p.sourceUrl || '', summary: p.summary || '' });
      return base;
    }

    validate(store, r, existing) {
      const need = (cond, msg) => { if (!cond) fail(msg); };
      switch (store) {
        case 'readingTests':
        case 'listeningTests': {
          const n = store === 'readingTests' ? 3 : 4;
          need(String(r.name || '').trim(), 'Test name is required.');
          need(r.date, 'Practice date is required.');
          need(Array.isArray(r.parts) && r.parts.length === n, (n === 3 ? 'A Reading test must have exactly 3 passages.' : 'A Listening test must have exactly 4 sections.'));
          r.parts.forEach((p) => p.questionTypes.forEach((q) => {
            need(q.total >= 0 && q.correct >= 0, 'Question counts cannot be negative.');
            need(q.correct <= q.total, (n === 3 ? 'Passage ' : 'Section ') + p.idx + ': correct answers cannot exceed total questions.');
          }));
          break;
        }
        case 'sectionAttempts':
          need(r.testId && (this.byId('readingTests', r.testId) || this.byId('listeningTests', r.testId)), 'Retake must belong to an existing test.');
          need(r.correct <= r.total, 'Correct answers cannot exceed total questions.');
          break;
        case 'corrections':
          need(this.byId('essays', r.essayId), 'Correction must be linked to an existing essay.');
          need(r.date, 'Date received is required.');
          break;
        case 'revisions':
          need(this.byId('essays', r.essayId), 'Revision must be linked to an existing essay.');
          need(String(r.content || '').trim(), 'Revision content is required.');
          break;
        case 'speakingQuestions':
          need(String(r.text || '').trim(), 'Question text is required.');
          need([1, 2, 3].includes(Number(r.part)), 'Part must be 1, 2 or 3.');
          r.part = Number(r.part);
          break;
        case 'speakingSessions':
          need(r.date, 'Date is required.');
          break;
        case 'mistakes':
          need(r.skill, 'Skill is required.');
          need(r.category, 'Mistake type is required.');
          need(r.date, 'Date is required.');
          break;
        case 'studyLogs':
          need(r.date, 'Date is required.');
          need(r.skill, 'Skill is required.');
          need(r.minutes > 0, 'Study time must be greater than 0 minutes.');
          break;
        case 'calendarPlans':
          need(r.date, 'Date is required.');
          need(String(r.title || '').trim(), 'Title is required.');
          break;
        case 'goals':
          need(C.GOAL_METRICS[r.metric], 'Choose a goal metric.');
          need(r.target > 0, 'Target must be greater than 0.');
          need(r.from && r.to && r.from <= r.to, 'Choose a valid date range.');
          break;
        case 'tasks':
          need(String(r.title || '').trim(), 'Task title is required.');
          break;
        case 'knowledge':
          need(C.KNOWLEDGE_SCOPES.includes(r.scope), 'Knowledge note must belong to Reading, Writing Task 1 or Writing Task 2.');
          need(String(r.title || '').trim(), 'Title is required.');
          if (existing) need(existing.scope === r.scope, 'A note cannot be moved to another collection.');
          r.title = r.title.trim();
          r.category = String(r.category || '').trim();
          r.tags = U.splitList(r.tags);
          r.images = (r.images || []).filter((x) => x && x.blobId);
          r.links = (r.links || []).filter((x) => x && U.isUrl(x.url));
          r.status = C.KNOWLEDGE_STATUS.includes(r.status) ? r.status : 'new';
          r.pinned = !!r.pinned;
          break;
        case 'bandEntries':
          need(r.date, 'Date is required.');
          need(['self', 'official'].includes(r.kind), 'Band type must be self-assessed or official.');
          break;
        default: break;
      }
    }

    /* ---------------- vocabulary (central bank) ---------------- */
    findVocabByWord(word) {
      const k = U.normalizeWord(word);
      return k ? this.all('vocab').find((v) => v.wordKey === k) || null : null;
    }
    _normVocab(o) {
      const v = Object.assign({}, o);
      v.word = String(v.word || '').trim().replace(/\s+/g, ' ');
      v.wordKey = U.normalizeWord(v.word);
      v.examples = U.splitLines(v.examples);
      v.collocations = U.splitLines(v.collocations);
      v.synonyms = U.splitList(v.synonyms);
      v.antonyms = U.splitList(v.antonyms);
      v.status = C.VOCAB_STATUS.includes(v.status) ? v.status : 'new';
      v.level = v.level === 'active' ? 'active' : 'passive';
      v.activeTarget = !!v.activeTarget;
      v.srs = v.srs || null;
      v.dateAdded = v.dateAdded || U.today();
      return v;
    }
    async saveVocab(obj) {
      const existing = obj.id ? this.byId('vocab', obj.id) : null;
      const v = this._stamp('vocab', this._normVocab(Object.assign({}, existing || {}, obj)), existing);
      if (!v.wordKey) fail('Word / phrase is required.');
      const dup = this.all('vocab').find((x) => x.wordKey === v.wordKey && x.id !== v.id);
      if (dup) { const e = new ValidationError('"' + dup.word + '" already exists in the Vocabulary Bank.'); e.duplicate = dup; throw e; }
      if (!v.sourceSkill) v.sourceSkill = 'manual';
      await this._tx(['vocab'], (t) => t.put('vocab', v));
      return v;
    }

    /**
     * Add a word to the bank (or reuse the existing one) and link it to a lesson.
     * Never creates a duplicate: if the normalised word exists, the existing record is linked.
     * @param {object} wordData fields for a NEW word (ignored except flags when the word exists)
     * @param {object|null} link {skill, refType, refId, subRefId, context, useActively, role}
     * @returns {Promise<{vocab, link, created:boolean}>}
     */
    async addOrLinkVocab(wordData, link) {
      const key = U.normalizeWord(wordData.word);
      if (!key) fail('Word / phrase is required.');
      return this._tx(['vocab', 'vocabLinks'], async (t) => {
        let vocab = (await t.byIndex('vocab', 'wordKey', key))[0] || null;
        let created = false;
        if (!vocab) {
          vocab = this._stamp('vocab', this._normVocab(Object.assign({}, wordData, { sourceSkill: (link && link.skill) || wordData.sourceSkill || 'manual' })));
          if (link && link.useActively) vocab.activeTarget = true;
          await t.put('vocab', vocab);
          created = true;
        } else if (link && link.useActively && !vocab.activeTarget) {
          vocab = Object.assign({}, vocab, { activeTarget: true, updatedAt: U.nowIso() });
          await t.put('vocab', vocab);
        }
        let lk = null;
        if (link && link.refId) lk = await this._putLink(t, vocab.id, link);
        return { vocab, link: lk, created };
      });
    }

    async linkExisting(vocabId, link) {
      if (!this.byId('vocab', vocabId)) fail('Word not found.');
      return this._tx(['vocab', 'vocabLinks'], async (t) => {
        if (link.useActively) {
          const v = await t.get('vocab', vocabId);
          if (v && !v.activeTarget) await t.put('vocab', Object.assign({}, v, { activeTarget: true, updatedAt: U.nowIso() }));
        }
        return this._putLink(t, vocabId, link);
      });
    }

    async _putLink(t, vocabId, link) {
      const sameRef = (await t.byIndex('vocabLinks', 'refId', link.refId))
        .find((l) => l.vocabId === vocabId && (l.subRefId || null) === (link.subRefId || null));
      const rec = this._stamp('vocabLinks', Object.assign({}, sameRef || {}, {
        vocabId, skill: link.skill, refType: link.refType, refId: link.refId, subRefId: link.subRefId || null,
        context: link.context || (sameRef && sameRef.context) || '', useActively: !!link.useActively,
        role: link.role === 'used' ? 'used' : 'learned',
      }), sameRef);
      await t.put('vocabLinks', rec);
      return rec;
    }

    async updateLink(linkId, patch) {
      const l = this.byId('vocabLinks', linkId); if (!l) fail('Link not found.');
      const rec = this._stamp('vocabLinks', Object.assign({}, l, patch), l);
      await this._tx(['vocabLinks'], (t) => t.put('vocabLinks', rec));
      return rec;
    }
    async unlinkVocab(linkId) { await this._tx(['vocabLinks'], (t) => t.del('vocabLinks', linkId)); }

    linksFor(refId, subRefId) {
      return this.all('vocabLinks').filter((l) => l.refId === refId && (subRefId === undefined || (l.subRefId || null) === (subRefId || null)));
    }
    linksOfVocab(vocabId) { return this.all('vocabLinks').filter((l) => l.vocabId === vocabId); }

    async deleteVocab(id) {
      const links = this.linksOfVocab(id), reviews = this.all('vocabReviews').filter((r) => r.vocabId === id);
      await this._tx(['vocab', 'vocabLinks', 'vocabReviews'], async (t) => {
        for (const l of links) await t.del('vocabLinks', l.id);
        for (const r of reviews) await t.del('vocabReviews', r.id);
        await t.del('vocab', id);
      });
    }

    /** Record a review result and reschedule (SM-2). */
    async reviewVocab(vocabId, grade, mode, extra) {
      const v = this.byId('vocab', vocabId); if (!v) fail('Word not found.');
      const srs = IT.SRS.schedule(v.srs, grade);
      const status = IT.SRS.deriveStatus(srs);
      const upd = Object.assign({}, v, { srs, status, updatedAt: U.nowIso() });
      const rev = this._stamp('vocabReviews', { vocabId, date: U.today(), at: U.nowIso(), mode: mode || 'flashcard', grade, correct: grade !== 'again', answer: (extra && extra.answer) || '' });
      await this._tx(['vocab', 'vocabReviews'], async (t) => { await t.put('vocab', upd); await t.put('vocabReviews', rev); });
      return upd;
    }

    /* ---------------- writing ---------------- */
    async saveEssay(obj) {
      const existing = obj.id ? this.byId('essays', obj.id) : null;
      const e = this._stamp('essays', Object.assign({}, existing || {}, obj), existing);
      e.task = Number(e.task);
      if (![1, 2].includes(e.task)) fail('Essay task must be Task 1 or Task 2.');
      if (!String(e.title || '').trim() && !String(e.prompt || '').trim()) fail('Enter a title or the question prompt.');
      if (!e.date) fail('Date written is required.');
      e.status = C.ESSAY_STATUS.includes(e.status) ? e.status : 'draft';
      e.original = e.original || '';
      // The original is frozen once the essay leaves draft status.
      if (existing && existing.status !== 'draft' && existing.original !== e.original) fail('The original essay is locked. Add a revision instead of editing the original.');
      if (existing && existing.task !== e.task) fail('Task type cannot be changed after creation.');
      e.durationMin = U.num(e.durationMin, 0);
      e.selfBand = U.num(e.selfBand);
      e.wordCount = U.wordCount(e.original);
      await this._tx(['essays'], (t) => t.put('essays', e));
      return e;
    }
    essayStatusAfter(essayId) {
      const e = this.byId('essays', essayId); if (!e || e.status === 'draft') return e && e.status;
      if (this.all('revisions').some((r) => r.essayId === essayId)) return 'revised';
      if (this.all('corrections').some((c) => c.essayId === essayId)) return 'corrected';
      return 'written';
    }
    async addCorrection(c) {
      const rec = await this.save('corrections', c);
      await this._syncEssayStatus(rec.essayId);
      return rec;
    }
    async addRevision(r) {
      const essay = this.byId('essays', r.essayId); if (!essay) fail('Essay not found.');
      if (essay.status === 'draft') fail('Finalise the original essay before adding revisions.');
      const existing = r.id ? this.byId('revisions', r.id) : null;
      const o = Object.assign({}, r);
      if (!existing) o.versionNo = Math.max(0, ...this.all('revisions').filter((x) => x.essayId === r.essayId).map((x) => x.versionNo || 0)) + 1;
      else o.versionNo = existing.versionNo;
      o.wordCount = U.wordCount(o.content);
      ['fixedMistakes', 'repeatedMistakes', 'structuresToApply'].forEach((k) => { o[k] = U.splitLines(o[k]); });
      const rec = await this.save('revisions', o);
      await this._syncEssayStatus(rec.essayId);
      return rec;
    }
    async _syncEssayStatus(essayId) {
      const e = this.byId('essays', essayId); if (!e) return;
      const st = this.essayStatusAfter(essayId);
      if (st && st !== e.status) await this._tx(['essays'], (t) => t.put('essays', Object.assign({}, e, { status: st, updatedAt: U.nowIso() })));
    }

    /* ---------------- blobs (audio) ---------------- */
    async putBlob(blob, meta) {
      const rec = { id: U.uid('blob'), type: blob.type || 'application/octet-stream', size: blob.size, data: blob, name: (meta && meta.name) || '', createdAt: U.nowIso() };
      await this.dbi.tx(['blobs'], (t) => t.put('blobs', rec));
      return rec;
    }
    getBlob(id) { return id ? this.dbi.get('blobs', id) : Promise.resolve(null); }
    async deleteBlob(id) { if (id) await this.dbi.tx(['blobs'], (t) => t.del('blobs', id)); }
    allBlobs() { return this.dbi.all('blobs'); }

    /* ---------------- deletion with cascade ---------------- */
    /** Describe what deleting a record will touch (for the confirm dialog). */
    deleteImpact(store, id) {
      const imp = { links: 0, mistakes: 0, attempts: 0, corrections: 0, revisions: 0, logs: 0, reviews: 0, blobs: 0 };
      if (store === 'vocab') { imp.links = this.linksOfVocab(id).length; imp.reviews = this.all('vocabReviews').filter((r) => r.vocabId === id).length; return imp; }
      imp.links = this.all('vocabLinks').filter((l) => l.refId === id).length;
      imp.mistakes = this.all('mistakes').filter((m) => m.refId === id).length;
      imp.logs = this.all('studyLogs').filter((l) => l.refId === id).length;
      if (store === 'readingTests' || store === 'listeningTests') imp.attempts = this.all('sectionAttempts').filter((a) => a.testId === id).length;
      if (store === 'essays') { imp.corrections = this.all('corrections').filter((c) => c.essayId === id).length; imp.revisions = this.all('revisions').filter((r) => r.essayId === id).length; }
      if (store === 'speakingSessions') { const s = this.byId(store, id); imp.blobs = s ? sessionBlobIds(s).length : 0; }
      if (store === 'listeningTests') { const t = this.byId(store, id); imp.blobs = t ? t.parts.filter((p) => p.audioBlobId).length : 0; }
      return imp;
    }

    /**
     * Delete a record. Vocabulary words are NEVER deleted as a side effect —
     * only their links to the deleted lesson are removed.
     * @param {object} opts {deleteMistakes:boolean} — otherwise mistakes are kept and marked "source deleted".
     */
    async remove(store, id, opts) {
      opts = opts || {};
      if (store === 'vocab') return this.deleteVocab(id);
      if (store === 'knowledge') return this.deleteKnowledge(id);
      if (store === 'settings') fail('Settings cannot be deleted.');
      const rec = this.byId(store, id);
      const blobIds = [];
      if (store === 'speakingSessions' && rec) sessionBlobIds(rec).forEach((b) => blobIds.push(b));
      if (store === 'listeningTests' && rec) rec.parts.forEach((p) => p.audioBlobId && blobIds.push(p.audioBlobId));
      const links = this.all('vocabLinks').filter((l) => l.refId === id);
      const mistakes = this.all('mistakes').filter((m) => m.refId === id);
      const logs = this.all('studyLogs').filter((l) => l.refId === id);
      const attempts = this.all('sectionAttempts').filter((a) => a.testId === id);
      const corrections = store === 'essays' ? this.all('corrections').filter((c) => c.essayId === id) : [];
      const revisions = store === 'essays' ? this.all('revisions').filter((r) => r.essayId === id) : [];
      const sessionsOfQ = store === 'speakingQuestions' ? this.all('speakingSessions').filter((s) => s.questionId === id) : [];
      const stores = U.uniq([store, 'vocabLinks', 'mistakes', 'studyLogs', 'sectionAttempts', 'corrections', 'revisions', 'speakingSessions', 'blobs']);
      const now = U.nowIso();
      await this._tx(stores, async (t) => {
        for (const l of links) await t.del('vocabLinks', l.id);
        for (const m of mistakes) {
          if (opts.deleteMistakes) await t.del('mistakes', m.id);
          else await t.put('mistakes', Object.assign({}, m, { refDeleted: true, refLabel: m.refLabel || (rec && (rec.name || rec.title || rec.questionText)) || '', updatedAt: now }));
        }
        for (const l of logs) await t.put('studyLogs', Object.assign({}, l, { refId: null, refType: null, refDeletedLabel: (rec && (rec.name || rec.title)) || 'deleted item', updatedAt: now }));
        for (const a of attempts) await t.del('sectionAttempts', a.id);
        for (const c of corrections) await t.del('corrections', c.id);
        for (const r of revisions) await t.del('revisions', r.id);
        for (const s of sessionsOfQ) await t.put('speakingSessions', Object.assign({}, s, { questionId: null, updatedAt: now }));
        for (const b of blobIds) await t.del('blobs', b);
        await t.del(store, id);
      });
      if (store === 'corrections' || store === 'revisions') { if (rec) await this._syncEssayStatus(rec.essayId); }
    }

    /* ---------------- knowledge notes (independent of tests) ---------------- */
    /** Delete a note together with its images and review history. Nothing else is touched. */
    async deleteKnowledge(id) {
      const n = this.byId('knowledge', id);
      const reviews = this.all('knowledgeReviews').filter((r) => r.noteId === id);
      await this._tx(['knowledge', 'knowledgeReviews', 'blobs'], async (t) => {
        for (const r of reviews) await t.del('knowledgeReviews', r.id);
        for (const im of (n && n.images) || []) await t.del('blobs', im.blobId);
        await t.del('knowledge', id);
      });
    }
    /** Spaced-repetition review of a note (same SM-2 schedule as vocabulary). */
    async reviewKnowledge(id, grade) {
      const n = this.byId('knowledge', id); if (!n) fail('Note not found.');
      const srs = IT.SRS.schedule(n.srs, grade);
      const upd = Object.assign({}, n, { srs, status: IT.SRS.deriveStatus(srs), lastReviewed: U.today(), updatedAt: U.nowIso() });
      const rev = this._stamp('knowledgeReviews', { noteId: id, scope: n.scope, date: U.today(), at: U.nowIso(), grade, correct: grade !== 'again' });
      await this._tx(['knowledge', 'knowledgeReviews'], async (t) => { await t.put('knowledge', upd); await t.put('knowledgeReviews', rev); });
      return upd;
    }

    /* ---------------- bulk (import / reset) ---------------- */
    async clearAll() {
      await this._tx(IT.STORES, async (t) => { for (const s of IT.STORES) await t.clear(s); });
      this.settings = U.clone(DEFAULT_SETTINGS);
    }
  }

  IT.ValidationError = ValidationError;
  IT.StoreClass = Store;
  IT.DEFAULT_SETTINGS = DEFAULT_SETTINGS;
  IT.Store = new Store(IT.db);
})(window.IT = window.IT || {});

</script>
<script>/* js/core/stats.js */
/* Adrian IELTS Lab — statistics. Pure functions over a Store snapshot.
 * Every number shown in the app is computed here from saved records only. */
(function (IT) {
  'use strict';
  const U = IT.U, C = IT.C, B = IT.Band;

  /* ---------- reading / listening helpers ---------- */
  function partTotals(p) {
    const total = U.sum(p.questionTypes || [], (q) => q.total);
    const correct = U.sum(p.questionTypes || [], (q) => q.correct);
    return { total, correct, acc: U.pct(correct, total) };
  }
  function testTotals(t, kind) {
    const parts = (t.parts || []).map(partTotals);
    const total = U.sum(parts, (p) => p.total), correct = U.sum(parts, (p) => p.correct);
    const minutes = U.sum(t.parts || [], (p) => p.durationMin);
    const replays = U.sum(t.parts || [], (p) => p.replays || 0);
    return { total, correct, acc: U.pct(correct, total), minutes, replays, est: B.fromRaw(kind, correct, total), parts };
  }

  /* ---------- practice items (anything that carries its own duration) ---------- */
  function practiceItems(S) {
    const items = [];
    S.all('readingTests').forEach((t) => items.push({ refType: 'readingTest', refId: t.id, skill: 'reading', date: t.date, minutes: testTotals(t, 'reading').minutes, label: t.name }));
    S.all('listeningTests').forEach((t) => items.push({ refType: 'listeningTest', refId: t.id, skill: 'listening', date: t.date, minutes: testTotals(t, 'listening').minutes, label: t.name }));
    S.all('sectionAttempts').forEach((a) => {
      const t = S.byId('readingTests', a.testId) || S.byId('listeningTests', a.testId);
      items.push({ refType: 'sectionAttempt', refId: a.id, parentId: a.testId, skill: a.kind === 'listening' ? 'listening' : 'reading', date: a.date, minutes: a.durationMin || 0, label: 'Retake · ' + (t ? t.name : '') });
    });
    S.all('essays').filter((e) => e.status !== 'draft' || e.durationMin).forEach((e) => items.push({ refType: 'essay', refId: e.id, skill: e.task === 1 ? 'writing1' : 'writing2', date: e.date, minutes: e.durationMin || 0, label: e.title || e.prompt }));
    S.all('speakingSessions').forEach((s) => items.push({ refType: 'speakingSession', refId: s.id, skill: 'speaking', date: s.date, minutes: Math.round(((s.prepSec || 0) + (s.answerSec || 0)) / 60 * 10) / 10, label: s.questionText || s.topic || 'Speaking session' }));
    return items;
  }

  /**
   * Study time without double counting:
   * every study log counts; a practice item's own duration counts only if no log references it.
   * Returns {minutes, sessions, bySkill:{bucket:minutes}, byDate:{date:minutes}, entries:[]}
   */
  function studyTime(S, from, to) {
    const loggedRefs = new Set(S.all('studyLogs').filter((l) => l.refId).map((l) => l.refId));
    const entries = [];
    S.all('studyLogs').forEach((l) => { if (U.inRange(l.date, from, to)) entries.push({ source: 'log', date: l.date, skill: l.skill, minutes: l.minutes || 0, id: l.id }); });
    practiceItems(S).forEach((p) => {
      if (loggedRefs.has(p.refId) || (p.parentId && loggedRefs.has(p.refId))) return;
      if (U.inRange(p.date, from, to)) entries.push({ source: 'practice', date: p.date, skill: p.skill, minutes: p.minutes || 0, id: p.refId, refType: p.refType });
    });
    const bySkill = {}, byDate = {};
    entries.forEach((e) => {
      const b = C.SKILL_BUCKET[e.skill] || 'other';
      bySkill[b] = (bySkill[b] || 0) + e.minutes;
      byDate[e.date] = (byDate[e.date] || 0) + e.minutes;
    });
    return { minutes: U.sum(entries, (e) => e.minutes), sessions: entries.length, bySkill, byDate, entries };
  }

  /** All dates with any recorded study activity (logs, practice, vocab reviews). */
  function activeDates(S) {
    const d = new Set();
    S.all('studyLogs').forEach((l) => l.date && d.add(l.date));
    practiceItems(S).forEach((p) => p.date && d.add(p.date));
    S.all('vocabReviews').forEach((r) => r.date && d.add(r.date));
    return d;
  }
  function streakFrom(dates, refDay) {
    let day = refDay || U.today();
    if (!dates.has(day)) day = U.addDays(day, -1); // today not studied yet: streak continues from yesterday
    let n = 0;
    while (dates.has(day)) { n++; day = U.addDays(day, -1); }
    return n;
  }
  function longestStreak(dates) {
    const arr = Array.from(dates).sort();
    let best = 0, cur = 0, prev = null;
    arr.forEach((d) => { cur = prev && U.diffDays(prev, d) === 1 ? cur + 1 : 1; best = Math.max(best, cur); prev = d; });
    return best;
  }

  /* ---------- band estimates (unofficial) ---------- */
  function readingEstimates(S) {
    return U.sortBy(S.all('readingTests'), (t) => t.date + (t.startTime || '')).map((t) => ({ date: t.date, id: t.id, name: t.name, tot: testTotals(t, 'reading') })).filter((x) => x.tot.total > 0);
  }
  function listeningEstimates(S) {
    return U.sortBy(S.all('listeningTests'), (t) => t.date + (t.startTime || '')).map((t) => ({ date: t.date, id: t.id, name: t.name, tot: testTotals(t, 'listening') })).filter((x) => x.tot.total > 0);
  }
  /** Band for one essay: latest correction (overall or criteria avg); falls back to self band. */
  function essayBand(S, e) {
    const cors = U.sortBy(S.all('corrections').filter((c) => c.essayId === e.id), (c) => c.date + c.createdAt);
    const last = cors[cors.length - 1];
    if (last) {
      const sc = last.scores || {};
      const b = sc.overall !== null && sc.overall !== undefined ? sc.overall : B.fromCriteria([sc.ta, sc.cc, sc.lr, sc.gra]);
      if (b !== null) return { band: b, source: 'correction', date: last.date };
    }
    if (e.selfBand !== null && e.selfBand !== undefined) return { band: e.selfBand, source: 'self', date: e.date };
    return null;
  }
  function writingSeries(S, task) {
    return U.sortBy(S.all('essays').filter((e) => e.task === task && e.status !== 'draft'), (e) => e.date)
      .map((e) => ({ date: e.date, id: e.id, title: e.title, b: essayBand(S, e) })).filter((x) => x.b);
  }
  function speakingSeries(S) {
    return U.sortBy(S.all('speakingSessions'), (s) => s.date + s.createdAt).map((s) => {
      const c = s.criteria || {};
      const b = B.fromCriteria([c.fc, c.lr, c.gra, c.p]);
      return { date: s.date, id: s.id, band: b !== null ? b : s.selfBand, criteria: c };
    }).filter((x) => x.band !== null && x.band !== undefined);
  }
  const lastN = (arr, n) => arr.slice(Math.max(0, arr.length - n));

  /**
   * Estimated current band per skill = average of the most recent 3 results (rounded to .5).
   * Writing = (T1 + 2×T2)/3 using the average of the last 3 essays per task.
   */
  function estimatedBands(S, n) {
    n = n || 3;
    const r = lastN(readingEstimates(S), n), l = lastN(listeningEstimates(S), n);
    const w1 = lastN(writingSeries(S, 1), n), w2 = lastN(writingSeries(S, 2), n), sp = lastN(speakingSeries(S), n);
    const reading = r.length ? B.roundBand(U.avg(r.map((x) => x.tot.est.band))) : null;
    const listening = l.length ? B.roundBand(U.avg(l.map((x) => x.tot.est.band))) : null;
    const t1 = w1.length ? B.roundBand(U.avg(w1.map((x) => x.b.band))) : null;
    const t2 = w2.length ? B.roundBand(U.avg(w2.map((x) => x.b.band))) : null;
    const wr = B.writing(t1, t2);
    const speaking = sp.length ? B.roundBand(U.avg(sp.map((x) => x.band))) : null;
    const writing = wr ? wr.band : null;
    const selfOnlyW = [...w1, ...w2].length > 0 && [...w1, ...w2].every((x) => x.b.source === 'self');
    return {
      reading, listening, writing, speaking, t1, t2,
      writingPartial: wr ? wr.partial : false, writingSelfOnly: selfOnlyW,
      overall: B.overall(reading, listening, writing, speaking),
      basis: { reading: r.length, listening: l.length, t1: w1.length, t2: w2.length, speaking: sp.length },
      scaled: r.some((x) => x.tot.est.scaled) || l.some((x) => x.tot.est.scaled),
    };
  }
  function latestBandEntry(S, kind) {
    const arr = U.sortBy(S.all('bandEntries').filter((b) => b.kind === kind), (b) => b.date + b.createdAt);
    return arr[arr.length - 1] || null;
  }

  /** Skill with the largest gap to target (falls back to the lowest estimated band). */
  function prioritySkill(S) {
    const est = estimatedBands(S), tg = S.settings.targets || {};
    const self = latestBandEntry(S, 'self');
    const rows = C.BAND_SKILLS.map((k) => {
      const cur = est[k] !== null ? est[k] : self ? self[k] : null;
      return { skill: k, current: cur, target: tg[k], gap: cur !== null && tg[k] !== null && tg[k] !== undefined ? tg[k] - cur : null };
    });
    const withGap = rows.filter((r) => r.gap !== null);
    if (withGap.length) return U.sortBy(withGap, (r) => r.gap, true)[0];
    const withCur = rows.filter((r) => r.current !== null);
    if (withCur.length) return Object.assign(U.sortBy(withCur, (r) => r.current)[0], { reason: 'lowest' });
    return null;
  }

  /* ---------- counts ---------- */
  function counts(S, from, to) {
    const ir = (d) => U.inRange(d, from, to);
    const essays = S.all('essays').filter((e) => e.status !== 'draft' && ir(e.date));
    const cors = S.all('corrections').filter((c) => ir(c.date));
    const revs = S.all('revisions').filter((r) => ir(r.date || (r.createdAt || '').slice(0, 10)));
    const correctedIds = (task) => U.uniq(cors.filter((c) => { const e = S.byId('essays', c.essayId); return e && e.task === task; }).map((c) => c.essayId));
    const revOf = (task) => revs.filter((r) => { const e = S.byId('essays', r.essayId); return e && e.task === task; }).length;
    const c = {
      readingTests: S.all('readingTests').filter((t) => ir(t.date)).length,
      listeningTests: S.all('listeningTests').filter((t) => ir(t.date)).length,
      readingRetakes: S.all('sectionAttempts').filter((a) => a.kind !== 'listening' && ir(a.date)).length,
      listeningRetakes: S.all('sectionAttempts').filter((a) => a.kind === 'listening' && ir(a.date)).length,
      writingT1: essays.filter((e) => e.task === 1).length,
      writingT2: essays.filter((e) => e.task === 2).length,
      drafts: S.all('essays').filter((e) => e.status === 'draft').length,
      correctedT1: correctedIds(1).length,
      correctedT2: correctedIds(2).length,
      correctionsT1: cors.filter((x) => { const e = S.byId('essays', x.essayId); return e && e.task === 1; }).length,
      correctionsT2: cors.filter((x) => { const e = S.byId('essays', x.essayId); return e && e.task === 2; }).length,
      revisionsT1: revOf(1),
      revisionsT2: revOf(2),
      speakingSessions: S.all('speakingSessions').filter((s) => ir(s.date)).length,
      newVocab: S.all('vocab').filter((v) => ir(vocabDate(v))).length,
      reviewedVocab: U.uniq(S.all('vocabReviews').filter((r) => ir(r.date)).map((r) => r.vocabId)).length,
      reviews: S.all('vocabReviews').filter((r) => ir(r.date)).length,
      mistakes: S.all('mistakes').filter((m) => ir(m.date)).length,
    };
    c.writingTotal = c.writingT1 + c.writingT2;
    c.essaysCorrected = c.correctedT1 + c.correctedT2;
    c.revisions = c.revisionsT1 + c.revisionsT2;
    return c;
  }

  /* ---------- vocabulary ---------- */
  function vocabDate(v) { return v.dateAdded || (v.createdAt ? U.dateStr(v.createdAt) : null); }
  function vocabStats(S, from, to) {
    const all = S.all('vocab');
    const inP = from || to ? all.filter((v) => U.inRange(vocabDate(v), from, to)) : all;
    const bySource = {}; inP.forEach((v) => { bySource[v.sourceSkill || 'manual'] = (bySource[v.sourceSkill || 'manual'] || 0) + 1; });
    const byStatus = { new: 0, learning: 0, reviewing: 0, mastered: 0 }; all.forEach((v) => { byStatus[v.status] = (byStatus[v.status] || 0) + 1; });
    const wsSkills = ['writing1', 'writing2', 'speaking'];
    const usedIds = U.uniq(S.all('vocabLinks').filter((l) => wsSkills.includes(l.skill) && l.role === 'used').map((l) => l.vocabId)).filter((id) => S.byId('vocab', id));
    const due = all.filter((v) => v.status !== 'mastered' && IT.SRS.isDue(v)).length;
    const revs = S.all('vocabReviews').filter((r) => U.inRange(r.date, from, to));
    return {
      total: all.length, added: inP.length, bySource, byStatus,
      active: all.filter((v) => v.level === 'active').length,
      activeTargets: all.filter((v) => v.activeTarget).length,
      usedInWS: usedIds.length,
      due,
      reviewed: U.uniq(revs.map((r) => r.vocabId)).length,
      reviews: revs.length,
      retention: U.pct(revs.filter((r) => r.correct).length, revs.length),
    };
  }

  /* ---------- reading / listening analytics ---------- */
  function rlAnalytics(S, kind, from, to) {
    const store = kind === 'reading' ? 'readingTests' : 'listeningTests';
    const n = kind === 'reading' ? 3 : 4;
    const tests = S.all(store).filter((t) => U.inRange(t.date, from, to));
    const byPart = []; for (let i = 0; i < n; i++) byPart.push({ total: 0, correct: 0, minutes: 0, replays: 0, count: 0 });
    const byType = {};
    tests.forEach((t) => t.parts.forEach((p, i) => {
      const pt = partTotals(p);
      byPart[i].total += pt.total; byPart[i].correct += pt.correct; byPart[i].minutes += p.durationMin || 0; byPart[i].replays += p.replays || 0; byPart[i].count++;
      p.questionTypes.forEach((q) => { const k = q.type || 'Unspecified'; byType[k] = byType[k] || { total: 0, correct: 0 }; byType[k].total += q.total; byType[k].correct += q.correct; });
    }));
    byPart.forEach((p) => { p.acc = U.pct(p.correct, p.total); });
    Object.values(byType).forEach((x) => { x.acc = U.pct(x.correct, x.total); });
    const tt = tests.map((t) => testTotals(t, kind));
    const timed = tt.filter((x) => x.minutes > 0);
    return {
      tests: tests.length,
      avgMinutes: timed.length ? U.avg(timed.map((x) => x.minutes)) : null,
      avgAcc: U.avg(tt.map((x) => x.acc)),
      avgBand: tt.filter((x) => x.est).length ? B.roundBand(U.avg(tt.filter((x) => x.est).map((x) => x.est.band))) : null,
      totalReplays: U.sum(tt, (x) => x.replays),
      byPart, byType,
      weakestType: Object.entries(byType).filter(([, v]) => v.total >= 3).sort((a, b) => a[1].acc - b[1].acc)[0] || null,
    };
  }

  /* ---------- mistakes ---------- */
  function mistakeStats(S, from, to, skill) {
    const ms = S.all('mistakes').filter((m) => U.inRange(m.date, from, to) && (!skill || m.skill === skill));
    const byCat = {};
    ms.forEach((m) => { const k = m.skill + '|' + m.category; byCat[k] = byCat[k] || { skill: m.skill, category: m.category, count: 0, open: 0 }; byCat[k].count++; if (!m.fixed) byCat[k].open++; });
    return { total: ms.length, open: ms.filter((m) => !m.fixed).length, fixed: ms.filter((m) => m.fixed).length, top: U.sortBy(Object.values(byCat), (x) => x.count, true) };
  }
  /** how many mistakes share the same skill+category (recurrence) */
  function recurrence(S, m) { return S.all('mistakes').filter((x) => x.skill === m.skill && x.category === m.category).length; }

  /* ---------- speaking ---------- */
  function speakingStats(S, from, to) {
    const ss = S.all('speakingSessions').filter((s) => U.inRange(s.date, from, to));
    const crit = { fc: [], lr: [], gra: [], p: [] };
    ss.forEach((s) => Object.keys(crit).forEach((k) => { if (s.criteria && s.criteria[k] !== null && s.criteria[k] !== undefined) crit[k].push(s.criteria[k]); }));
    const topics = U.uniq(ss.map((s) => (s.topic || '').trim()).filter(Boolean));
    const usedVocab = U.uniq(S.all('vocabLinks').filter((l) => l.skill === 'speaking' && l.role === 'used' && ss.some((s) => s.id === l.refId)).map((l) => l.vocabId)).length;
    return {
      sessions: ss.length,
      minutes: U.sum(ss, (s) => ((s.prepSec || 0) + (s.answerSec || 0)) / 60),
      answerMinutes: U.sum(ss, (s) => (s.answerSec || 0) / 60),
      avg: { fc: U.avg(crit.fc), lr: U.avg(crit.lr), gra: U.avg(crit.gra), p: U.avg(crit.p) },
      topics, usedVocab,
      avgFillers: U.avg(ss.map((s) => s.fillers)),
      avgWords: U.avg(ss.map((s) => U.wordCount(s.transcript || s.answer)).filter((x) => x > 0)),
      challengeDays: U.uniq(S.all('speakingSessions').filter((s) => s.isChallenge).map((s) => s.date)),
    };
  }

  /* ---------- writing ---------- */
  function writingStats(S, from, to, task) {
    const es = S.all('essays').filter((e) => e.status !== 'draft' && U.inRange(e.date, from, to) && (!task || e.task === task));
    const ids = new Set(es.map((e) => e.id));
    const cors = S.all('corrections').filter((c) => ids.has(c.essayId));
    const revs = S.all('revisions').filter((r) => ids.has(r.essayId));
    const crit = { ta: [], cc: [], lr: [], gra: [] };
    cors.forEach((c) => Object.keys(crit).forEach((k) => { if (c.scores && c.scores[k] !== null && c.scores[k] !== undefined) crit[k].push(c.scores[k]); }));
    return {
      essays: es.length,
      corrected: U.uniq(cors.map((c) => c.essayId)).length,
      corrections: cors.length,
      revisions: revs.length,
      minutes: U.sum(es, (e) => e.durationMin),
      avgWords: U.avg(es.map((e) => e.wordCount).filter((x) => x > 0)),
      avgCriteria: { ta: U.avg(crit.ta), cc: U.avg(crit.cc), lr: U.avg(crit.lr), gra: U.avg(crit.gra) },
      repeated: U.uniq([].concat(...revs.map((r) => r.repeatedMistakes || []))).length,
      fixed: U.uniq([].concat(...revs.map((r) => r.fixedMistakes || []))).length,
    };
  }

  /* ---------- goals ---------- */
  function metricValue(S, metric, from, to) {
    const c = counts(S, from, to);
    switch (metric) {
      case 'studyHours': return Math.round(studyTime(S, from, to).minutes / 6) / 10;
      case 'studySessions': return studyTime(S, from, to).sessions;
      case 'readingTests': return c.readingTests;
      case 'listeningTests': return c.listeningTests;
      case 'writingT1': return c.writingT1;
      case 'writingT2': return c.writingT2;
      case 'essaysCorrected': return c.essaysCorrected;
      case 'revisions': return c.revisions;
      case 'speakingSessions': return c.speakingSessions;
      case 'newVocab': return c.newVocab;
      case 'reviewedVocab': return c.reviewedVocab;
      default: return 0;
    }
  }
  /** Resolve a goal's active window (recurring goals use the current period). */
  function goalWindow(g, onDate) {
    const d = onDate || U.today();
    if (g.period === 'daily') return { from: d, to: d };
    if (g.period === 'weekly') return { from: U.startOfWeek(d), to: U.endOfWeek(d) };
    if (g.period === 'monthly') return { from: U.startOfMonth(d), to: U.endOfMonth(d) };
    return { from: g.from, to: g.to };
  }
  function goalProgress(S, g, onDate) {
    const d = onDate || U.today();
    const w = goalWindow(g, d);
    const value = metricValue(S, g.metric, w.from, w.to);
    const pctDone = g.target > 0 ? Math.min(100, (value / g.target) * 100) : 0;
    const span = U.diffDays(w.from, w.to) + 1;
    const elapsed = d < w.from ? 0 : d > w.to ? span : U.diffDays(w.from, d) + 1;
    const pctTime = span > 0 ? (elapsed / span) * 100 : 100;
    const done = value >= g.target;
    const behind = !done && d >= w.from && pctDone + 10 < pctTime;
    const expired = !done && d > w.to;
    return { value, target: g.target, pct: pctDone, pctTime, done, behind, expired, window: w };
  }

  /* ---------- calendar ---------- */
  function calendarStats(S, from, to) {
    const ps = S.all('calendarPlans').filter((p) => U.inRange(p.date, from, to));
    return { planned: ps.length, done: ps.filter((p) => p.done).length, pct: U.pct(ps.filter((p) => p.done).length, ps.length), plannedMin: U.sum(ps, (p) => p.plannedMin) };
  }

  /* ---------- report (week / month) ---------- */
  function report(S, from, to) {
    const tm = studyTime(S, from, to);
    return {
      from, to,
      time: tm,
      counts: counts(S, from, to),
      reading: rlAnalytics(S, 'reading', from, to),
      listening: rlAnalytics(S, 'listening', from, to),
      writing: { t1: writingStats(S, from, to, 1), t2: writingStats(S, from, to, 2), all: writingStats(S, from, to) },
      speaking: speakingStats(S, from, to),
      vocab: vocabStats(S, from, to),
      mistakes: mistakeStats(S, from, to),
      calendar: calendarStats(S, from, to),
      activeDays: Array.from(activeDates(S)).filter((d) => U.inRange(d, from, to)).length,
    };
  }

  /** Timeline of results per skill for charts: [{skill, points:[{date, band}]}] */
  function bandTimeline(S) {
    const pts = {
      reading: readingEstimates(S).map((x) => ({ date: x.date, value: x.tot.est.band })),
      listening: listeningEstimates(S).map((x) => ({ date: x.date, value: x.tot.est.band })),

<script>/* js/core/io.js */
/* Adrian IELTS Lab — backup (JSON) and CSV export / import. */
(function (IT) {
  'use strict';
  const U = IT.U, C = IT.C;
  const APP_ID = 'adrians-ielts-tracker';

  function blobToDataUrl(blob) {
    return new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = () => reject(r.error); r.readAsDataURL(blob); });
  }
  async function dataUrlToBlob(url) {
    const m = /^data:([^;,]*)(;base64)?,(.*)$/s.exec(url || '');
    if (!m) throw new Error('Invalid audio data in backup.');
    const bin = m[2] ? atob(m[3]) : decodeURIComponent(m[3]);
    const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: m[1] || 'application/octet-stream' });
  }

  /** Build a full backup object. */
  async function exportAll(S, opts) {
    opts = opts || {};
    const stores = {};
    IT.STORES.forEach((s) => { if (s !== 'blobs') stores[s] = U.clone(S.all(s)); });
    stores.blobs = [];
    // Knowledge images are always included (they are part of the notes); audio only on request.
    const imageIds = new Set([].concat(...S.all('knowledge').map((n) => (n.images || []).map((i) => i.blobId))));
    const blobs = await S.allBlobs();
    for (const b of blobs) {
      if (!opts.includeAudio && !imageIds.has(b.id)) continue;
      stores.blobs.push({ id: b.id, type: b.type, size: b.size, name: b.name, createdAt: b.createdAt, dataUrl: await blobToDataUrl(b.data) });
    }
    return { app: APP_ID, schemaVersion: IT.SCHEMA_VERSION, exportedAt: U.nowIso(), includesAudio: !!opts.includeAudio, stores };
  }

  /** Validate a parsed backup and return a preview, or throw with a clear message. */
  function inspect(obj) {
    if (!obj || typeof obj !== 'object') throw new Error('The file is not a valid JSON backup.');
    if (obj.app !== APP_ID) throw new Error('This file was not exported from Adrian IELTS Lab.');
    if (!obj.stores || typeof obj.stores !== 'object') throw new Error('Backup is missing its data section.');
    if (Number(obj.schemaVersion) > IT.SCHEMA_VERSION) throw new Error('Backup was made by a newer version of the app (schema ' + obj.schemaVersion + ').');
    const preview = {}; let total = 0;
    Object.keys(obj.stores).forEach((s) => {
      if (!IT.STORES.includes(s)) throw new Error('Unknown data section "' + s + '".');
      const arr = obj.stores[s];
      if (!Array.isArray(arr)) throw new Error('Section "' + s + '" is not a list.');
      arr.forEach((r, i) => { if (!r || typeof r.id !== 'string' || !r.id) throw new Error('Record ' + (i + 1) + ' in "' + s + '" has no id.'); });
      if (s === 'readingTests') arr.forEach((t) => { if (!Array.isArray(t.parts) || t.parts.length !== 3) throw new Error('Reading test "' + (t.name || t.id) + '" does not have exactly 3 passages.'); });

  /**
   * Import a backup.
   * mode 'replace' — wipe everything, then load the backup.
   * mode 'merge'   — keep current data; add new records; for the same id keep the newer `updatedAt`;
   *                  words that already exist (same normalised word, different id) are merged:
   *                  the backup's links/reviews are re-pointed to the existing word.
   */
  async function importAll(S, obj, mode) {
    inspect(obj);
    const src = obj.stores;
    const res = { added: 0, updated: 0, skipped: 0, mergedWords: 0 };
    // Convert audio before opening the transaction (transactions cannot wait on non-DB work).
    const blobs = [];
    for (const b of src.blobs || []) { if (b.dataUrl) blobs.push({ id: b.id, type: b.type, size: b.size, name: b.name || '', createdAt: b.createdAt, data: await dataUrlToBlob(b.dataUrl) }); }

    await S.dbi.tx(IT.STORES, async (t) => {
      if (mode === 'replace') {
        for (const s of IT.STORES) await t.clear(s);
        for (const s of IT.STORES) {
          const rows = s === 'blobs' ? blobs : (src[s] || []);
          for (const r of rows) { await t.put(s, r); res.added++; }
        }
        return;
      }

      const vocabMap = {}; // incoming vocab id → existing id (when the word already exists)
      const existingVocab = await t.all('vocab');
      const byKey = {}; existingVocab.forEach((v) => { byKey[v.wordKey] = v; });
      for (const v of src.vocab || []) {
        const key = v.wordKey || U.normalizeWord(v.word);
        const same = byKey[key];
        if (same && same.id !== v.id) {
          vocabMap[v.id] = same.id; res.mergedWords++;
          // fill empty fields of the existing word with the backup's values (never overwrite)
          const merged = Object.assign({}, same);
          let changed = false;
          ['ipa', 'pos', 'meaningVi', 'definitionEn', 'topic', 'notes'].forEach((k) => { if (!merged[k] && v[k]) { merged[k] = v[k]; changed = true; } });
          ['examples', 'collocations', 'synonyms', 'antonyms'].forEach((k) => { const u = U.uniq([...(merged[k] || []), ...(v[k] || [])]); if (u.length !== (merged[k] || []).length) { merged[k] = u; changed = true; } });
          if (changed) { merged.updatedAt = U.nowIso(); await t.put('vocab', merged); }
          continue;
        }
        const cur = await t.get('vocab', v.id);
        if (!cur) { await t.put('vocab', Object.assign({}, v, { wordKey: key })); byKey[key] = v; res.added++; }
        else if ((v.updatedAt || '') > (cur.updatedAt || '')) { await t.put('vocab', Object.assign({}, v, { wordKey: key })); res.updated++; }
        else res.skipped++;

      const haveLink = new Set(existingLinks.map(linkKey));

          continue;
        }
        const rows = s === 'blobs' ? blobs : (src[s] || []);
        for (let r of rows) {
          if ((s === 'vocabLinks' || s === 'vocabReviews') && vocabMap[r.vocabId]) r = Object.assign({}, r, { vocabId: vocabMap[r.vocabId] });
          if (s === 'vocabLinks') { if (haveLink.has(linkKey(r)) && !(await t.get(s, r.id))) { res.skipped++; continue; } haveLink.add(linkKey(r)); }
          const cur = await t.get(s, r.id);
          if (!cur) { await t.put(s, r); res.added++; }
          else if (s !== 'blobs' && (r.updatedAt || '') > (cur.updatedAt || '')) { await t.put(s, r); res.updated++; }
          else res.skipped++;
        }
      }
    });
    await S.load();
    IT.bus.emit('data:changed', { stores: IT.STORES, import: true });
    return res;
  }

  /* ---------- CSV ---------- */
  function csvCell(v) {
    if (v === null || v === undefined) return '';
    if (Array.isArray(v)) v = v.join(' | ');

    return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  function toCsv(rows, cols) {
    const head = cols.map((c) => csvCell(c[0])).join(',');
    const body = rows.map((r) => cols.map((c) => csvCell(typeof c[1] === 'function' ? c[1](r) : r[c[1]])).join(','));
    return '﻿' + [head].concat(body).join('\r\n');
  }

  const CSV_SETS = {
    vocabulary: { label: 'Vocabulary Bank', build(S) {
      return toCsv(S.all('vocab'), [['Word', 'word'], ['IPA', 'ipa'], ['Part of speech', 'pos'], ['Vietnamese meaning', 'meaningVi'], ['English definition', 'definitionEn'], ['Examples', 'examples'], ['Collocations', 'collocations'], ['Synonyms', 'synonyms'], ['Antonyms', 'antonyms'], ['Topic', 'topic'], ['Notes', 'notes'], ['Source skill', (v) => C.SKILL_LABEL[v.sourceSkill] || 'Manual'], ['Linked lessons', (v) => S.linksOfVocab(v.id).length], ['Date added', (v) => IT.Stats.vocabDate(v)], ['Status', 'status'], ['Level', 'level'], ['Use actively', (v) => (v.activeTarget ? 'yes' : '')], ['Next review', (v) => (v.srs && v.srs.due) || ''], ['ID', 'id']]);
    } },
    reading: { label: 'Reading (one row per passage)', build(S) { return rlRows(S, 'readingTests', 'reading'); } },
    listening: { label: 'Listening (one row per section)', build(S) { return rlRows(S, 'listeningTests', 'listening'); } },
    essays: { label: 'Writing essays', build(S) {
      return toCsv(S.all('essays'), [['Task', (e) => 'Task ' + e.task], ['Title', 'title'], ['Prompt', 'prompt'], ['Type', 'type'], ['Topic', 'topic'], ['Date', 'date'], ['Minutes', 'durationMin'], ['Words', 'wordCount'], ['Self band', 'selfBand'], ['Status', 'status'], ['Corrections', (e) => S.all('corrections').filter((c) => c.essayId === e.id).length], ['Revisions', (e) => S.all('revisions').filter((r) => r.essayId === e.id).length], ['Latest band', (e) => { const b = IT.Stats.essayBand(S, e); return b ? b.band + ' (' + b.source + ')' : ''; }], ['Notes', 'notes'], ['Summary & Brainstorm', (e) => (IT.WritingPlan ? IT.WritingPlan.planText(e) : '')], ['Original', 'original'], ['ID', 'id']]);
    } },
    corrections: { label: 'Writing corrections', build(S) {
      return toCsv(S.all('corrections'), [['Essay', (c) => { const e = S.byId('essays', c.essayId); return e ? e.title || e.prompt : ''; }], ['Task', (c) => { const e = S.byId('essays', c.essayId); return e ? e.task : ''; }], ['Date received', 'date'], ['Source', 'source'], ['Overall', (c) => c.scores.overall], ['TA/TR', (c) => c.scores.ta], ['CC', (c) => c.scores.cc], ['LR', (c) => c.scores.lr], ['GRA', (c) => c.scores.gra], ['Comments', 'comments'], ['Corrected text', 'correctedText'], ['ID', 'id']]);
    } },
    revisions: { label: 'Writing revisions', build(S) {
      return toCsv(S.all('revisions'), [['Essay', (r) => { const e = S.byId('essays', r.essayId); return e ? e.title || e.prompt : ''; }], ['Version', 'versionNo'], ['Date', 'date'], ['Words', 'wordCount'], ['Change notes', 'changeNotes'], ['Fixed mistakes', 'fixedMistakes'], ['Repeated mistakes', 'repeatedMistakes'], ['Structures to apply', 'structuresToApply'], ['Content', 'content'], ['ID', 'id']]);
    } },
    speaking: { label: 'Speaking sessions', build(S) {
      return toCsv(S.all('speakingSessions'), [['Date', 'date'], ['Part', 'part'], ['Topic', 'topic'], ['Question', 'questionText'], ['Prep (s)', 'prepSec'], ['Answer (s)', 'answerSec'], ['FC', (s) => s.criteria.fc], ['LR', (s) => s.criteria.lr], ['GRA', (s) => s.criteria.gra], ['P', (s) => s.criteria.p], ['Self band', 'selfBand'], ['Recordings', (s) => U.uniq([s.audioBlobId].concat((s.recordings || []).map((r) => r.blobId)).filter(Boolean)).length], ['Daily challenge', (s) => (s.isChallenge ? 'yes' : '')], ['Transcript', 'transcript'], ['Answer notes', 'answer'], ['Notes', 'notes'], ['ID', 'id']]);
    } },
    mistakes: { label: 'Mistake Bank', build(S) {
      return toCsv(S.all('mistakes'), [['Date', 'date'], ['Skill', (m) => C.SKILL_LABEL[m.skill]], ['Type', 'category'], ['Source', (m) => refLabel(S, m)], ['Question / context', 'context'], ['Correct answer', 'correction'], ['Cause', 'cause'], ['Lesson', 'lesson'], ['Fixed', (m) => (m.fixed ? 'yes' : 'no')], ['Same-type count', (m) => IT.Stats.recurrence(S, m)], ['ID', 'id']]);
    } },
    knowledge: { label: 'Knowledge notes (Reading, Writing T1, T2)', build(S) {
      return toCsv(S.all('knowledge'), [['Collection', (n) => C.KNOWLEDGE_SCOPE_LABEL[n.scope]], ['Category', 'category'], ['Title', 'title'], ['Content', 'content'], ['Examples', 'examples'], ['Tags', 'tags'], ['Links', (n) => (n.links || []).map((l) => l.url)], ['Images', (n) => (n.images || []).length], ['Pinned', (n) => (n.pinned ? 'yes' : '')], ['Status', 'status'], ['Next review', (n) => (n.srs && n.srs.due) || ''], ['Created', 'createdAt'], ['Updated', 'updatedAt'], ['ID', 'id']]);
    } },

    const rows = [];

    (m[2] || '').replace(/([.#])([\w-]+)/g, (_, t, n) => { if (t === '.') el.classList.add(n); else el.id = n; });

    if (attrs && (typeof attrs !== 'object' || attrs instanceof Node || Array.isArray(attrs))) { kids.unshift(attrs); attrs = null; }
    if (attrs) Object.keys(attrs).forEach((k) => {
      const v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'class') String(v).split(/\s+/).filter(Boolean).forEach((c) => el.classList.add(c));
