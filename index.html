(function (IT) {
  'use strict';
  const { h, icon, btn, iconBtn, input, select, readForm, toast, clear, card, pageHead, empty, stat, pill, statusPill, skillTag, kv, tabs } = IT.UI;
  const S = IT.Store, U = IT.U, C = IT.C, St = IT.Stats, Ch = IT.Charts;
  const SOURCES = ['reading', 'listening', 'writing1', 'writing2', 'speaking', 'manual'];
  const srcLabel = (k) => (k === 'manual' ? 'Added manually' : C.SKILL_LABEL[k]);

  function subnav(active) {
    const due = S.all('vocab').filter((v) => v.status !== 'mastered' && IT.SRS.isDue(v)).length;
    return h('div.mb-4', tabs([
      { key: '', label: 'Bank', count: S.all('vocab').length },
      { key: 'review', label: 'Review (spaced repetition)', count: due },
      { key: 'practice', label: 'Practice' },
      { key: 'history', label: 'History & stats' },
    ], active, (k) => IT.App.go('#/vocab' + (k ? '/' + k : ''))));
  }

  /* ---------------- bank ---------------- */
  function renderBank(root, query) {
    const st = { q: '', topic: '', status: '', source: '', level: '', from: '', to: '', active: '' };
    root.append(pageHead('Vocabulary Bank', 'One shared bank for Reading, Listening, Writing and Speaking. A word exists once; lessons only link to it.', [btn('Add word', () => IT.Vocab.openWordForm(null, {}), { variant: 'primary', icon: 'plus' })]), subnav(''));
    const statsBox = h('div.grid-4.mb-4');
    const topics = () => U.uniq(S.all('vocab').map((v) => v.topic).filter(Boolean)).sort();
    const topicSel = select('topic', topics(), '', { empty: 'All topics' });
    const filters = h('div.filters',
      h('div.search', icon('search', 16), input('q', '', { placeholder: 'Search word, meaning, definition, collocation…' })),
      topicSel,
      select('status', C.VOCAB_STATUS.map((s) => [s, C.VOCAB_STATUS_LABEL[s]]), '', { empty: 'Any status' }),
      select('source', SOURCES.map((s) => [s, srcLabel(s)]), '', { empty: 'Any source skill' }),
      select('level', [['passive', 'Passive'], ['active', 'Active']], '', { empty: 'Any level' }),
      select('active', [['yes', 'Marked to use actively'], ['used', 'Used in Writing/Speaking']], '', { empty: 'Any usage' }),
      input('from', '', { type: 'date', attrs: { title: 'Added from', 'aria-label': 'Added from' } }),
      input('to', '', { type: 'date', attrs: { title: 'Added to', 'aria-label': 'Added to' } }));
    const tableBox = h('div');
    root.append(statsBox, card(null, h('div', filters, tableBox)));
    filters.addEventListener('input', U.debounce(() => { Object.assign(st, readForm(filters)); drawTable(); }, 150));

    function usedSet() { return new Set(S.all('vocabLinks').filter((l) => ['writing1', 'writing2', 'speaking'].includes(l.skill) && l.role === 'used').map((l) => l.vocabId)); }
    function rows() {
      const q = U.normalizeWord(st.q);
      const used = usedSet();
      return S.all('vocab').filter((v) => {
        if (q && ![v.wordKey, v.meaningVi, v.definitionEn, (v.collocations || []).join(' '), (v.synonyms || []).join(' '), v.notes].join(' ').toLowerCase().includes(q)) return false;
        if (st.topic && v.topic !== st.topic) return false;
        if (st.status && v.status !== st.status) return false;
        if (st.source && (v.sourceSkill || 'manual') !== st.source) return false;
        if (st.level && v.level !== st.level) return false;
        if (st.active === 'yes' && !v.activeTarget) return false;
        if (st.active === 'used' && !used.has(v.id)) return false;
        if (!U.inRange(St.vocabDate(v), st.from || null, st.to || null)) return false;
        return true;
      });
    }
    function drawStats() {
      clear(statsBox);
      const vs = St.vocabStats(S);
      statsBox.append(
        stat('Unique words', vs.total, vs.added + ' total · never double-counted', { class: 'k-vocabulary' }),
        stat('Due for review', vs.due, vs.due ? h('a', { href: '#/vocab/review' }, 'Start review →') : 'Nothing due'),
        stat('Mastered', vs.byStatus.mastered, 'New ' + vs.byStatus.new + ' · Learning ' + vs.byStatus.learning + ' · Reviewing ' + vs.byStatus.reviewing),
        stat('Active usage', vs.active, vs.usedInWS + ' used in W/S · ' + vs.activeTargets + ' targeted'));
      // keep the topic filter options current
      const cur = topicSel.value; clear(topicSel); topicSel.appendChild(h('option', { value: '' }, 'All topics')); topics().forEach((t) => topicSel.appendChild(h('option', { value: t, selected: t === cur }, t)));
    }
    function drawTable() {
      clear(tableBox);
      const used = usedSet();
      // Exactly 7 visible columns. Every other field stays in the record and remains filterable / editable
      // (row click → word page; edit / delete icons sit inside the Word cell).
      tableBox.appendChild(IT.Table([
        { key: 'word', label: 'Word / Phrase', render: (v) => h('div.word-cell', h('a.t-main', { href: '#/vocab/word/' + v.id }, v.word),
          h('span.word-acts', iconBtn('edit', 'Edit word', () => IT.Vocab.openWordForm(v, {})), iconBtn('trash', 'Delete word', () => IT.Vocab.confirmDeleteWord(v)))), sort: (v) => v.wordKey },
        { key: 'pos', label: 'Part of Speech', render: (v) => h('i.muted', v.pos || '') },
        { key: 'ipa', label: 'IPA', render: (v) => h('span.muted.nowrap', v.ipa || '') },
        { key: 'topic', label: 'Topic' },
        { key: 'meaningVi', label: 'Vietnamese Definition', render: (v) => v.meaningVi || '' },
        { key: 'examples', label: 'Example Sentences', sortable: false, render: (v) => (v.examples || []).length ? h('span.small', { title: v.examples.join('\n') }, '“' + v.examples[0] + '”', v.examples.length > 1 ? h('span.muted.xs', ' +' + (v.examples.length - 1) + ' more') : null) : '' },
        { key: 'synonyms', label: 'Synonyms', sortable: false, render: (v) => (v.synonyms || []).join(', ') },
      ], {
        rows: U.sortBy(rows(), (v) => (St.vocabDate(v) || '') + (v.createdAt || ''), true), sortKey: null, noun: 'words', showCount: true, pageSize: 30,
        onRowClick: (v) => IT.App.go('#/vocab/word/' + v.id),
        empty: S.all('vocab').length ? empty('No words match these filters') : empty('Your Vocabulary Bank is empty', 'Add words here, or from the New Vocabulary area inside any Reading, Listening, Writing or Speaking lesson.', btn('Add first word', () => IT.Vocab.openWordForm(null, {}), { variant: 'primary', icon: 'plus' })),
      }));
    }
    drawStats(); drawTable();
    return { refresh() { drawStats(); drawTable(); } };
  }

  /* ---------------- word detail ---------------- */
  function renderWord(root, id) {
    function draw() {
      clear(root);
      const v = S.byId('vocab', id);
      if (!v) { root.appendChild(empty('Word not found', 'It may have been deleted.', btn('Back to Vocabulary', () => IT.App.go('#/vocab')))); return; }
      const links = S.linksOfVocab(id);
      const reviews = U.sortBy(S.all('vocabReviews').filter((r) => r.vocabId === id), (r) => r.at || r.date, true);
      root.append(
        h('div.crumbs', h('a', { href: '#/vocab' }, 'Vocabulary'), icon('chevronRight', 12), h('span', v.word)),
        pageHead(v.word, [v.ipa, v.pos].filter(Boolean).join(' · ') || null, [btn('Delete', async () => { if (await IT.Vocab.confirmDeleteWord(v)) IT.App.go('#/vocab'); }, { variant: 'danger', icon: 'trash' }), btn('Edit word', () => IT.Vocab.openWordForm(v, {}), { variant: 'primary', icon: 'edit' })]),
        h('div.grid-2',
          card('Details', h('div.stack', h('div.row', statusPill(v.status), pill(C.VOCAB_LEVEL[v.level]), v.activeTarget ? pill('Use actively', 'accent') : null, skillTag(v.sourceSkill || 'manual')),
            kv([['Vietnamese', v.meaningVi], ['Definition', v.definitionEn], ['Topic', v.topic], ['Synonyms', (v.synonyms || []).join(', ')], ['Antonyms', (v.antonyms || []).join(', ')], ['Date added', U.fmtDate(St.vocabDate(v))], ['Next review', v.srs && v.srs.due ? U.fmtDate(v.srs.due) + ' (interval ' + v.srs.interval + 'd, ease ' + v.srs.ease + ')' : 'Not reviewed yet'], ['Notes', v.notes]]))),
          card('Examples & collocations', h('div.stack',
            (v.examples || []).length ? h('ul', { style: { margin: 0, paddingLeft: '18px' } }, v.examples.map((x) => h('li', x))) : h('p.muted.small', 'No example sentences.'),
            (v.collocations || []).length ? h('div.row', v.collocations.map((x) => pill(x, 'accent'))) : h('p.muted.small', 'No collocations.')))),
        h('div.mt-4'),
        card('Linked lessons (' + links.length + ')', links.length ? h('div.vp-list', links.map((l) => {
          const def = C.REF[l.refType]; const rec = def ? S.byId(def.store, l.refId) : null;
          const partLabel = l.subRefId ? (/^p\d/.test(l.subRefId) ? ' · Passage ' + l.subRefId.slice(1) : /^s\d/.test(l.subRefId) ? ' · Section ' + l.subRefId.slice(1) : '') : '';
          return h('div.vp-item', h('div.grow.stack-sm', { style: { gap: '2px' } },
            h('div.row', skillTag(l.skill), rec && def.route ? h('a.bold', { href: def.route(rec.id, rec) }, (rec.name || rec.title || rec.questionText || rec.text || 'Lesson') + partLabel) : h('span.muted', '(lesson deleted)'), l.role === 'used' ? pill('used', 'success') : null, l.useActively ? pill('use actively', 'accent') : null),
            l.context ? h('div.ctx', '“' + l.context + '”') : null),
            iconBtn('edit', 'Edit link', () => IT.Vocab.openLinkForm(v, l, { allowRole: ['writing1', 'writing2', 'speaking'].includes(l.skill) })),
            iconBtn('unlink', 'Unlink (keeps the word)', async () => { await S.unlinkVocab(l.id); toast('Link removed'); }));
        })) : h('p.muted.small', 'Not linked to any lesson yet.')),
        h('div.mt-4'),
        card('Review history (' + reviews.length + ')', reviews.length ? IT.Table([
          { key: 'date', label: 'Date', render: (r) => U.fmtDateTime(r.at || r.date) },
          { key: 'mode', label: 'Mode', render: (r) => MODE_LABEL[r.mode] || r.mode },
          { key: 'grade', label: 'Result', render: (r) => pill(r.grade, r.correct ? 'success' : 'danger') },
          { key: 'answer', label: 'Your answer' },
        ], { rows: reviews, sortKey: 'date', responsive: false, pageSize: 10 }) : h('p.muted.small', 'No reviews yet.')));
    }
    draw();
    return { refresh: draw };
  }

  /* ---------------- SRS review / practice ---------------- */
  const MODE_LABEL = { flashcard: 'Flashcard', 'en-vi': 'English → Vietnamese', 'vi-en': 'Vietnamese → English', cloze: 'Fill in the blank', srs: 'Spaced repetition' };
  const GRADE_INFO = [['again', 'Again', 'tomorrow'], ['hard', 'Hard', 'a bit longer'], ['good', 'Good', 'normal'], ['easy', 'Easy', 'much later']];

  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function clozeOf(v) {
    const ex = (v.examples || []).find((e) => e.toLowerCase().includes(v.word.toLowerCase()));
    if (!ex) return null;
    const re = new RegExp(v.word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
    return ex.replace(re, '_____');
  }

  /**
   * Runs a session. mode: flashcard | en-vi | vi-en | cloze. Every answer is saved as a review and reschedules the word.
   */
  function session(box, words, mode, onDone) {
    let i = 0, correct = 0, revealed = false;
    const results = [];
    function next() {
      clear(box);
      if (i >= words.length) {
        box.appendChild(h('div.fc-wrap', card(null, h('div.stack', { style: { alignItems: 'center', textAlign: 'center' } },
          h('h2', 'Session complete'), h('p.muted', words.length + ' word(s) reviewed · ' + correct + ' remembered (' + Math.round((correct / Math.max(1, words.length)) * 100) + '%)'),
          h('p.xs.muted', 'Every answer was saved to the review history and the next review date was updated.'),
          h('div.row', btn('Back', onDone), btn('Review again', () => { i = 0; correct = 0; next(); }, { variant: 'primary' }))))));
        return;
      }
      const v = words[i];
      revealed = false;
      const progressEl = h('div.row.between', h('span.small.muted', MODE_LABEL[mode] + ' · ' + (i + 1) + ' / ' + words.length), IT.UI.progress((i / words.length) * 100, { kind: null }));
      progressEl.lastChild.style.width = '50%';
      const wrap = h('div.fc-wrap', progressEl);
      box.appendChild(wrap);
      const grade = async (g, answer) => {
        try { await S.reviewVocab(v.id, g, mode, { answer }); } catch (e) { IT.UI.fail(e); }
        if (g !== 'again') correct++;
        results.push({ v, g }); i++; next();
      };
      const gradeRow = () => h('div.grade-row', GRADE_INFO.map(([g, l, s]) => h('button.btn.g-' + g, { type: 'button', onclick: () => grade(g) }, l, h('small', s))));
      if (mode === 'flashcard') {
        const back = h('div.stack-sm', { hidden: true },
          h('div.fc-answer', v.meaningVi || v.definitionEn || '(no meaning saved)'),
          v.definitionEn && v.meaningVi ? h('div.fc-sub.small', v.definitionEn) : null,
          (v.examples || [])[0] ? h('div.fc-sub.small', { style: { fontStyle: 'italic' } }, '“' + v.examples[0] + '”') : null,
          (v.collocations || []).length ? h('div.fc-sub.xs', v.collocations.slice(0, 3).join(' · ')) : null);
        const gr = gradeRow(); gr.hidden = true;
        const fc = h('div.flashcard', { tabindex: '0', role: 'button', 'aria-label': 'Flip card', onclick: flip, onkeydown: (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } } },
          h('div.fc-word', v.word), h('div.fc-sub', [v.ipa, v.pos].filter(Boolean).join(' · ')), back, h('div.xs.muted', { class: 'hint-flip' }, 'Click or press Space to flip'));
        function flip() { if (revealed) return; revealed = true; back.hidden = false; gr.hidden = false; fc.querySelector('.hint-flip').remove(); }
        wrap.append(fc, gr);
        fc.focus();
        return;
      }
      // typed modes
      let prompt, expected, auto;
      if (mode === 'en-vi') { prompt = h('div.stack-sm', h('div.fc-word', v.word), h('div.fc-sub', [v.ipa, v.pos].filter(Boolean).join(' · '))); expected = v.meaningVi || v.definitionEn || ''; auto = false; }
      else if (mode === 'vi-en') { prompt = h('div.stack-sm', h('div.fc-answer', v.meaningVi || v.definitionEn), v.pos ? h('div.fc-sub', v.pos) : null); expected = v.word; auto = true; }
      else { prompt = h('div.stack-sm', h('div.fc-answer', clozeOf(v)), h('div.fc-sub.small', v.meaningVi || '')); expected = v.word; auto = true; }
      const ans = input('answer', '', { placeholder: mode === 'en-vi' ? 'Type the meaning in Vietnamese (or English)' : 'Type the word / phrase' });
      const feedback = h('div.stack-sm');
      const check = () => {
        if (revealed) return;
        revealed = true; ans.disabled = true;
        const ok = auto && U.normalizeWord(ans.value) === U.normalizeWord(expected);
        if (auto) {
          feedback.append(h('div.quiz-result.bold.' + (ok ? 'ok' : 'bad'), ok ? '✓ Correct' : '✘ Correct answer: ' + expected));
          feedback.appendChild(h('div.grade-row', ok ? [h('button.btn.g-hard', { type: 'button', onclick: () => grade('hard', ans.value) }, 'Hard'), h('button.btn.g-good', { type: 'button', onclick: () => grade('good', ans.value) }, 'Good'), h('button.btn.g-easy', { type: 'button', onclick: () => grade('easy', ans.value) }, 'Easy')] : [h('button.btn.g-again', { type: 'button', onclick: () => grade('again', ans.value) }, 'Continue')]));
        } else {
          feedback.append(h('div', h('span.muted.small', 'Saved meaning: '), h('b', expected)), h('p.small.muted', 'Compare with your answer and grade yourself:'), gradeRow());
        }
        const first = feedback.querySelector('button'); if (first) first.focus();
      };
      ans.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); check(); } });
      wrap.append(h('div.flashcard', { style: { cursor: 'default' } }, prompt), ans, h('div.row.end', btn("I don't know", () => { ans.value = ''; check(); }, { variant: 'ghost' }), btn('Check', check, { variant: 'primary' })), feedback);
      ans.focus();
    }
    next();
  }

  function renderReview(root) {
    root.append(pageHead('Review', 'Spaced repetition (SM-2). Words you know well come back less often.'), subnav('review'));
    const box = h('div');
    root.appendChild(box);
    function start() {
      clear(box);
      const due = U.sortBy(S.all('vocab').filter((v) => v.status !== 'mastered' && IT.SRS.isDue(v)), (v) => (v.srs && v.srs.due) || '0');
      if (!due.length) {
        const nextDue = U.sortBy(S.all('vocab').filter((v) => v.srs && v.srs.due), (v) => v.srs.due)[0];
        box.appendChild(empty('Nothing due right now', S.all('vocab').length ? (nextDue ? 'Next review: ' + U.fmtDate(nextDue.srs.due) + ' (' + nextDue.word + ').' : 'All words are mastered.') + ' You can still practise any words in Practice.' : 'Add words to your Vocabulary Bank first.', btn('Practice instead', () => IT.App.go('#/vocab/practice'), { variant: 'primary' })));
        return;
      }
      const limit = Math.min(due.length, 30);
      box.appendChild(card(null, h('div.row.between', h('div', h('h3', due.length + ' word(s) due'), h('p.small.muted', 'This session reviews ' + limit + '. New words are included.')), btn('Start review', () => session(box, due.slice(0, limit), 'flashcard', start), { variant: 'primary', icon: 'play' }))));
    }
    start();
    return { refresh() { /* keep session state */ } };
  }

  function renderPractice(root, query) {
    root.append(pageHead('Practice', 'Flashcards, meaning quizzes and fill-in-the-blank. Results update your review schedule.'), subnav('practice'));
    const box = h('div');
    root.appendChild(box);
    function setup() {
      clear(box);
      const topics = U.uniq(S.all('vocab').map((v) => v.topic).filter(Boolean)).sort();
      const f = h('div.form-grid.cols-4',
        IT.UI.field('Mode', select('mode', Object.keys(MODE_LABEL).filter((m) => m !== 'srs').map((m) => [m, MODE_LABEL[m]]), query.mode || 'flashcard')),
        IT.UI.field('Topic', select('topic', topics, '', { empty: 'All topics' })),
        IT.UI.field('Status', select('status', C.VOCAB_STATUS.map((s) => [s, C.VOCAB_STATUS_LABEL[s]]), '', { empty: 'Any status' })),
        IT.UI.field('Source skill', select('source', SOURCES.map((s) => [s, srcLabel(s)]), '', { empty: 'Any' })),
        IT.UI.field('Only words marked for active use', select('active', [['yes', 'Yes']], '', { empty: 'No' })),
        IT.UI.field('Number of words', input('n', 20, { type: 'number', min: 1, max: 200 })));
      const info = h('p.small.muted');
      const pick = () => {
        const d = readForm(f);
        let ws = S.all('vocab').filter((v) => (!d.topic || v.topic === d.topic) && (!d.status || v.status === d.status) && (!d.source || (v.sourceSkill || 'manual') === d.source) && (!d.active || v.activeTarget));
        if (d.mode === 'cloze') ws = ws.filter(clozeOf);
        if (d.mode === 'en-vi' || d.mode === 'vi-en') ws = ws.filter((v) => v.meaningVi || v.definitionEn);
        return { d, ws };
      };
      const upd = () => { const { d, ws } = pick(); info.textContent = ws.length + ' matching word(s)' + (d.mode === 'cloze' ? ' with an example sentence that contains the word' : '') + '.'; };
      f.addEventListener('input', upd); f.addEventListener('change', upd); upd();
      box.appendChild(card('Set up a practice session', h('div.stack', f, info, h('div.row.end', btn('Start', () => {
        const { d, ws } = pick();
        if (!ws.length) { toast('No words match. Change the filters' + (d.mode === 'cloze' ? ' or add example sentences that contain the word.' : '.'), 'error'); return; }
        session(box, shuffle(ws).slice(0, Math.max(1, Number(d.n) || 20)), d.mode, setup);
      }, { variant: 'primary', icon: 'play' })))));
    }
    if (!S.all('vocab').length) box.appendChild(empty('No words to practise', 'Add words to your Vocabulary Bank first.', btn('Add word', () => IT.Vocab.openWordForm(null, {}), { variant: 'primary' })));
    else setup();
    return { refresh() {} };
  }

  function renderHistory(root) {
    root.append(pageHead('Review history & statistics'), subnav('history'));
    const box = h('div.stack-lg');
    root.appendChild(box);
    function draw() {
      clear(box);
      const revs = S.all('vocabReviews');
      const vs = St.vocabStats(S);
      const last30 = St.vocabStats(S, U.addDays(U.today(), -29), U.today());
      box.appendChild(h('div.grid-4',
        stat('Reviews (all time)', revs.length, U.uniq(revs.map((r) => r.vocabId)).length + ' different words'),
        stat('Retention (all time)', U.fmtPct(vs.retention), 'Share of answers remembered'),
        stat('Retention (30 days)', U.fmtPct(last30.retention), last30.reviews + ' reviews'),
        stat('Mastered', vs.byStatus.mastered, U.fmtPct(U.pct(vs.byStatus.mastered, vs.total)) + ' of the bank')));
      const days = Array.from({ length: 30 }, (_, i) => U.addDays(U.today(), i - 29));
      const byDay = U.groupBy(revs, 'date');
      box.appendChild(h('div.grid-2',
        card('Reviews per day (30 days)', Ch.bars(days.map((d) => ({ label: U.fmtDate(d, { day: '2-digit' }), value: (byDay[d] || []).length, key: 'vocabulary' })), { labels: false, empty: 'No reviews in the last 30 days.' })),
        card('Words by status', Ch.donut(C.VOCAB_STATUS.map((s, i) => ({ key: ['accent', 'warning', 'listening', 'success'][i], label: C.VOCAB_STATUS_LABEL[s], value: vs.byStatus[s] })), { empty: 'No words yet.', centerSub: 'words' }))));
      box.appendChild(card('Words added by source skill (unique)', Ch.bars(SOURCES.map((k) => ({ label: k === 'manual' ? 'Manual' : C.SKILL_LABEL[k].replace('Writing Task ', 'W T'), value: vs.bySource[k] || 0, key: C.SKILL_BUCKET[k] || 'other' })), { empty: 'No words yet.' })));
      box.appendChild(card('Recent reviews', revs.length ? IT.Table([
        { key: 'at', label: 'When', render: (r) => U.fmtDateTime(r.at || r.date), sort: (r) => r.at || r.date },
        { key: 'word', label: 'Word', render: (r) => { const v = S.byId('vocab', r.vocabId); return v ? h('a', { href: '#/vocab/word/' + v.id }, v.word) : h('span.muted', '(deleted)'); } },
        { key: 'mode', label: 'Mode', render: (r) => MODE_LABEL[r.mode] || r.mode },
        { key: 'grade', label: 'Result', render: (r) => pill(r.grade, r.correct ? 'success' : 'danger') },
      ], { rows: revs, sortKey: 'at', pageSize: 20, noun: 'reviews', showCount: true }) : empty('No reviews yet', 'Start a review or practice session.')));
    }
    draw();
    return { refresh: draw };
  }

  IT.views.vocab = {
    render(root, params, query) {
      if (params[0] === 'word' && params[1]) return renderWord(root, params[1]);
      if (params[0] === 'review') return renderReview(root);
      if (params[0] === 'practice') return renderPractice(root, query || {});
      if (params[0] === 'history') return renderHistory(root);
      return renderBank(root, query || {});
    },
  };

<script>/* js/views/rl.js */

(function (IT) {

          const d = readForm(form);

    /* ---------- list ---------- */
    function renderList(root, params, query) {

      const statsBox = h('div.grid-4');
      const filters = h('div.filters',
        h('div.search', icon('search', 16), input('q', st.q, { placeholder: 'Search tests, ' + PART.toLowerCase() + ' titles, topics…' })),

        input('to', '', { type: 'date', attrs: { 'aria-label': 'To date', title: 'To date' } }),
        select('band', [['6', 'Band ≥ 6'], ['7', 'Band ≥ 7'], ['8', 'Band ≥ 8'], ['lt6', 'Band < 6']], '', { empty: 'Any band' }));

        const all = S.all(store);
        tableBox.appendChild(IT.Table(cols, {
          rows: rows(), sortKey: 'date', sortDesc: true, noun: 'tests', showCount: true,
          onRowClick: (t) => IT.App.go(base + '/' + t.id),
          empty: all.length ? empty('No tests match these filters') : empty('No ' + label + ' tests yet', 'Create your first full ' + label + ' test (' + N + ' ' + PART.toLowerCase() + 's) to start tracking accuracy, time and estimated band.', btn('New ' + label + ' test', openNew, { variant: 'primary', icon: 'plus' })),
        }));
      }
      function drawStats() {
        clear(statsBox);
        const a = St.rlAnalytics(S, kind);
        statsBox.append(
          stat('Tests completed', a.tests, 'Full ' + N + '-' + PART.toLowerCase() + ' tests', { class: 'k-' + kind }),
          stat('Average est. band', U.fmtBand(a.avgBand), 'Unofficial estimate'),
          stat('Average accuracy', U.fmtPct(a.avgAcc)),
          R ? stat('Average time / test', a.avgMinutes ? U.fmtMinutes(a.avgMinutes) : '—', 'Target: 60m') : stat('Total replays', a.totalReplays, a.avgMinutes ? 'Avg time ' + U.fmtMinutes(a.avgMinutes) : ''));
        clear(analytics);
        const tests = U.sortBy(S.all(store), (t) => t.date);
        analytics.append(
          card('Accuracy by ' + PART.toLowerCase(), Ch.hbars(a.byPart.map((p, i) => ({ label: PART + ' ' + (i + 1), value: p.acc, key: kind, sub: p.total ? p.correct + '/' + p.total : '' })).filter((x) => x.value !== null), { empty: 'No scored ' + PART.toLowerCase() + 's yet.', warnBelow: 60 })),
          card('Accuracy by question type', Ch.hbars(U.sortBy(Object.entries(a.byType), ([, v]) => v.acc).map(([k, v]) => ({ label: k, value: v.acc, sub: v.correct + '/' + v.total })), { empty: 'Add question types to your ' + PART.toLowerCase() + 's to see this.', warnBelow: 60 })),
          card('Estimated band over time', Ch.line([{ key: kind, label: label, points: tests.map((t) => ({ date: t.date, value: (St.testTotals(t, kind).est || {}).band })).filter((p) => p.value !== undefined) }], { min: 3, max: 9, targets: { [kind]: S.settings.targets[kind] }, fmt: (v) => v.toFixed(1), empty: 'Complete a test to see your trend.' })),
          card(R ? 'Time per test' : 'Time & replays per test', Ch.bars(tests.slice(-12).map((t) => ({ label: U.fmtDate(t.date, { day: '2-digit', month: 'short' }), value: St.testTotals(t, kind).minutes, key: kind })), { fmt: (v) => Math.round(v) + 'm', empty: 'Enter ' + PART.toLowerCase() + ' times to see this.' })));

    }

    /* ---------- editor ---------- */
    function renderEditor(root, id, query) {
      const saved = S.byId(store, id);
      if (!saved) { root.appendChild(empty('Test not found', 'It may have been deleted.', btn('Back to ' + label, () => IT.App.go(base)))); return null; }
      let draft = U.clone(saved);
      let active = Math.max(0, Math.min(N - 1, (Number(query.part) || 1) - 1));

      const saveState = h('span.muted.xs', 'All changes saved');
      const saveBtn = btn('Save test', save, { variant: 'primary', icon: 'check', disabled: true });
      async function save() {
        try {
          const rec = await S.save(store, draft);
          draft = U.clone(rec); IT.App.setDirty(false); saveBtn.disabled = true; saveState.textContent = 'Saved ' + U.timeStr();
          drawSummary(); drawPartTabs(); toast('Test saved', 'success');
        } catch (e) { fail(e); }
      }
      async function del() {
        const imp = S.deleteImpact(store, id);
        const r = await confirm({ title: 'Delete "' + saved.name + '"?', danger: true, confirmLabel: 'Delete test',
          message: h('div.stack-sm', h('p', 'This permanently deletes the test and its ' + N + ' ' + PART.toLowerCase() + 's' + (imp.attempts ? ', plus ' + imp.attempts + ' retake(s)' : '') + '. This cannot be undone.'),
            h('p.small.muted', imp.links + ' vocabulary link(s) will be removed — the words stay in your Vocabulary Bank.' + (imp.logs ? ' ' + imp.logs + ' study-log entr(ies) will be kept but unlinked.' : ''))),
          checkbox: imp.mistakes ? { label: 'Also delete the ' + imp.mistakes + ' mistake(s) logged for this test (otherwise they stay in the Mistake Bank)', checked: false } : null });

        h('div.crumbs', h('a', { href: base }, label), icon('chevronRight', 12), h('span', saved.name)),
        pageHead(saved.name, U.fmtDate(saved.date) + (saved.startTime ? ' · started ' + saved.startTime : ''), [saveState, btn('Delete', del, { variant: 'danger', icon: 'trash' }), saveBtn]));

          field('Test link (URL)', h('div.row-nw', urlIn, openBtn), { full: true, hint: 'Link to where this test is (website, Google Drive, PDF…).' }),

      })());

          h('div.row', { style: { gap: '28px', alignItems: 'flex-end' } },
            h('div', h('div.eyebrow', 'Score'), h('div.score-big', t.total ? String(t.correct) : '—', h('small', ' / ' + (t.total || '—')))),
            h('div', h('div.eyebrow', 'Accuracy'), h('div.score-big', t.acc === null ? '—' : Math.round(t.acc) + '%')),
            h('div', h('div.eyebrow', 'Est. band'), h('div.score-big', t.est ? U.fmtBand(t.est.band) : '—'), h('div.unoff', 'Unofficial' + (t.est && t.est.scaled ? ' · scaled to 40' : ''))),
            h('div', h('div.eyebrow', 'Total time'), h('div.score-big', t.minutes ? U.fmtMinutes(t.minutes) : '—')),

          h('div.parts-summary.grow', { style: { minWidth: '260px' } }, t.parts.map((p, i) => h('div.part-card.k-' + kind,

            h('span.pt-name', PART + ' ' + (i + 1)), h('span.xs.ellipsis', p.title || h('span.muted', 'Untitled')), h('span.pt-score', pt.total ? pt.correct + '/' + pt.total + ' · ' + Math.round(pt.acc) + '%' : 'No score yet')));

      }

      function qtypeEditor(p) {
        const dl = h('datalist#qtypes-' + kind, QTYPES.map((q) => h('option', { value: q })));
        const tb = h('tbody');

        }

        return h('div.stack-sm', dl, h('table.qtype-table', h('thead', h('tr', h('th', 'Question type'), h('th', 'Questions'), h('th', 'Correct'), h('th', ''))), tb),
          h('div.row.between', btn('Add question type', () => { p.questionTypes.push({ type: '', total: 0, correct: 0 }); drawRows(); markDirty(); }, { size: 'sm', icon: 'plus', variant: 'ghost' }), totals));
      }

      function audioBlock(p) {

      }

      function drawPart() {
        clear(partBox);
        const p = draft.parts[active];
        const f = h('div.form-grid',
          field(R ? 'Passage title' : 'Section name / topic', input('title', p.title)),

          R ? field('Reading text (paste) — optional', textarea('content', p.content, { rows: 6, placeholder: 'Paste the passage text here, or use the source link below.' }), { full: true }) : null,
          field('Time spent (minutes)', input('durationMin', p.durationMin || '', { type: 'number', min: 0 })),
          !R ? field('Number of replays', input('replays', p.replays || 0, { type: 'number', min: 0 })) : null,

          card(PART + ' ' + (active + 1) + ' — details', h('div.stack', f, !R && U.isUrl(p.transcriptUrl) ? h('div', linkOut(p.transcriptUrl, 'Open transcript')) : null), { class: 'k-' + kind }),

      function retakes(pid, idx) {

          clear(list);
          const as = U.sortBy(S.all('sectionAttempts').filter((a) => a.testId === id && a.partId === pid), (a) => a.date + a.createdAt, true);

            iconBtn('edit', 'Edit retake', () => openRetake(pid, idx, a)), iconBtn('trash', 'Delete retake', async () => { if (await confirm({ title: 'Delete this retake?', message: 'This cannot be undone.', danger: true, confirmLabel: 'Delete' })) { await S.remove('sectionAttempts', a.id); toast('Retake deleted'); } }))));
        }
        const c = card('Retakes of ' + PART + ' ' + idx, list, { actions: [btn('Retake this ' + PART.toLowerCase(), () => openRetake(pid, idx), { size: 'sm', icon: 'repeat' })] });
        const off = IT.bus.on('data:changed', () => { if (!c.isConnected) { off(); return; } draw(); });

      }
      function openRetake(pid, idx, a) {
        const p = draft.parts.find((x) => x.id === pid);
        const pt = St.partTotals(p);
        a = a || { date: U.today(), total: pt.total || '', correct: '', durationMin: '', replays: 0, notes: '' };
        const f = h('form.form-grid', { onsubmit: (e) => e.preventDefault() },
          field('Date', input('date', a.date, { type: 'date' })),
          field('Time spent (min)', input('durationMin', a.durationMin, { type: 'number', min: 0 })),
          field('Questions', input('total', a.total, { type: 'number', min: 0 })),
          field('Correct', input('correct', a.correct, { type: 'number', min: 0 })),
          !R ? field('Replays', input('replays', a.replays, { type: 'number', min: 0 })) : null,
          field('Notes', textarea('notes', a.notes, { rows: 2 }), { full: true }));
        modal({ title: (a.id ? 'Edit retake — ' : 'Retake — ') + PART + ' ' + idx, body: h('div.stack', h('p.muted.small', 'Retakes are stored with this test. They do not add a new ' + label + ' test to your statistics.'), f),
          actions: [{ label: 'Cancel', variant: 'ghost' }, { label: 'Save retake', variant: 'primary', onClick: async () => { await S.save('sectionAttempts', Object.assign({}, a, readForm(f), { testId: id, partId: pid, partIdx: idx })); toast('Retake saved', 'success'); } }] });
      }

      drawSummary(); drawPartTabs(); drawPart();
      return { refresh() { /* editor keeps its own draft; sub-sections refresh themselves */ } };
    }

    return {
      render(root, params, query) {
        if (R && params[0] === 'knowledge') {
          root.append(pageHead(label, 'Theory and strategy notes — completely separate from your tests.'), readingTabs('knowledge'));
          return IT.Knowledge.render(root, 'reading', params.slice(1), base + '/knowledge');
        }
        if (params[0]) return renderEditor(root, params[0], query || {});
        return renderList(root, params, query || {});
      },
      openNew,
    };
  }

  IT.views.reading = factory('reading');
  IT.views.listening = factory('listening');
})(window.IT = window.IT || {});

</script>
<script>/* js/views/writing.js */
/* Adrian IELTS Lab — Writing Task 1 & Task 2: My Essays · Corrections · Revisions · History,
 * essay workspace (original → corrections → revisions → compare). */
(function (IT) {
  'use strict';
  const { h, icon, btn, iconBtn, field, input, textarea, select, bandSelect, readForm, modal, toast, fail, clear, card, pageHead, empty, stat, pill, statusPill, kv, tabs, confirm } = IT.UI;
  const S = IT.Store, U = IT.U, C = IT.C, St = IT.Stats, Ch = IT.Charts, B = IT.Band;

  const tKey = (task) => (task === 1 ? 't1' : 't2');
  const skillOf = (task) => (task === 1 ? 'writing1' : 'writing2');
  const crit1 = (task) => (task === 1 ? 'Task Achievement' : 'Task Response');
  const CRIT = (task) => [['ta', crit1(task)], ['cc', 'Coherence & Cohesion'], ['lr', 'Lexical Resource'], ['gra', 'Grammatical Range & Accuracy']];
  const essayRoute = (e, tab) => '#/writing/' + tKey(e.task) + '/essay/' + e.id + (tab ? '?tab=' + tab : '');
  const essaysOf = (task) => S.all('essays').filter((e) => e.task === task);
  const corrOf = (essayId) => U.sortBy(S.all('corrections').filter((c) => c.essayId === essayId), (c) => c.date + c.createdAt);
  const revOf = (essayId) => U.sortBy(S.all('revisions').filter((r) => r.essayId === essayId), (r) => r.versionNo);
  const corrBand = (c) => (c.scores.overall !== null && c.scores.overall !== undefined ? c.scores.overall : B.fromCriteria([c.scores.ta, c.scores.cc, c.scores.lr, c.scores.gra]));
  /**
   * "Correction & Revision" rounds: one round = the feedback received (correction) + the version written from it (revision).
   * Stored as linked records (revision.basedOnCorrectionId), so existing data and statistics keep working.
   * A round can hold only feedback, only a revision, or both. Sorted oldest → newest.
   */
  function roundsOf(essayId) {
    const cs = corrOf(essayId), rs = revOf(essayId).slice();
    const out = cs.map((c) => {
      const i = rs.findIndex((r) => r.basedOnCorrectionId === c.id);
      const r = i >= 0 ? rs.splice(i, 1)[0] : null;
      return { id: c.id, c, r };
    });
    rs.forEach((r) => out.push({ id: r.id, c: null, r }));
    return U.sortBy(out, (x) => (x.c ? x.c.date : x.r.date || '') + ((x.c || x.r).createdAt || ''));
  }
  const roundDate = (x) => (x.c ? x.c.date : x.r && x.r.date);

  /* ---------------- header & navigation ---------------- */
  function header(task, sub) {
    const w = St.writingStats(S, null, null, task), all = St.writingStats(S);
    const est = St.estimatedBands(S);
    return h('div',
      pageHead('Writing', 'Task 1 and Task 2 are managed separately and combined on the Dashboard.', [btn('New Task ' + task + ' essay', () => newEssay(task), { variant: 'primary', icon: 'plus' })]),
      h('div.row.between.mb-4', tabs([{ key: 1, label: 'Task 1 · Academic', count: essaysOf(1).length }, { key: 2, label: 'Task 2 · Essay', count: essaysOf(2).length }], task, (k) => IT.App.go('#/writing/' + tKey(k) + '/' + (sub || 'essays')))),
      h('div.grid-4.mb-4',
        stat('Task ' + task + ' essays', w.essays, (S.all('essays').filter((e) => e.task === task && e.status === 'draft').length) + ' drafts', { class: 'k-writing' }),
        stat('Corrected', w.corrected, w.corrections + ' corrections received'),
        stat('Revisions', w.revisions, 'Versions written after corrections'),
        stat('≈ Task ' + task + ' band', U.fmtBand(task === 1 ? est.t1 : est.t2), 'Writing overall ≈ ' + U.fmtBand(est.writing) + ' · ' + all.essays + ' essays in total')),
      h('div.mb-4', tabs([
        { key: 'essays', label: 'My Essays' }, { key: 'feedback', label: 'Corrections & Revisions' }, { key: 'history', label: 'History' },
        { key: 'knowledge', label: 'Knowledge', count: S.all('knowledge').filter((n) => n.scope === skillOf(task)).length },
      ], sub, (k) => IT.App.go('#/writing/' + tKey(task) + '/' + k), { sub: true })));
  }

  async function newEssay(task) {
    const f = h('form.form-grid', { onsubmit: (e) => e.preventDefault() },
      field('Title', input('title', '', { placeholder: task === 1 ? 'e.g. Line graph — UK energy use' : 'e.g. Remote work — opinion' }), { full: true }),
      field(task === 1 ? 'Chart / task type' : 'Question type', select('type', task === 1 ? C.T1_TYPES : C.T2_TYPES, '', { empty: '—' })),
      field('Topic', input('topic', '', { placeholder: 'e.g. Energy' })),
      field('Question prompt', textarea('prompt', '', { rows: 3, placeholder: 'Paste the task / question here' }), { full: true }),
      field('Date written', input('date', U.today(), { type: 'date' })));
    modal({ title: 'New Writing Task ' + task + ' essay', body: f, actions: [{ label: 'Cancel', variant: 'ghost' }, { label: 'Create & start writing', variant: 'primary', onClick: async () => {
      const e = await S.save('essays', Object.assign(readForm(f), { task, status: 'draft', original: '' }));
      IT.App.go(essayRoute(e));
    } }] });
  }

  /* ---------------- My Essays ---------------- */
  function renderEssays(root, task) {
    root.appendChild(header(task, 'essays'));
    const st = { q: '', type: '', topic: '', status: '', from: '', to: '' };
    const topics = U.uniq(essaysOf(task).map((e) => e.topic).filter(Boolean)).sort();
    const filters = h('div.filters',
      h('div.search', icon('search', 16), input('q', '', { placeholder: 'Search title, prompt, essay text…' })),
      select('type', task === 1 ? C.T1_TYPES : C.T2_TYPES, '', { empty: 'All types' }),
      select('topic', topics, '', { empty: 'All topics' }),
      select('status', C.ESSAY_STATUS.map((s) => [s, C.ESSAY_STATUS_LABEL[s]]), '', { empty: 'Any status' }),
      input('from', '', { type: 'date', attrs: { title: 'From', 'aria-label': 'From' } }),
      input('to', '', { type: 'date', attrs: { title: 'To', 'aria-label': 'To' } }));
    const tableBox = h('div');
    const apply = h('div');
    root.append(card(null, h('div', filters, tableBox)), h('div.mt-4'), apply);
    filters.addEventListener('input', U.debounce(() => { Object.assign(st, readForm(filters)); draw(); }, 150));
    function draw() {
      clear(tableBox);
      const q = st.q.toLowerCase();
      const rows = essaysOf(task).filter((e) => (!q || [e.title, e.prompt, e.original, e.notes, IT.WritingPlan.planText(e)].join(' ').toLowerCase().includes(q)) && (!st.type || e.type === st.type) && (!st.topic || e.topic === st.topic) && (!st.status || e.status === st.status) && U.inRange(e.date, st.from || null, st.to || null));
      tableBox.appendChild(IT.Table([
        { key: 'title', label: 'Essay', render: (e) => h('a.t-main', { href: essayRoute(e) }, e.title || (e.prompt || 'Untitled').slice(0, 60)), sort: (e) => (e.title || '').toLowerCase() },
        { key: 'type', label: 'Type' },
        { key: 'topic', label: 'Topic' },
        { key: 'date', label: 'Date', render: (e) => U.fmtDate(e.date), descFirst: true },
        { key: 'wordCount', label: 'Words', num: true, render: (e) => h('span', { style: { color: e.wordCount && e.wordCount < (task === 1 ? 150 : 250) ? 'var(--warning)' : null } }, String(e.wordCount || 0)) },
        { key: 'durationMin', label: 'Time', num: true, render: (e) => (e.durationMin ? U.fmtMinutes(e.durationMin) : '—') },
        { key: 'status', label: 'Status', render: (e) => statusPill(e.status), sort: (e) => C.ESSAY_STATUS.indexOf(e.status) },
        { key: 'rounds', label: 'Corr. & Rev.', num: true, render: (e) => String(roundsOf(e.id).length), sort: (e) => roundsOf(e.id).length },
        { key: 'band', label: 'Band', num: true, render: (e) => { const b = St.essayBand(S, e); return b ? h('span', U.fmtBand(b.band), h('span.muted.xs', b.source === 'self' ? ' self' : '')) : '—'; }, sort: (e) => { const b = St.essayBand(S, e); return b ? b.band : null; } },
      ], { rows, sortKey: 'date', sortDesc: true, noun: 'essays', showCount: true, onRowClick: (e) => IT.App.go(essayRoute(e)),
        empty: essaysOf(task).length ? empty('No essays match these filters') : empty('No Task ' + task + ' essays yet', 'Write your first essay. The original is kept separately and never overwritten by later versions.', btn('New Task ' + task + ' essay', () => newEssay(task), { variant: 'primary', icon: 'plus' })) }));
      // things to apply next time
      clear(apply);
      const structs = [];
      U.sortBy(S.all('revisions').filter((r) => { const e = S.byId('essays', r.essayId); return e && e.task === task; }), (r) => r.date || r.createdAt, true).forEach((r) => (r.structuresToApply || []).forEach((s) => structs.push({ s, r })));
      const targets = S.all('vocab').filter((v) => v.activeTarget && S.linksOfVocab(v.id).some((l) => l.skill === skillOf(task)));
      if (structs.length || targets.length) apply.appendChild(card('Use in your next Task ' + task + ' essay', h('div.grid-2',
        h('div.stack-sm', h('div.label', 'Structures & collocations to apply'), structs.length ? h('ul', { style: { margin: 0, paddingLeft: '18px' } }, U.uniq(structs.map((x) => x.s)).slice(0, 12).map((s) => h('li.small', s))) : h('p.muted.small', 'Add these when saving a revision.')),
        h('div.stack-sm', h('div.label', 'Words marked for active use'), targets.length ? h('div.row', targets.slice(0, 24).map((v) => h('a.pill.pill-accent', { href: '#/vocab/word/' + v.id }, v.word))) : h('p.muted.small', 'Tick "use actively" when linking words.')))));
    }
    draw();
    return { refresh: draw };
  }

  /* ---------------- Corrections & Revisions (task-level list) ---------------- */
  function renderRounds(root, task) {
    root.appendChild(header(task, 'feedback'));
    const box = h('div'); root.appendChild(box);
    function draw() {
      clear(box);
      const rows = [];
      essaysOf(task).forEach((e) => roundsOf(e.id).forEach((x, i) => rows.push(Object.assign({ e, n: i + 1 }, x))));
      box.appendChild(card(null, h('div.stack',
        h('p.small.muted', 'Each entry is one round: the feedback you received and the revised version you wrote from it. Open an essay to add a new round.'),
        IT.Table([
          { key: 'essay', label: 'Essay', render: (x) => h('a.t-main', { href: essayRoute(x.e, 'feedback') }, x.e.title || 'Untitled'), sort: (x) => (x.e.title || '').toLowerCase() },
          { key: 'n', label: 'Round', num: true, render: (x) => '#' + x.n },
          { key: 'date', label: 'Date', render: (x) => U.fmtDate(roundDate(x)), sort: roundDate, descFirst: true },
          { key: 'source', label: 'Feedback from', render: (x) => (x.c ? x.c.source || 'Feedback' : h('span.muted', 'no feedback')) },
          { key: 'band', label: 'Band', num: true, render: (x) => (x.c ? U.fmtBand(corrBand(x.c)) : '—'), sort: (x) => (x.c ? corrBand(x.c) : null) },
        ].concat(CRIT(task).map(([k, l]) => ({ key: k, label: l.split(' ').map((w) => w[0]).join('').replace('&', ''), num: true, render: (x) => (x.c ? U.fmtBand(x.c.scores[k]) : '—'), sort: (x) => (x.c ? x.c.scores[k] : null) })))
          .concat([
            { key: 'rev', label: 'Revised version', render: (x) => (x.r ? pill('v' + x.r.versionNo + ' · ' + x.r.wordCount + ' words', 'success') : h('span.muted.xs', 'not yet')), sort: (x) => (x.r ? x.r.versionNo : 0) },
            { key: 'fixed', label: 'Fixed', num: true, render: (x) => (x.r ? String((x.r.fixedMistakes || []).length) : '—'), sort: (x) => (x.r ? (x.r.fixedMistakes || []).length : -1) },
            { key: 'rep', label: 'Repeated', num: true, render: (x) => (x.r ? String((x.r.repeatedMistakes || []).length) : '—'), sort: (x) => (x.r ? (x.r.repeatedMistakes || []).length : -1) },
          ]),
        { rows, sortKey: 'date', noun: 'rounds', showCount: true, onRowClick: (x) => IT.App.go(essayRoute(x.e, 'feedback')),
          empty: empty('No corrections or revisions yet', 'Open an essay and add a round: the feedback you received and your revised version.') }))));
    }
    draw();
    return { refresh: draw };
  }

  /* ---------------- History ---------------- */
  function renderHistory(root, task) {
    root.appendChild(header(task, 'history'));
    const st = { q: '', type: '', topic: '', status: '', from: '', to: '', kind: '' };
    const topics = U.uniq(essaysOf(task).map((e) => e.topic).filter(Boolean)).sort();
    const filters = h('div.filters',
      h('div.search', icon('search', 16), input('q', '', { placeholder: 'Search…' })),
      select('kind', [['essay', 'Original essays'], ['correction', 'Corrections'], ['revision', 'Revisions']], '', { empty: 'All events' }),
      select('type', task === 1 ? C.T1_TYPES : C.T2_TYPES, '', { empty: 'All types' }),
      select('topic', topics, '', { empty: 'All topics' }),
      select('status', C.ESSAY_STATUS.map((s) => [s, C.ESSAY_STATUS_LABEL[s]]), '', { empty: 'Any status' }),
      input('from', '', { type: 'date', attrs: { title: 'From', 'aria-label': 'From' } }),
      input('to', '', { type: 'date', attrs: { title: 'To', 'aria-label': 'To' } }));
    const chartBox = h('div.grid-2');
    const listBox = h('div');
    root.append(chartBox, h('div.mt-4'), card('Timeline', h('div', filters, listBox)));
    filters.addEventListener('input', U.debounce(() => { Object.assign(st, readForm(filters)); drawList(); }, 150));
    function drawCharts() {
      clear(chartBox);
      const ess = essaysOf(task).filter((e) => e.status !== 'draft');
      const pts = [];
      ess.forEach((e) => {
        corrOf(e.id).forEach((c) => { const b = corrBand(c); if (b !== null) pts.push({ date: c.date, value: b, k: 'corr' }); });
        if (e.selfBand !== null && e.selfBand !== undefined) pts.push({ date: e.date, value: e.selfBand, k: 'self' });
      });
      const w = St.writingStats(S, null, null, task);
      chartBox.append(
        card('Scores over time', Ch.line([{ key: 'writing', label: 'Correction band', points: pts.filter((p) => p.k === 'corr') }, { key: 'other', label: 'Self-assessed', points: pts.filter((p) => p.k === 'self') }], { min: 3, max: 9, fmt: (v) => v.toFixed(1), targets: { writing: S.settings.targets.writing }, empty: 'Add corrections or self bands to see your scores over time.' })),
        card('Average criteria (from corrections)', Ch.hbars(CRIT(task).map(([k, l]) => ({ label: l, value: w.avgCriteria[k] === null ? null : (w.avgCriteria[k] / 9) * 100, sub: U.fmtBand(w.avgCriteria[k] === null ? null : Math.round(w.avgCriteria[k] * 10) / 10), key: 'writing' })).filter((x) => x.value !== null), { fmt: () => '', empty: 'No criteria scores yet.' })));
      const mist = St.mistakeStats(S, null, null, skillOf(task));
      if (mist.total) chartBox.appendChild(card('Common mistakes (Mistake Bank)', Ch.hbars(mist.top.slice(0, 6).map((x) => ({ label: x.category, value: U.pct(x.count, mist.total), sub: x.count + '× · ' + x.open + ' open', key: 'writing' })), { fmt: () => '' })));
      const revs = S.all('revisions').filter((r) => { const e = S.byId('essays', r.essayId); return e && e.task === task; });
      const fixed = U.groupBy([].concat(...revs.map((r) => r.fixedMistakes || [])), (x) => x.toLowerCase());
      const rep = U.groupBy([].concat(...revs.map((r) => r.repeatedMistakes || [])), (x) => x.toLowerCase());
      if (revs.length) chartBox.appendChild(card('Fixed vs repeated mistakes (from revisions)', h('div.grid-2',
        h('div.stack-sm', h('div.label', 'Fixed (' + Object.keys(fixed).length + ')'), h('ul.list-plain', Object.entries(fixed).slice(0, 10).map(([k, v]) => h('li', h('span', v[0]), h('span.muted', '×' + v.length))))),
        h('div.stack-sm', h('div.label', 'Still repeating (' + Object.keys(rep).length + ')'), h('ul.list-plain', Object.entries(rep).sort((a, b) => b[1].length - a[1].length).slice(0, 10).map(([k, v]) => h('li', h('span', v[0]), pill('×' + v.length, 'warn'))))))));
    }
    function drawList() {
      clear(listBox);
      const q = st.q.toLowerCase();
      const ev = [];
      essaysOf(task).forEach((e) => {
        if (st.type && e.type !== st.type) return; if (st.topic && e.topic !== st.topic) return; if (st.status && e.status !== st.status) return;
        ev.push({ kind: 'essay', date: e.date, e, text: [e.title, e.prompt, e.original, IT.WritingPlan.planText(e)].join(' ') });
        corrOf(e.id).forEach((c) => ev.push({ kind: 'correction', date: c.date, e, c, text: [e.title, c.comments, c.source, c.correctedText].join(' ') }));
        revOf(e.id).forEach((r) => ev.push({ kind: 'revision', date: r.date || (r.createdAt || '').slice(0, 10), e, r, text: [e.title, r.changeNotes, r.content].join(' ') }));
      });
      const rows = U.sortBy(ev.filter((x) => (!st.kind || x.kind === st.kind) && U.inRange(x.date, st.from || null, st.to || null) && (!q || x.text.toLowerCase().includes(q))), (x) => x.date + (x.kind === 'essay' ? '0' : x.kind === 'correction' ? '1' : '2'), true);
      if (!rows.length) { listBox.appendChild(empty(essaysOf(task).length ? 'No events match these filters' : 'No Writing history yet', 'Essays, corrections and revisions will appear here in date order.')); return; }
      listBox.appendChild(h('ul.timeline', rows.slice(0, 200).map((x) => h('li.k-' + (x.kind === 'essay' ? 'accent' : x.kind === 'correction' ? 'listening' : 'reading'),
        h('span.tl-dot'),
        h('div.tl-card', h('div.row.between',
          h('div.row', h('span.eyebrow', x.kind === 'essay' ? 'Original' : x.kind === 'correction' ? 'Correction' : 'Revision v' + x.r.versionNo), h('a.bold', { href: essayRoute(x.e, x.kind === 'essay' ? '' : 'feedback') }, x.e.title || 'Untitled'), x.kind === 'essay' ? statusPill(x.e.status) : null),
          h('span.xs.muted', U.fmtDate(x.date))),
        h('div.small.muted.mt-2',
          x.kind === 'essay' ? [x.e.type, x.e.topic, (x.e.wordCount || 0) + ' words', x.e.durationMin ? U.fmtMinutes(x.e.durationMin) : null, x.e.selfBand !== null && x.e.selfBand !== undefined ? 'self band ' + U.fmtBand(x.e.selfBand) : null].filter(Boolean).join(' · ')
            : x.kind === 'correction' ? [(x.c.source || 'Correction'), 'band ' + U.fmtBand(corrBand(x.c)), (x.c.comments || '').slice(0, 120)].filter(Boolean).join(' · ')
              : [(x.r.wordCount || 0) + ' words', (x.r.changeNotes || '').slice(0, 120)].filter(Boolean).join(' · ')))))));
    }
    drawCharts(); drawList();
    return { refresh() { drawCharts(); drawList(); } };
  }

  /* ---------------- essay workspace ---------------- */
  function renderEssay(root, task, id, query) {
    const e0 = S.byId('essays', id);
    if (!e0 || e0.task !== task) { root.appendChild(empty('Essay not found', 'It may have been deleted.', btn('Back to Writing', () => IT.App.go('#/writing/' + tKey(task) + '/essays')))); return null; }
    let tab = query.tab || 'original';
    if (tab === 'corrections' || tab === 'revisions') tab = 'feedback'; // old links
    // original text, summary and brainstorm each save separately; the page is "dirty" if any part is unsaved
    const dirtyParts = new Set();
    const setPart = (k, v) => { if (v) dirtyParts.add(k); else dirtyParts.delete(k); IT.App.setDirty(dirtyParts.size > 0); };
    const top = h('div'), body = h('div'), bottom = h('div.stack-lg.mt-6');
    root.append(top, body, bottom);

    function drawTop() {
      clear(top);
      const e = S.byId('essays', id);
      const nRounds = roundsOf(id).length;
      top.append(
        h('div.crumbs', h('a', { href: '#/writing/' + tKey(task) + '/essays' }, 'Writing Task ' + task), icon('chevronRight', 12), h('span', e.title || 'Untitled')),
        pageHead(e.title || 'Untitled essay', [e.type, e.topic, U.fmtDate(e.date)].filter(Boolean).join(' · '), [statusPill(e.status), btn('Delete essay', del, { variant: 'danger', icon: 'trash' })]),
        h('div.mb-4', tabs([{ key: 'original', label: 'Original' }, { key: 'feedback', label: 'Corrections & Revisions', count: nRounds },{ key: 'compare', label: 'Compare versions' }, { key: 'progress', label: 'Scores' }], tab, (k) => {
          if (IT.App.isDirty() && !window.confirm('Discard unsaved changes (' + Array.from(dirtyParts).join(', ') + ')?')) return;
          dirtyParts.clear(); IT.App.setDirty(false); tab = k; history.replaceState(null, '', essayRoute(S.byId('essays', id), k)); drawTop(); drawBody();
        })));
    }
    async function del() {
      const imp = S.deleteImpact('essays', id);
      const r = await confirm({ title: 'Delete this essay?', danger: true, confirmLabel: 'Delete essay',
        message: h('div.stack-sm', h('p', 'This permanently deletes the original essay' + (imp.corrections ? ', ' + imp.corrections + ' correction(s)' : '') + (imp.revisions ? ' and ' + imp.revisions + ' revision(s)' : '') + '. This cannot be undone.'), h('p.small.muted', imp.links + ' vocabulary link(s) will be removed — the words stay in the Vocabulary Bank.')),
        checkbox: imp.mistakes ? { label: 'Also delete the ' + imp.mistakes + ' mistake(s) logged for this essay', checked: false } : null });
      if (!r) return;
      await S.remove('essays', id, { deleteMistakes: r.checked });
      IT.App.setDirty(false); toast('Essay deleted'); IT.App.go('#/writing/' + tKey(task) + '/essays');
    }

    function drawBody() {
      clear(body);
      if (tab === 'feedback') body.appendChild(roundsTab());
      else if (tab === 'compare') body.appendChild(compareTab());
      else if (tab === 'progress') body.appendChild(progressTab());
      else body.appendChild(originalTab());
    }

    /* --- original --- */
    function originalTab() {
      const e = S.byId('essays', id);
      const locked = e.status !== 'draft';
      const wc = h('span.small.muted');

<script>/* js/views/speaking.js */

  }

/* Adrian IELTS Lab — Study Calendar (day / week / month). */
(function (IT) {

  function openPlan(existing, date) {

    const f = h('form.form-grid', { onsubmit: (e) => e.preventDefault() },
      field('What to study', input('title', p.title, { placeholder: 'e.g. Reading Test — Cambridge 18 T3' }), { required: true, full: true }),
      field('Date', input('date', p.date, { type: 'date' })),
      field('Skill', select('skill', C.LOG_SKILLS.map((s) => [s, C.SKILL_LABEL[s]]), p.skill)),
      field('Planned minutes', input('plannedMin', p.plannedMin, { type: 'number', min: 0 })),
      field('Repeat', select('repeat', [['', 'Does not repeat'], ['7', 'Every week (8 weeks)'], ['1', 'Every day (14 days)']], ''), { hint: existing ? 'Only for new plans' : null }),
      field('', IT.UI.checkbox('done', p.done, 'Completed'), { full: true }),
      field('Notes / what was covered', textarea('notes', p.notes, { rows: 3 }), { full: true }));
    if (existing) f.querySelector('[name=repeat]').disabled = true;
    modal({ title: existing ? 'Edit study plan' : 'Plan a study session', body: f, actions: [
      existing ? { label: 'Delete', variant: 'danger', icon: 'trash', onClick: async (close) => { if (await confirm({ title: 'Delete this plan?', message: 'This cannot be undone.', danger: true, confirmLabel: 'Delete' })) { await S.remove('calendarPlans', existing.id); close(); } return false; } } : null,
      existing && !existing.linkedLogId ? { label: 'Done → log it', variant: 'secondary', icon: 'timer', onClick: () => { const d = readForm(f); IT.views.log.openForm(null, { date: d.date, skill: d.skill, minutes: d.plannedMin, content: d.title, onSaved: async (log) => { await S.save('calendarPlans', Object.assign({}, existing, d, { done: true, linkedLogId: log.id })); } }); } } : null,
      { label: 'Cancel', variant: 'ghost' },
      { label: 'Save', variant: 'primary', onClick: async () => {
        const d = readForm(f); const rep = Number(d.repeat) || 0; delete d.repeat;
        if (existing || !rep) { await S.save('calendarPlans', Object.assign({}, existing || {}, d)); }
        else { const n = rep === 7 ? 8 : 14; for (let i = 0; i < n; i++) await S.save('calendarPlans', Object.assign({}, d, { date: U.addDays(d.date, i * rep), done: false })); }

    root.appendChild(pageHead('Study Calendar', 'Plan sessions by skill, tick them off, and compare with what you actually logged.', [btn('Plan session', () => openPlan(null, anchor), { variant: 'primary', icon: 'plus' })]));

        h('div.row', iconBtn('chevronLeft', 'Previous', () => { anchor = U.shiftPeriod(mode, anchor, -1); draw(); }, 'secondary'), btn('Today', () => { anchor = U.today(); draw(); }, { size: 'sm' }), iconBtn('chevronRight', 'Next', () => { anchor = U.shiftPeriod(mode, anchor, 1); draw(); }, 'secondary'), h('h2', per.label)),
        h('div.seg', ['day', 'week', 'month'].map((k) => h('button', { type: 'button', 'aria-pressed': String(k === mode), onclick: () => { mode = k; draw(); } }, k[0].toUpperCase() + k.slice(1)))));

        h('div.grow', h('div.t.small.bold', p.title), p.notes ? h('div.xs.muted', p.notes) : null), skillTag(p.skill), h('span.xs.muted', p.plannedMin ? U.fmtMinutes(p.plannedMin) : ''), iconBtn('edit', 'Edit', () => openPlan(p)));

        card('Plan — ' + U.fmtDate(d, { weekday: 'long', day: 'numeric', month: 'short' }), h('div.stack-sm', plans.length ? plans.map(planRow) : h('p.muted.small', 'Nothing planned.'), h('div', btn('Add plan', () => openPlan(null, d), { size: 'sm', icon: 'plus' })))),
        card('What you logged', h('div.stack-sm', logs.length ? logs.map((l) => h('div.plan-item', skillTag(l.skill), h('div.grow.small', l.content || '—'), h('span.xs.muted', U.fmtMinutes(l.minutes)), iconBtn('edit', 'Edit', () => IT.views.log.openForm(l)))) : h('p.muted.small', 'No study logged.'), h('div', btn('Log session', () => IT.views.log.openForm(null, { date: d }), { size: 'sm', icon: 'timer' })))));

          h('span.d', String(U.parseDate(d).getDate())), evs.slice(0, maxShow), evs.length > maxShow ? h('span.cal-more', '+' + (evs.length - maxShow) + ' more') : null));

    }
    draw();
    return { refresh: draw };
  }

  IT.views.calendar = { render, openPlan };

<script>/* js/views/studylog.js */
/* Adrian IELTS Lab — Study Log (one entry per study session). */
(function (IT) {
  'use strict';
  const { h, icon, btn, iconBtn, field, input, textarea, select, readForm, modal, toast, clear, card, pageHead, empty, stat, pill, confirm, skillTag } = IT.UI;
  const S = IT.Store, U = IT.U, C = IT.C, St = IT.Stats, Ch = IT.Charts;

  /** Practice records a log can be linked to (prevents counting the same time twice). */
  function practiceOptions(skill, current) {
    const items = St.practiceItems(S).filter((p) => !skill || (C.SKILL_BUCKET[p.skill] === C.SKILL_BUCKET[skill]) || p.refId === current);
    return U.sortBy(items, (p) => p.date, true).slice(0, 80).map((p) => [p.refType + '|' + p.refId, U.fmtDate(p.date, { day: '2-digit', month: 'short' }) + ' · ' + (C.REF[p.refType] ? C.REF[p.refType].label : p.refType) + ' · ' + String(p.label || '').slice(0, 60) + (p.minutes ? ' (' + U.fmtMinutes(p.minutes) + ')' : '')]);
  }

  function openForm(existing, defaults) {
    const l = Object.assign({ date: U.today(), skill: 'reading', focus: 3 }, defaults || {}, existing || {});
    const skillSel = select('skill', C.LOG_SKILLS.map((s) => [s, C.SKILL_LABEL[s]]), l.skill);
    const refSel = h('select.input', { name: 'ref' });
    const fillRefs = () => {
      clear(refSel);
      refSel.appendChild(h('option', { value: '' }, '— Not linked —'));
      practiceOptions(skillSel.value, l.refId).forEach(([v, lab]) => refSel.appendChild(h('option', { value: v, selected: l.refId && v.endsWith('|' + l.refId) }, lab)));
    };
    fillRefs();
    skillSel.addEventListener('change', fillRefs);
    const start = input('start', l.start, { type: 'time' }), end = input('end', l.end, { type: 'time' }), mins = input('minutes', l.minutes || '', { type: 'number', min: 1 });
    const calc = () => { if (start.value && end.value) { mins.value = U.minutesBetween(start.value, end.value); mins.readOnly = true; } else mins.readOnly = false; };
    start.addEventListener('input', calc); end.addEventListener('input', calc); calc();
    const f = h('form.form-grid', { onsubmit: (e) => e.preventDefault() },
      field('Date', input('date', l.date, { type: 'date' })),

      field('Total minutes', mins, { hint: 'Calculated from start/end when both are set.' }),
      field('Focus (1–5)', select('focus', [[1, '1 — very distracted'], [2, '2'], [3, '3 — okay'], [4, '4'], [5, '5 — fully focused']], l.focus)),
      field('Linked practice (optional)', refSel, { full: true, hint: 'If this session was a test / essay / speaking session already saved, link it: its own duration will then NOT be added again.' }),
      field('What I did', textarea('content', l.content, { rows: 2 }), { full: true }),
      field('Result', textarea('result', l.result, { rows: 2 })),

      existing ? { label: 'Delete', variant: 'danger', icon: 'trash', onClick: async (close) => { if (await confirm({ title: 'Delete this log entry?', message: 'This cannot be undone.', danger: true, confirmLabel: 'Delete' })) { await S.remove('studyLogs', existing.id); toast('Log entry deleted'); close(); } return false; } } : null,
      { label: 'Cancel', variant: 'ghost' },

        const d = readForm(f);

  function render(root, params, query) {
    const st = { q: '', skill: '', from: '', to: '' };

    const statsBox = h('div.grid-4.mb-4'), charts = h('div.grid-2.mb-4'), box = h('div');

      input('from', '', { type: 'date', attrs: { title: 'From', 'aria-label': 'From' } }), input('to', '', { type: 'date', attrs: { title: 'To', 'aria-label': 'To' } }));

        card('Time by skill (all time)', Ch.donut(['reading', 'listening', 'writing', 'speaking', 'vocabulary', 'other'].map((k) => ({ key: k, label: C.SKILL_LABEL[k], value: Math.round(all.bySkill[k] || 0) })), { fmt: U.fmtMinutes, centerSub: 'total', empty: 'No study time yet.' })));
