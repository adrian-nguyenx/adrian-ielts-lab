    items.filter((i) => i.value > 0).forEach((it) => {
      const a1 = a0 + (it.value / tot) * Math.PI * 2;
      const large = a1 - a0 > Math.PI ? 1 : 0;
      const p = (a, rad) => (C + rad * Math.cos(a)).toFixed(2) + ' ' + (C + rad * Math.sin(a)).toFixed(2);
      const full = it.value === tot;
      const d = full
        ? 'M' + p(0, R) + ' A' + R + ' ' + R + ' 0 1 1 ' + p(Math.PI, R) + ' A' + R + ' ' + R + ' 0 1 1 ' + p(0, R) + ' M' + p(0, r) + ' A' + r + ' ' + r + ' 0 1 0 ' + p(Math.PI, r) + ' A' + r + ' ' + r + ' 0 1 0 ' + p(0, r) + 'Z'
        : 'M' + p(a0, R) + ' A' + R + ' ' + R + ' 0 ' + large + ' 1 ' + p(a1, R) + ' L' + p(a1, r) + ' A' + r + ' ' + r + ' 0 ' + large + ' 0 ' + p(a0, r) + 'Z';
      g.appendChild(s('path', { d, style: 'fill:' + color(it.key), class: 'slice', 'fill-rule': 'evenodd' }, [title(it.label + ': ' + (opts.fmt ? opts.fmt(it.value) : it.value) + ' (' + Math.round((it.value / tot) * 100) + '%)')]));
      a0 = a1;
    });
    g.appendChild(s('text', { x: C, y: C - 2, 'text-anchor': 'middle', class: 'donut-total' }, [opts.center || (opts.fmt ? opts.fmt(tot) : String(tot))]));
    if (opts.centerSub) g.appendChild(s('text', { x: C, y: C + 14, 'text-anchor': 'middle', class: 'axis' }, [opts.centerSub]));
    const box = wrap(g, items.filter((i) => i.value > 0).map((i) => ({ key: i.key, label: i.label + ' · ' + (opts.fmt ? opts.fmt(i.value) : i.value) })), 'chart-donut');
    return box;
  }

  /** Activity heatmap (GitHub-style). byDate: {date: minutes}; weeks back from today */
  function heatmap(byDate, opts) {
    opts = opts || {};
    const weeks = opts.weeks || 18;
    const end = U.today();
    const start = U.addDays(U.startOfWeek(end), -7 * (weeks - 1));
    const cell = 12, gap = 3;
    const W = weeks * (cell + gap) + 24, H = 7 * (cell + gap) + 18;
    const g = s('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'chart-svg heatmap', role: 'img', 'aria-label': 'Study activity heatmap' });
    const max = Math.max(30, ...Object.values(byDate));
    ['M', '', 'W', '', 'F', '', ''].forEach((l, i) => l && g.appendChild(s('text', { x: 0, y: 18 + i * (cell + gap) + 9, class: 'axis' }, [l])));
    for (let w = 0; w < weeks; w++) {
      for (let d = 0; d < 7; d++) {
        const date = U.addDays(start, w * 7 + d);
        if (date > end) continue;
        const v = byDate[date] || 0;
        const lvl = v === 0 ? 0 : v < max * 0.25 ? 1 : v < max * 0.5 ? 2 : v < max * 0.75 ? 3 : 4;
        g.appendChild(s('rect', { x: 16 + w * (cell + gap), y: 14 + d * (cell + gap), width: cell, height: cell, rx: 2.5, class: 'hm hm-' + lvl }, [title(U.fmtDate(date) + ': ' + U.fmtMinutes(v))]));
      }
      const wd = U.addDays(start, w * 7);
      if (U.parseDate(wd).getDate() <= 7) g.appendChild(s('text', { x: 16 + w * (cell + gap), y: 9, class: 'axis' }, [U.fmtDate(wd, { month: 'short' })]));
    }
    return wrap(g, null, 'chart-heatmap');
  }

  /** Tiny inline sparkline: values array */
  function spark(values, key) {
    if (!values || values.length < 2) return null;
    const W = 80, H = 24, min = Math.min(...values), max = Math.max(...values);
    const X = (i) => (i / (values.length - 1)) * W, Y = (v) => H - 2 - ((v - min) / ((max - min) || 1)) * (H - 4);
    const g = s('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'spark', width: W, height: H, 'aria-hidden': 'true' });
    g.appendChild(s('path', { d: values.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' '), style: 'stroke:' + color(key || 'accent'), class: 'series' }));
    return g;
  }

  IT.Charts = { line, bars, hbars, donut, heatmap, spark, emptyChart };
})(window.IT = window.IT || {});

</script>
<script>/* js/ui/vocab-picker.js */
/* Adrian IELTS Lab — Vocabulary form + the shared "New Vocabulary" picker used in every skill.
 * The picker never creates its own word list: it adds to / links from the single Vocabulary Bank. */
(function (IT) {
  'use strict';
  const { h, icon, btn, iconBtn, field, input, textarea, select, checkbox, readForm, modal, toast, fail, clear, statusPill, skillTag, pill } = IT.UI;
  const S = IT.Store, U = IT.U, C = IT.C;

  /* ---------------- full word form (create / edit) ---------------- */
  function wordFields(v) {
    v = v || {};
    return h('div.form-grid',
      field('Word / phrase', input('word', v.word, { required: true, placeholder: 'e.g. mitigate' }), { required: true }),
      field('IPA', input('ipa', v.ipa, { placeholder: '/ˈmɪtɪɡeɪt/' })),
      field('Part of speech', select('pos', C.POS, v.pos, { empty: '—' })),
      field('Topic', input('topic', v.topic, { placeholder: 'e.g. Environment', attrs: { list: 'vocab-topics' } })),
      field('Vietnamese meaning', input('meaningVi', v.meaningVi, { placeholder: 'giảm nhẹ' }), { full: true }),
      field('English definition', textarea('definitionEn', v.definitionEn, { rows: 2 }), { full: true }),
      field('Example sentences', textarea('examples', v.examples, { rows: 3, placeholder: 'One sentence per line' }), { full: true, hint: 'One per line. Used for fill-in-the-blank practice.' }),
      field('Collocations', textarea('collocations', v.collocations, { rows: 2, placeholder: 'One per line, e.g. mitigate the impact of' }), { full: true }),
      field('Synonyms', input('synonyms', (v.synonyms || []).join(', '), { placeholder: 'comma separated' })),
      field('Antonyms', input('antonyms', (v.antonyms || []).join(', '), { placeholder: 'comma separated' })),
      field('Review status', select('status', C.VOCAB_STATUS.map((s) => [s, C.VOCAB_STATUS_LABEL[s]]), v.status || 'new')),
      field('Level', select('level', [['passive', 'Passive recognition (understand when reading / listening)'], ['active', 'Active usage (can use in Writing / Speaking)']], v.level || 'passive')),
      field('Date added', input('dateAdded', v.dateAdded || U.today(), { type: 'date' })),
      field('', checkbox('activeTarget', v.activeTarget, 'I want to use this actively in Writing / Speaking'), { class: 'align-end' }),
      field('Notes', textarea('notes', v.notes, { rows: 2 }), { full: true }),
      topicsDatalist());
  }
  function topicsDatalist() {
    const dl = h('datalist#vocab-topics');
    U.uniq(S.all('vocab').map((v) => v.topic).concat(S.settings.priorityTopics || []).filter(Boolean)).sort().forEach((t) => dl.appendChild(h('option', { value: t })));
    return dl;
  }
  function linkFields(link, opts) {
    link = link || {};
    return h('div.form-grid',
      field('Context in this lesson', textarea('link.context', link.context, { rows: 2, placeholder: 'The sentence or situation where the word appeared' }), { full: true }),
      opts && opts.allowRole ? field('Role in this lesson', select('link.role', [['learned', 'Learned / noticed here'], ['used', 'I used it in my answer']], link.role || 'learned')) : null,
      field('', checkbox('link.useActively', link.useActively, 'Mark to use actively in later Writing / Speaking'), { full: !(opts && opts.allowRole) }));
  }

  /**
   * Open the word form.
   * @param {object|null} existing vocab record (null = new)
   * @param {object} opts {prefill, link:{skill, refType, refId, subRefId}, allowRole, onSaved(vocab)}
   */
  function openWordForm(existing, opts) {
    opts = opts || {};
    const form = h('form.stack', { onsubmit: (e) => e.preventDefault() }, wordFields(existing || opts.prefill));
    const dupNote = h('div.notice.warn', { hidden: true });
    form.prepend(dupNote);
    if (!existing) {
      const w = form.querySelector('[name=word]');
      w.addEventListener('input', U.debounce(() => {
        const d = S.findVocabByWord(w.value);
        dupNote.hidden = !d;
        if (d) { clear(dupNote).append(icon('alert', 16), h('span', '"' + d.word + '" is already in your Vocabulary Bank. Saving will ' + (opts.link ? 'link the existing word instead of creating a duplicate.' : 'not create a duplicate — edit the existing word instead.'))); }
      }, 150));
    }
    if (opts.link && !existing) { form.appendChild(h('hr.divider')); form.appendChild(h('h4', 'Link to this lesson')); form.appendChild(linkFields(opts.link, opts)); }
    modal({
      title: existing ? 'Edit word' : 'Add word to Vocabulary Bank', size: 'lg', body: form,
      actions: [
        existing ? { label: 'Delete word', variant: 'danger', icon: 'trash', onClick: async (close) => { const ok = await confirmDeleteWord(existing); if (ok) close(); return false; } } : null,
        { label: 'Cancel', variant: 'ghost' },
        { label: existing ? 'Save changes' : 'Save word', variant: 'primary', onClick: async () => {
          const d = readForm(form);
          const link = d.link; delete d.link;
          if (existing) {
            const v = await S.saveVocab(Object.assign({ id: existing.id }, d));
            toast('Word updated everywhere it is linked', 'success');
            if (opts.onSaved) opts.onSaved(v);
            return;
          }
          if (opts.link) {
            const r = await S.addOrLinkVocab(d, Object.assign({}, opts.link, link || {}));
            toast(r.created ? 'Added "' + r.vocab.word + '" and linked it to this lesson' : '"' + r.vocab.word + '" already existed — linked the existing word', 'success');
            if (opts.onSaved) opts.onSaved(r.vocab);
            return;
          }
          const dup = S.findVocabByWord(d.word);
          if (dup) throw new Error('"' + dup.word + '" already exists. Open it from the Vocabulary Bank to edit.');
          const v = await S.saveVocab(Object.assign(d, { sourceSkill: 'manual' }));
          toast('Added "' + v.word + '"', 'success');
          if (opts.onSaved) opts.onSaved(v);
        } },
      ].filter(Boolean),
    });
  }

  async function confirmDeleteWord(v) {
    const n = S.linksOfVocab(v.id).length;
    const ok = await IT.UI.confirm({ title: 'Delete "' + v.word + '"?', message: 'This permanently removes the word from the Vocabulary Bank' + (n ? ', its ' + n + ' lesson link(s)' : '') + ' and its review history. Lessons themselves are not affected. This cannot be undone.', confirmLabel: 'Delete word', danger: true });
    if (!ok) return false;
    try { await S.deleteVocab(v.id); toast('Word deleted'); return true; } catch (e) { fail(e); return false; }
  }

  /* ---------------- link an existing word ---------------- */
  function openLinkForm(vocab, link, opts) {
    const existingLink = link && link.id ? link : null;
    const form = h('form.stack', { onsubmit: (e) => e.preventDefault() },
      h('div.row', h('span.bold', vocab.word), vocab.meaningVi ? h('span.muted', '— ' + vocab.meaningVi) : null, statusPill(vocab.status)),
      linkFields(existingLink || link, opts));
    modal({
      title: existingLink ? 'Edit link' : 'Link word to this lesson', body: form,
      actions: [{ label: 'Cancel', variant: 'ghost' }, { label: existingLink ? 'Save' : 'Link word', variant: 'primary', onClick: async () => {
        const d = readForm(form).link || {};
        if (existingLink) await S.updateLink(existingLink.id, { context: d.context, useActively: d.useActively, role: d.role || existingLink.role });
        else await S.linkExisting(vocab.id, Object.assign({}, link, d));
        if (d.useActively && !vocab.activeTarget) await S.saveVocab({ id: vocab.id, activeTarget: true });
        toast(existingLink ? 'Link updated' : 'Linked "' + vocab.word + '"', 'success');
      } }],
    });
  }

  /* ---------------- the picker ---------------- */
  /**
   * opts: {skill, refType, refId, subRefId (string|null|fn), allowRole, title}
   * Returns an element that keeps itself up to date with the Vocabulary Bank.
   */
  function picker(opts) {
    const getSub = () => (typeof opts.subRefId === 'function' ? opts.subRefId() : opts.subRefId) || null;
    const linkBase = () => ({ skill: opts.skill, refType: opts.refType, refId: opts.refId, subRefId: getSub(), role: opts.allowRole ? 'used' : 'learned' });
    const root = h('div.vp', { 'data-ignore': '' });
    const inp = input('vp-q', '', { placeholder: 'Search the Vocabulary Bank or type a new word…' });
    inp.setAttribute('aria-label', 'Search or add a word');
    const results = h('div.vp-results', { hidden: true, role: 'listbox' });
    const list = h('div.vp-list');
    let hl = -1;

    function options() {
      const q = U.normalizeWord(inp.value);
      if (!q) return [];
      const linked = new Set(S.linksFor(opts.refId, getSub()).map((l) => l.vocabId));
      const matches = S.all('vocab').filter((v) => v.wordKey.includes(q) || (v.meaningVi || '').toLowerCase().includes(q)).sort((a, b) => (a.wordKey === q ? -1 : b.wordKey === q ? 1 : a.wordKey.indexOf(q) - b.wordKey.indexOf(q))).slice(0, 8);
      const out = matches.map((v) => ({ type: 'existing', v, linked: linked.has(v.id) }));
      if (!S.findVocabByWord(inp.value)) out.push({ type: 'new', word: inp.value.trim() });
      return out;
    }
    function showResults() {
      const opts2 = options();
      clear(results);
      results.hidden = !opts2.length;
      opts2.forEach((o, i) => {
        const b = o.type === 'existing'
          ? h('button.vp-opt' + (i === hl ? '.hl' : ''), { type: 'button', role: 'option', onclick: () => choose(o) }, h('span.grow', h('span.bold', o.v.word), ' ', h('span.muted.xs', o.v.meaningVi || o.v.definitionEn || '')), o.linked ? pill('linked', 'accent') : h('span.xs.muted', 'link'))
          : h('button.vp-opt' + (i === hl ? '.hl' : ''), { type: 'button', role: 'option', onclick: () => choose(o) }, h('span.grow', icon('plus', 14), ' Add "', h('b', o.word), '" as a new word'), h('span.xs.muted', 'new'));
        results.appendChild(b);
      });
    }
    function choose(o) {
      results.hidden = true; hl = -1;
      if (o.type === 'existing') {
        if (o.linked) { toast('"' + o.v.word + '" is already linked here'); return; }
        openLinkForm(o.v, linkBase(), opts);
      } else openWordForm(null, { prefill: { word: o.word }, link: linkBase(), allowRole: opts.allowRole });
      inp.value = '';
    }
    inp.addEventListener('input', () => { hl = -1; showResults(); });
    inp.addEventListener('focus', showResults);
    inp.addEventListener('keydown', (e) => {
      const n = results.children.length;
      if (e.key === 'ArrowDown') { e.preventDefault(); hl = Math.min(n - 1, hl + 1); showResults(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); hl = Math.max(0, hl - 1); showResults(); }
      else if (e.key === 'Enter') { e.preventDefault(); const o = options()[hl >= 0 ? hl : 0]; if (o) choose(o); }
      else if (e.key === 'Escape') { results.hidden = true; }
    });
    document.addEventListener('click', (e) => { if (!root.contains(e.target)) results.hidden = true; });

    function renderList() {
      clear(list);
      const links = S.linksFor(opts.refId, getSub());
      if (!links.length) { list.appendChild(h('p.muted.small', 'No words linked yet. Search above to link an existing word or add a new one.')); return; }
      links.forEach((l) => {
        const v = S.byId('vocab', l.vocabId); if (!v) return;
        list.appendChild(h('div.vp-item',
          h('div.grow.stack-sm', { style: { gap: '2px' } },
            h('div.row', h('span.w', v.word), v.ipa ? h('span.muted.xs', v.ipa) : null, v.pos ? h('span.muted.xs', v.pos) : null, statusPill(v.status),
              l.role === 'used' ? pill('used here', 'success') : null, l.useActively || v.activeTarget ? pill('use actively', 'accent') : null),
            v.meaningVi || v.definitionEn ? h('div.small', v.meaningVi || v.definitionEn) : null,
            l.context ? h('div.ctx', '“' + l.context + '”') : null),
          h('div.row-nw',
            iconBtn('edit', 'Edit link (context / active use)', () => openLinkForm(v, l, opts)),
            iconBtn('eye', 'Open word', () => openWordForm(v, {})),
            iconBtn('unlink', 'Remove from this lesson (keeps the word in the bank)', async () => { await S.unlinkVocab(l.id); toast('Removed from this lesson — still in your Vocabulary Bank'); }))));
      });
    }
    const off = IT.bus.on('data:changed', () => { if (!root.isConnected) { off(); return; } renderList(); });
    root.appendChild(h('div.vp-search', h('div.search', icon('search', 16), inp), results));
    root.appendChild(list);
    root.refresh = renderList;
    renderList();
    return root;
  }

  /** Card wrapper with heading, used by every skill editor. */
  function section(opts) {
    const p = picker(opts);
    const count = () => S.linksFor(opts.refId, typeof opts.subRefId === 'function' ? opts.subRefId() : opts.subRefId).length;
    const title = h('h3.card-title', opts.title || 'New Vocabulary');
    const c = IT.UI.card(null, h('div.stack', h('div.row.between', h('div.row', title, skillTag(opts.skill)), h('span.muted.xs', 'Shared Vocabulary Bank · no duplicates')), p));
    c.refresh = p.refresh; c.count = count;
    return c;
  }

  IT.Vocab = { openWordForm, openLinkForm, confirmDeleteWord, picker, section };
})(window.IT = window.IT || {});

</script>
<script>/* js/ui/mistake-editor.js */
/* Adrian IELTS Lab — Mistake form + per-lesson mistake list.
 * All mistakes live in the single Mistake Bank store; lesson editors only filter it by refId. */
(function (IT) {
  'use strict';
  const { h, field, input, textarea, select, checkbox, readForm, modal, toast, iconBtn, pill, card, skillTag, confirm } = IT.UI;
  const S = IT.Store, U = IT.U, C = IT.C;

  /**
   * @param {object|null} existing
   * @param {object} defaults {skill, refType, refId, subRefId, subRefOptions:[[id,label]]}
   */
  function openForm(existing, defaults) {
    const m = Object.assign({ date: U.today(), fixed: false }, defaults || {}, existing || {});
    const skillSel = select('skill', C.SKILLS.map((s) => [s, C.SKILL_LABEL[s]]), m.skill || 'reading');
    const catSel = h('select.input', { name: 'category' });
    const fillCats = () => {
      IT.UI.clear(catSel);
      const list = U.uniq((C.MISTAKE_TYPES[skillSel.value] || []).concat(m.category && m.skill === skillSel.value ? [m.category] : []));
      list.forEach((c) => catSel.appendChild(h('option', { value: c, selected: c === m.category }, c)));
      catSel.appendChild(h('option', { value: '__custom' }, 'Other (type below)…'));
    };
    fillCats();
    skillSel.addEventListener('change', fillCats);
    if (defaults && defaults.skill) skillSel.disabled = true;
    const custom = input('customCategory', '', { placeholder: 'Custom mistake type' });
    const customField = field('Custom type', custom);
    customField.hidden = true;
    catSel.addEventListener('change', () => { customField.hidden = catSel.value !== '__custom'; });
    const listening = (m.skill || skillSel.value) === 'listening';
    const form = h('form.form-grid', { onsubmit: (e) => e.preventDefault() },
      field('Skill', skillSel),
      field('Mistake type', catSel, { required: true }),
      customField,
      defaults && defaults.subRefOptions ? field(defaults.subLabel || 'Part', select('subRefId', defaults.subRefOptions, m.subRefId)) : null,
      field('Date noted', input('date', m.date, { type: 'date' })),
      field('Question / context', textarea('context', m.context, { rows: 2, placeholder: 'e.g. Q14 — "The writer suggests that…"' }), { full: true }),
      field('My answer', input('myAnswer', m.myAnswer, { placeholder: 'What I wrote / said' })),
      field('Correct answer / better expression', input('correction', m.correction)),
      field('Why it was wrong (cause)', textarea('cause', m.cause, { rows: 2 }), { full: true }),
      field(listening ? 'Note after re-listening with the transcript' : 'Lesson learned', textarea('lesson', m.lesson, { rows: 2 }), { full: true }),
      field('', checkbox('fixed', m.fixed, 'Fixed — I no longer make this mistake'), { full: true }));
    modal({
      title: existing ? 'Edit mistake' : 'Log a mistake', size: 'lg', body: form,
      actions: [{ label: 'Cancel', variant: 'ghost' }, { label: existing ? 'Save' : 'Add to Mistake Bank', variant: 'primary', onClick: async () => {
        const d = readForm(form);
        d.skill = skillSel.value;
        if (d.category === '__custom') d.category = (d.customCategory || '').trim();
        delete d.customCategory;
        const rec = Object.assign({}, existing || {}, { refType: m.refType || null, refId: m.refId || null, subRefId: d.subRefId !== undefined ? d.subRefId : (m.subRefId || null) }, d);
        await S.save('mistakes', rec);
        toast(existing ? 'Mistake updated' : 'Added to Mistake Bank', 'success');
      } }],
    });
  }

  async function remove(m) {
    if (await confirm({ title: 'Delete this mistake?', message: 'It will be removed from the Mistake Bank permanently.', confirmLabel: 'Delete', danger: true })) {
      await S.remove('mistakes', m.id); toast('Mistake deleted');
    }
  }

  function row(m, opts) {
    return h('div.vp-item',
      h('div.grow.stack-sm', { style: { gap: '2px' } },
        h('div.row', h('span.bold', m.category), m.fixed ? pill('fixed', 'fixed') : pill('open', 'open'), opts && opts.showPart && m.subRefId ? pill(opts.partLabel ? opts.partLabel(m.subRefId) : m.subRefId) : null, h('span.muted.xs', U.fmtDate(m.date))),
        m.context ? h('div.small', m.context) : null,
        m.myAnswer || m.correction ? h('div.xs', m.myAnswer ? h('span', { style: { textDecoration: 'line-through' }, class: 'muted' }, m.myAnswer) : null, m.myAnswer && m.correction ? ' → ' : null, m.correction ? h('b', m.correction) : null) : null,
        m.cause ? h('div.xs.muted', 'Cause: ' + m.cause) : null,
        m.lesson ? h('div.xs', '💡 ' + m.lesson) : null),
      h('div.row-nw',
        iconBtn('check', m.fixed ? 'Mark as not fixed' : 'Mark as fixed', async () => { await S.save('mistakes', Object.assign({}, m, { fixed: !m.fixed })); }),
        iconBtn('edit', 'Edit', () => openForm(m, opts && opts.defaults)),
        iconBtn('trash', 'Delete', () => remove(m))));
  }

  /**
   * Mistakes section for a lesson. opts: {skill, refType, refId, subRefId (fn|string|null), subRefOptions, partLabel, title}
   */
  function section(opts) {
    const list = h('div.vp-list');
    const getSub = () => (typeof opts.subRefId === 'function' ? opts.subRefId() : opts.subRefId);
    const defaults = () => ({ skill: opts.skill, refType: opts.refType, refId: opts.refId, subRefId: getSub() || null, subRefOptions: opts.subRefOptions, subLabel: opts.subLabel });
    function render() {
      IT.UI.clear(list);
      const sub = getSub();
      const ms = U.sortBy(S.all('mistakes').filter((m) => m.refId === opts.refId && (sub === undefined || sub === null || m.subRefId === sub)), (m) => m.date + m.createdAt, true);
      if (!ms.length) list.appendChild(h('p.muted.small', 'No mistakes logged here yet.'));
      ms.forEach((m) => list.appendChild(row(m, { defaults: defaults(), showPart: sub === undefined || sub === null, partLabel: opts.partLabel })));
    }
    const c = card(null, h('div.stack',
      h('div.row.between', h('div.row', h('h3.card-title', opts.title || 'Mistakes'), skillTag(opts.skill)), IT.UI.btn('Log mistake', () => openForm(null, defaults()), { icon: 'plus', size: 'sm' })),
      list));
    const off = IT.bus.on('data:changed', () => { if (!c.isConnected) { off(); return; } render(); });
    c.refresh = render;
    render();
    return c;
  }

  IT.Mistakes = { openForm, remove, row, section };
})(window.IT = window.IT || {});

</script>
<script>/* js/ui/recorder.js */
/* Adrian IELTS Lab — microphone recorder (MediaRecorder). Audio is stored as a Blob in IndexedDB. */
(function (IT) {
  'use strict';
  const { h, btn, clear, icon } = IT.UI;

  function support() {
    if (!window.isSecureContext) return { ok: false, why: 'Recording needs a secure page (https:// or a local file opened directly). This page is not a secure context.' };
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return { ok: false, why: 'This browser does not allow microphone access.' };
    if (!window.MediaRecorder) return { ok: false, why: 'This browser does not support audio recording (MediaRecorder).' };
    return { ok: true };
  }
  function pickMime() {
    const c = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];
    for (const m of c) if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m;
    return '';
  }

  const LIMITS = 'Recordings are saved only in this browser\'s storage (IndexedDB), not in your OneDrive folder. They can be lost if you clear site data, and large numbers of recordings use storage space (~0.5–1 MB per minute). Export a JSON backup with "include audio" to keep a copy.';

  /**
   * Recorder widget. opts: {onRecorded(blob, seconds), maxSec}
   * Returns element with .stop() for external control.
   */
  function widget(opts) {
    opts = opts || {};
    const root = h('div.stack-sm');
    const sup = support();
    if (!sup.ok) { root.appendChild(h('div.notice.warn', icon('alert', 16), h('span', sup.why + ' You can still attach an audio file or paste a link below.'))); return root; }
    let rec = null, stream = null, chunks = [], t0 = 0, iv = null;
    const status = h('div.row');
    const time = h('span.num', '00:00');
    const startBtn = btn('Start recording', start, { variant: 'primary', icon: 'mic' });
    const stopBtn = btn('Stop', stop, { variant: 'danger', icon: 'stop' });
    stopBtn.hidden = true;
    function fmt(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
    async function start() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        clear(status).appendChild(h('div.notice.danger', icon('alert', 16), h('span', e && e.name === 'NotAllowedError' ? 'Microphone permission was denied. Allow it in the browser\'s address bar and try again.' : 'Could not start the microphone: ' + (e && e.message ? e.message : e))));
        return;
      }
      chunks = [];
      const mime = pickMime();
      rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
      rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = () => {
        const secs = Math.round((Date.now() - t0) / 1000);
        stream.getTracks().forEach((t) => t.stop());
        const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
        clearInterval(iv); iv = null;
        startBtn.hidden = false; stopBtn.hidden = true;
        clear(status).append(h('span.small.muted', 'Recorded ' + fmt(secs) + ' · ' + (blob.size / 1048576).toFixed(2) + ' MB'));
        if (opts.onRecorded) opts.onRecorded(blob, secs);
      };
      rec.start(1000);
      t0 = Date.now();
      startBtn.hidden = true; stopBtn.hidden = false;
      clear(status).append(h('span.rec-dot'), h('span.small.bold', 'Recording…'), time);
      iv = setInterval(() => {
        const s = Math.floor((Date.now() - t0) / 1000); time.textContent = fmt(s);
        if (opts.maxSec && s >= opts.maxSec) stop();
        if (!root.isConnected) stop();
      }, 250);
    }
    function stop() { if (rec && rec.state !== 'inactive') rec.stop(); }
    root.append(h('div.row', startBtn, stopBtn, status), h('p.hint', LIMITS));
    root.stop = stop;
    root.start = start;
    root.isRecording = () => !!(rec && rec.state === 'recording');
    return root;
  }

  /** Audio player for a stored blob id. */
  function player(blobId, onRemove) {
    const box = h('div.stack-sm');
    IT.Store.getBlob(blobId).then((b) => {
      if (!b) { box.appendChild(h('p.small.muted', 'Recording not found in this browser (it may have been cleared).')); return; }
      const url = URL.createObjectURL(b.data);
      box.append(h('audio', { controls: true, src: url, preload: 'metadata' }),
        h('div.row', h('span.xs.muted', (b.size / 1048576).toFixed(2) + ' MB · stored in this browser'),
          h('a.btn.btn-ghost.btn-sm', { href: url, download: 'speaking-' + (b.createdAt || '').slice(0, 10) + (b.type.includes('mp4') ? '.m4a' : b.type.includes('ogg') ? '.ogg' : '.webm') }, icon('download', 14), h('span', 'Download')),
          onRemove ? btn('Delete recording', onRemove, { size: 'sm', variant: 'ghost', icon: 'trash' }) : null));
    });
    return box;
  }

  IT.Recorder = { support, widget, player, LIMITS };
})(window.IT = window.IT || {});

</script>
<script>/* js/ui/writing-plan.js */
/* Adrian IELTS Lab — Writing plan: Summary + Brainstorm for each essay.
 * Stored on the essay record itself (essay.summary, essay.brainstorm), so it always belongs to the
 * right essay and the right Task, and is never copied or changed by Corrections / Revisions.
 * Nothing here generates content — every idea is typed by the user. */
(function (IT) {
  'use strict';
  const { h, icon, btn, iconBtn, field, input, textarea, select, readForm, toast, fail, clear, card, pill } = IT.UI;
  const S = IT.Store, U = IT.U;

  /* ---------------- Summary ---------------- */
  const SUMMARY_FIELDS = {
    1: [['visual', 'What the visual shows', 'Paraphrase the task: what, where, when, units…'], ['overview', 'Overview', 'The 2–3 most striking features / main trends'], ['notes', 'Other summary notes', '']],
    2: [['question', 'Question paraphrase', 'Rewrite the question in your own words'], ['position', 'My position / thesis', 'The answer you will give'], ['essay', 'Essay summary', 'The whole essay in 2–3 sentences']],
  };

  function summaryCard(e, onDirty) {
    const task = e.task;
    const sm = e.summary || {};
    const f = h('div.stack', SUMMARY_FIELDS[task].map(([k, l, ph]) => field(l, textarea('summary.' + k, sm[k], { rows: 2, placeholder: ph }))));
    const saveBtn = btn('Save summary', save, { size: 'sm', variant: 'primary', icon: 'check', disabled: true });
    const state = h('span.xs.muted', e.summary && e.summary.updatedAt ? 'Saved ' + U.fmtDateTime(e.summary.updatedAt) : 'Not saved yet');
    f.addEventListener('input', () => { saveBtn.disabled = false; state.textContent = 'Unsaved changes'; onDirty('summary', true); });
    async function save() {
      try {
        const d = (readForm(f).summary) || {};
        d.updatedAt = U.nowIso();
        await S.save('essays', { id: e.id, summary: d });
        saveBtn.disabled = true; state.textContent = 'Saved ' + U.fmtDateTime(d.updatedAt); onDirty('summary', false);
        toast('Summary saved', 'success');
      } catch (err) { fail(err); }
    }
    return card('Summary', h('div.stack', f, h('div.row.between', state, saveBtn)), { class: 'k-writing' });
  }

  /* ---------------- Brainstorm ---------------- */
  const T1_KINDS = ['Key feature', 'Trend', 'Comparison group', 'Key figure', 'Highest / lowest', 'Stage (process)', 'Change (map)', 'Paragraph plan', 'Other'];
  const T1_PARAS = ['Introduction', 'Overview', 'Body 1', 'Body 2', 'Body 3', 'Not placed'];
  const T1_TEMPLATES = {
    'Line Graph': [['Trend', 'Overview'], ['Trend', 'Overview'], ['Highest / lowest', 'Body 1'], ['Key figure', 'Body 1'], ['Comparison group', 'Body 2'], ['Key figure', 'Body 2']],
    'Bar Chart': [['Key feature', 'Overview'], ['Comparison group', 'Body 1'], ['Key figure', 'Body 1'], ['Comparison group', 'Body 2'], ['Key figure', 'Body 2']],
    'Pie Chart': [['Key feature', 'Overview'], ['Highest / lowest', 'Body 1'], ['Key figure', 'Body 1'], ['Comparison group', 'Body 2']],
    'Table': [['Key feature', 'Overview'], ['Highest / lowest', 'Body 1'], ['Comparison group', 'Body 1'], ['Comparison group', 'Body 2'], ['Key figure', 'Body 2']],
    'Process': [['Key feature', 'Overview'], ['Stage (process)', 'Body 1'], ['Stage (process)', 'Body 1'], ['Stage (process)', 'Body 2'], ['Stage (process)', 'Body 2']],
    'Map': [['Key feature', 'Overview'], ['Change (map)', 'Body 1'], ['Change (map)', 'Body 1'], ['Change (map)', 'Body 2'], ['Change (map)', 'Body 2']],
    'Mixed Charts': [['Key feature', 'Overview'], ['Key feature', 'Overview'], ['Comparison group', 'Body 1'], ['Key figure', 'Body 1'], ['Comparison group', 'Body 2'], ['Key figure', 'Body 2']],
  };
  const T2_STEPS = [['mainIdea', 'Main idea'], ['explanation', 'Explanation'], ['example', 'Example / evidence'], ['supporting', 'Supporting details']];

  function emptyBrainstorm(task) {
    return task === 1 ? { items: [] } : { bodies: [newBody(), newBody()], extras: [] };
  }
  function newBody() { return { id: U.uid('b'), mainIdea: '', explanation: '', example: '', supporting: '' }; }
  /** Swap with the neighbour in direction dir; with groupOf, only among items of the same group. */
  function move(arr, i, dir, groupOf) {
    let j = i + dir;
    if (groupOf) while (j >= 0 && j < arr.length && groupOf(arr[j]) !== groupOf(arr[i])) j += dir;
    if (j < 0 || j >= arr.length) return;
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }

  function brainstormCard(e, onDirty) {
    const task = e.task;
    let st = U.clone(e.brainstorm) || emptyBrainstorm(task);
    if (task === 1) st.items = st.items || [];
    else { st.bodies = st.bodies && st.bodies.length ? st.bodies : [newBody(), newBody()]; st.extras = st.extras || []; }
    const box = h('div.stack');
    const saveBtn = btn('Save brainstorm', save, { size: 'sm', variant: 'primary', icon: 'check', disabled: true });
    const state = h('span.xs.muted', e.brainstorm && e.brainstorm.updatedAt ? 'Saved ' + U.fmtDateTime(e.brainstorm.updatedAt) : 'Not saved yet');
    const dirty = () => { saveBtn.disabled = false; state.textContent = 'Unsaved changes'; onDirty('brainstorm', true); };
    async function save() {
      try {
        const data = U.clone(st);
        if (task === 1) data.items = data.items.filter((x) => (x.text || '').trim() || x.kind);
        else data.extras = data.extras.filter((x) => (x.text || '').trim());
        data.updatedAt = U.nowIso();
        await S.save('essays', { id: e.id, brainstorm: data });
        st = U.clone(data); saveBtn.disabled = true; state.textContent = 'Saved ' + U.fmtDateTime(data.updatedAt); onDirty('brainstorm', false);
        toast('Brainstorm saved', 'success'); draw();
      } catch (err) { fail(err); }
    }
    const tools = (arr, i, groupOf) => h('span.row-nw', iconBtn('up', 'Move up', () => { move(arr, i, -1, groupOf); dirty(); draw(); }), iconBtn('down', 'Move down', () => { move(arr, i, 1, groupOf); dirty(); draw(); }), iconBtn('trash', 'Delete', () => { arr.splice(i, 1); dirty(); draw(); }));

    function drawT2() {
      st.bodies.forEach((b, i) => {
        const blk = h('div.bs-block.k-writing', h('div.bs-head', h('span.bs-title', 'Body ' + (i + 1)), tools(st.bodies, i)));
        T2_STEPS.forEach(([k, l], si) => {
          const ta = textarea('', b[k], { rows: 2, placeholder: si === 0 ? 'Topic sentence / main argument' : '' });
          ta.addEventListener('input', () => { b[k] = ta.value; dirty(); });
          blk.appendChild(h('div.bs-step', h('label', (si ? '→ ' : '') + l), ta));
        });
        box.appendChild(blk);
      });
      box.appendChild(h('div', btn('Add body paragraph', () => { st.bodies.push(newBody()); dirty(); draw(); }, { size: 'sm', icon: 'plus', variant: 'ghost' })));
      const ex = h('div.bs-block', h('div.bs-head', h('span.bs-title', 'Other ideas'), h('span.xs.muted', 'counter-arguments, intro hook, conclusion…')));
      st.extras.forEach((x, i) => {
        const inp = input('', x.text, { placeholder: 'Idea' });
        inp.addEventListener('input', () => { x.text = inp.value; dirty(); });
        ex.appendChild(h('div.row-nw', inp, tools(st.extras, i)));
      });
      ex.appendChild(h('div', btn('Add idea', () => { st.extras.push({ id: U.uid('x'), text: '' }); dirty(); draw(); }, { size: 'sm', icon: 'plus', variant: 'ghost' })));
      box.appendChild(ex);
    }

    function drawT1() {
      const type = (S.byId('essays', e.id) || e).type;
      const dist = {};
      st.items.forEach((x) => { dist[x.para || 'Not placed'] = (dist[x.para || 'Not placed'] || 0) + 1; });
      box.appendChild(h('div.row.between',
        h('div.bs-dist', T1_PARAS.filter((p) => dist[p]).map((p) => pill(p + ' · ' + dist[p], p === 'Not placed' ? 'warn' : 'accent'))),
        T1_TEMPLATES[type] ? btn('Add ' + type + ' template', () => { T1_TEMPLATES[type].forEach(([k, p]) => st.items.push({ id: U.uid('i'), kind: k, para: p, text: '' })); dirty(); draw(); }, { size: 'sm', icon: 'grid', variant: 'ghost', title: 'Adds empty rows suited to this chart type — you fill them in' }) : h('span.xs.muted', 'Choose a chart type in Essay details to get a template')));
      if (!st.items.length) box.appendChild(h('p.small.muted', 'Note key features, trends, groups to compare, important figures, and which paragraph each point goes in.'));
      // group rows by paragraph for a clear plan, keeping the stored order inside each group
      T1_PARAS.forEach((para) => {
        const rows = st.items.map((x, i) => [x, i]).filter(([x]) => (x.para || 'Not placed') === para);
        if (!rows.length) return;
        const blk = h('div.bs-block' + (para === 'Overview' ? '.k-writing' : ''), h('div.bs-head', h('span.bs-title', para)));
        rows.forEach(([x, i]) => {
          const kind = select('', T1_KINDS, x.kind || 'Key feature');
          const p = select('', T1_PARAS, x.para || 'Not placed');
          const t = textarea('', x.text, { rows: 1, placeholder: 'e.g. coal fell from 40% to 5%' });
          kind.classList.add('input-sm'); p.classList.add('input-sm');
          kind.addEventListener('change', () => { x.kind = kind.value; dirty(); });
          p.addEventListener('change', () => { x.para = p.value; dirty(); draw(); });
          t.addEventListener('input', () => { x.text = t.value; dirty(); });
          blk.appendChild(h('div.bs-line', kind, p, t, tools(st.items, i, (y) => y.para || 'Not placed')));
        });
        box.appendChild(blk);
      });
      box.appendChild(h('div', btn('Add point', () => { st.items.push({ id: U.uid('i'), kind: 'Key feature', para: 'Not placed', text: '' }); dirty(); draw(); }, { size: 'sm', icon: 'plus', variant: 'ghost' })));
    }

    function draw() { clear(box); if (task === 1) drawT1(); else drawT2(); }
    draw();
    return card('Brainstorm', h('div.stack', h('p.xs.muted', task === 1 ? 'Flexible plan for any Task 1 type. Use ↑ ↓ to reorder and the paragraph menu to place each point.' : 'Body: Main idea → Explanation → Example / evidence → Supporting details. Use ↑ ↓ to reorder.'), box, h('div.row.between', state, saveBtn)), { class: 'k-writing' });
  }

  /** Read-only view of the plan (used in the revision dialog). */
  function planView(e) {
    const sm = e.summary || {}, bs = e.brainstorm || null;
    const rows = [];
    SUMMARY_FIELDS[e.task].forEach(([k, l]) => { if (sm[k]) rows.push(h('div.pv-row', h('span.pv-k', l), h('span.pre', sm[k]))); });
    if (bs && e.task === 2) {
      (bs.bodies || []).forEach((b, i) => { const parts = T2_STEPS.filter(([k]) => b[k]).map(([k, l]) => h('div', h('b', l + ': '), b[k])); if (parts.length) rows.push(h('div.pv-row', h('span.pv-k', 'Body ' + (i + 1)), h('div', parts))); });
      if ((bs.extras || []).length) rows.push(h('div.pv-row', h('span.pv-k', 'Other ideas'), h('ul', { style: { margin: 0, paddingLeft: '16px' } }, bs.extras.map((x) => h('li', x.text)))));
    }
    if (bs && e.task === 1) T1_PARAS.forEach((p) => { const its = (bs.items || []).filter((x) => (x.para || 'Not placed') === p && x.text); if (its.length) rows.push(h('div.pv-row', h('span.pv-k', p), h('ul', { style: { margin: 0, paddingLeft: '16px' } }, its.map((x) => h('li', h('span.muted', x.kind + ': '), x.text))))); });
    return rows.length ? h('div.plan-view', rows) : h('p.small.muted', 'No summary or brainstorm saved for this essay yet.');
  }

  /** Plain-text version for CSV / search. */
  function planText(e) {
    const sm = e.summary || {}, bs = e.brainstorm || {};
    const parts = SUMMARY_FIELDS[e.task].map(([k, l]) => (sm[k] ? l + ': ' + sm[k] : '')).filter(Boolean);
    if (e.task === 2) (bs.bodies || []).forEach((b, i) => { const t = T2_STEPS.map(([k, l]) => (b[k] ? l + ': ' + b[k] : '')).filter(Boolean).join(' | '); if (t) parts.push('Body ' + (i + 1) + ' — ' + t); });
    if (e.task === 2) (bs.extras || []).forEach((x) => x.text && parts.push('Idea: ' + x.text));
    if (e.task === 1) (bs.items || []).forEach((x) => x.text && parts.push((x.para || '') + ' / ' + x.kind + ': ' + x.text));
    return parts.join('\n');
  }

  IT.WritingPlan = { summaryCard, brainstormCard, planView, planText, SUMMARY_FIELDS };
})(window.IT = window.IT || {});

</script>
<script>/* js/ui/markdown.js */
/* Adrian IELTS Lab — tiny, safe formatted-text renderer for Knowledge notes.
 * Everything is HTML-escaped first; only this small syntax is turned into markup:
 *   # / ## / ### heading      - or * bullet      1. numbered      > example / callout box
 *   **bold**   *italic*   `code`   ==highlight==   [label](https://link)   blank line = new paragraph */
(function (IT) {
  'use strict';
  const esc = IT.U.escapeHtml;

  function inline(s) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
    s = s.replace(/==([^=]+)==/g, '<mark>$1</mark>');
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, label, url) => '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + label + '</a>');
    return s;
  }

  function render(text) {
    const lines = String(text || '').replace(/\r/g, '').split('\n');
    const out = [];
    let list = null, para = [], quote = [];
    const flushPara = () => { if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } };
    const flushList = () => { if (list) { out.push('<' + list.tag + '>' + list.items.map((x) => '<li>' + inline(x) + '</li>').join('') + '</' + list.tag + '>'); list = null; } };
    const flushQuote = () => { if (quote.length) { out.push('<div class="md-quote">' + quote.map(inline).join('<br>') + '</div>'); quote = []; } };
    const flushAll = () => { flushPara(); flushList(); flushQuote(); };
    lines.forEach((raw) => {
      const ln = raw.trimEnd();
      let m;
      if (!ln.trim()) { flushAll(); return; }
      if ((m = /^(#{1,3})\s+(.*)$/.exec(ln))) { flushAll(); const lv = m[1].length + 2; out.push('<h' + lv + '>' + inline(m[2]) + '</h' + lv + '>'); return; }
      if ((m = /^\s*[-*•]\s+(.*)$/.exec(ln))) { flushPara(); flushQuote(); if (!list || list.tag !== 'ul') { flushList(); list = { tag: 'ul', items: [] }; } list.items.push(m[1]); return; }
      if ((m = /^\s*\d+[.)]\s+(.*)$/.exec(ln))) { flushPara(); flushQuote(); if (!list || list.tag !== 'ol') { flushList(); list = { tag: 'ol', items: [] }; } list.items.push(m[1]); return; }
      if ((m = /^>\s?(.*)$/.exec(ln))) { flushPara(); flushList(); quote.push(m[1]); return; }
      flushList(); flushQuote(); para.push(ln);
    });
    flushAll();
    const div = document.createElement('div');
    div.className = 'md';
    div.innerHTML = out.join('');
    return div;
  }

  /** Plain text (for snippets / search). */
  function plain(text) {
    return String(text || '').replace(/^#{1,3}\s+/gm, '').replace(/^\s*[-*•]\s+/gm, '• ').replace(/^>\s?/gm, '').replace(/\*\*|==|`/g, '').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/\s+/g, ' ').trim();
  }

  IT.MD = { render, plain };
})(window.IT = window.IT || {});

</script>
<script>/* js/views/knowledge.js */
/* Adrian IELTS Lab — Knowledge (theory notes) for Reading, Writing Task 1 and Writing Task 2.
 * Three independent collections (note.scope). Not linked to tests, essays, mistakes or vocabulary,
 * and never counted in test / band / study-time statistics. */
(function (IT) {
  'use strict';
  const { h, icon, btn, iconBtn, field, input, textarea, select, readForm, modal, toast, fail, clear, card, empty, stat, pill, confirm } = IT.UI;
  const S = IT.Store, U = IT.U, C = IT.C;
  const STATUS_LABEL = { new: 'New', learning: 'Learning', reviewing: 'Reviewing', mastered: 'Mastered' };
  const GRADES = [['again', 'Again', 'tomorrow'], ['hard', 'Hard', 'a bit longer'], ['good', 'Good', 'normal'], ['easy', 'Easy', 'much later']];

  const notesOf = (scope) => S.all('knowledge').filter((n) => n.scope === scope);
  const isDue = (n) => n.status !== 'mastered' && IT.SRS.isDue(n);
  const categoriesOf = (scope) => U.uniq((C.KNOWLEDGE_CATEGORIES[scope] || []).concat(notesOf(scope).map((n) => n.category).filter(Boolean)));
  const statusPill = (s) => pill(STATUS_LABEL[s] || s, s);
  function sortNotes(arr) { return U.sortBy(arr, (n) => (n.pinned ? '0' : '1') + (n.updatedAt || ''), false).sort((a, b) => (a.pinned === b.pinned ? (b.updatedAt || '').localeCompare(a.updatedAt || '') : a.pinned ? -1 : 1)); }
  function parseLinks(text) {
    return U.splitLines(text).map((ln) => { const m = /^(.*?)\s*\|\s*(https?:\/\/\S+)$/.exec(ln); return m ? { label: m[1].trim(), url: m[2] } : { label: '', url: ln.trim() }; }).filter((l) => U.isUrl(l.url));
  }
  const linksText = (links) => (links || []).map((l) => (l.label ? l.label + ' | ' : '') + l.url).join('\n');

  /* ---------------- images ---------------- */
  function thumb(blobId, opts) {
    opts = opts || {};
    const box = h('div.kn-thumb');
    S.getBlob(blobId).then((b) => {
      if (!b) { box.appendChild(h('span.xs.muted', 'Image missing')); return; }
      const url = URL.createObjectURL(b.data);
      const img = h('img', { src: url, alt: b.name || 'Attached image', loading: 'lazy' });
      img.addEventListener('click', () => modal({ title: b.name || 'Image', size: 'xl', body: h('img.kn-full', { src: url, alt: b.name || 'Image' }) }));
      box.appendChild(img);
      if (opts.onRemove) box.appendChild(h('button.kn-thumb-x', { type: 'button', title: 'Remove image', 'aria-label': 'Remove image', onclick: opts.onRemove }, icon('close', 14)));
    });
    return box;
  }

  /* ---------------- editor ---------------- */
  function openEditor(scope, existing, onSaved) {
    const n = existing ? U.clone(existing) : { scope, category: '', title: '', content: '', examples: '', tags: [], images: [], links: [], pinned: false };
    let images = (n.images || []).slice();
    const uploaded = [], removed = [];
    let saved = false;
    const dl = h('datalist#kn-cats-' + scope, categoriesOf(scope).map((c) => h('option', { value: c })));
    const content = textarea('content', n.content, { rows: 12, placeholder: '# Heading\n- bullet point\n**bold**  *italic*  ==highlight==\n> Example / tip box\n[link label](https://…)' });
    content.classList.add('kn-editor');
    const preview = h('div.kn-preview', { hidden: true });
    const tbBtn = (label, title, before, after, linePrefix) => h('button.btn.btn-ghost.btn-sm', { type: 'button', title, onclick: () => {
      const s = content.selectionStart, e = content.selectionEnd, v = content.value, sel = v.slice(s, e);
      if (linePrefix) { const ls = v.lastIndexOf('\n', s - 1) + 1; content.value = v.slice(0, ls) + linePrefix + v.slice(ls); content.selectionStart = content.selectionEnd = e + linePrefix.length; }
      else { content.value = v.slice(0, s) + before + (sel || 'text') + after + v.slice(e); content.selectionStart = s + before.length; content.selectionEnd = s + before.length + (sel || 'text').length; }
      content.focus(); content.dispatchEvent(new Event('input', { bubbles: true }));
    } }, label);
    const toggle = btn('Preview', () => { const on = preview.hidden; preview.hidden = !on; content.hidden = on; clear(preview).appendChild(IT.MD.render(content.value)); toggle.querySelector('span').textContent = on ? 'Edit' : 'Preview'; }, { size: 'sm', icon: 'eye' });
    const toolbar = h('div.row.kn-toolbar', tbBtn('H', 'Heading', '', '', '## '), tbBtn('•', 'Bullet', '', '', '- '), tbBtn('1.', 'Numbered', '', '', '1. '), tbBtn('B', 'Bold', '**', '**'), tbBtn('I', 'Italic', '*', '*'), tbBtn('Mark', 'Highlight', '==', '=='), tbBtn('Box', 'Example / tip box', '', '', '> '), h('span.grow'), toggle);
    const imgBox = h('div.kn-thumbs');
    function drawImages() {
      clear(imgBox);
      images.forEach((im, i) => imgBox.appendChild(thumb(im.blobId, { onRemove: () => { removed.push(im.blobId); images.splice(i, 1); drawImages(); } })));
      if (!images.length) imgBox.appendChild(h('span.xs.muted', 'No images yet.'));
    }
    const file = h('input', { type: 'file', accept: 'image/*', multiple: true, class: 'input', style: { paddingTop: '8px' } });
    file.addEventListener('change', async () => {
      for (const f of Array.from(file.files)) {
        if (f.size > 8 * 1048576 && !(await confirm({ title: 'Large image', message: f.name + ' is ' + (f.size / 1048576).toFixed(1) + ' MB. Large images fill browser storage and make backups bigger. Add it anyway?', confirmLabel: 'Add image' }))) continue;
        try { const b = await S.putBlob(f, { name: f.name }); uploaded.push(b.id); images.push({ blobId: b.id, name: f.name }); } catch (e) { fail(e); }
      }
      file.value = ''; drawImages();
    });
    drawImages();
    const f = h('form.form-grid', { onsubmit: (e) => e.preventDefault() },
      field('Title', input('title', n.title, { placeholder: 'e.g. FALSE vs NOT GIVEN' }), { required: true, full: true }),
      field('Category', input('category', n.category, { placeholder: 'Pick or type a new category', attrs: { list: 'kn-cats-' + scope } })), dl,
      field('Tags', input('tags', (n.tags || []).join(', '), { placeholder: 'comma separated' })),
      h('div.field.field-full', h('label', 'Content'), toolbar, content, preview, h('div.hint', 'Formatting: # heading · - bullet · 1. numbered · **bold** · *italic* · ==highlight== · > example box · [label](https://link)')),
      field('Examples', textarea('examples', n.examples, { rows: 4, placeholder: 'Example sentences / sample paragraphs (one per line)' }), { full: true }),
      h('div.field.field-full', h('label', 'Images'), imgBox, file),
      field('Source links', textarea('links', linksText(n.links), { rows: 2, placeholder: 'https://… or  Label | https://…  (one per line)' }), { full: true }),
      field('', IT.UI.checkbox('pinned', n.pinned, 'Pin this note to the top'), { full: true }));
    modal({ title: existing ? 'Edit note' : 'New ' + C.KNOWLEDGE_SCOPE_LABEL[scope] + ' note', size: 'lg', sticky: true, body: f,
      onClose: async () => { if (!saved) for (const id of uploaded) await S.deleteBlob(id); },
      actions: [{ label: 'Cancel', variant: 'ghost' }, { label: existing ? 'Save changes' : 'Save note', variant: 'primary', onClick: async () => {
        const d = readForm(f);
        const rec = Object.assign({}, existing || {}, d, { scope, content: content.value, links: parseLinks(d.links), images, srs: existing ? existing.srs : null, status: existing ? existing.status : 'new' });
        const out = await S.save('knowledge', rec);
        saved = true;
        for (const id of removed) await S.deleteBlob(id);
        toast(existing ? 'Note updated' : 'Note saved', 'success');
        if (onSaved) onSaved(out);
      } }] });
  }

  async function deleteNote(n, after) {
    const imgs = (n.images || []).length;
    if (!(await confirm({ title: 'Delete "' + n.title + '"?', message: 'This permanently deletes the note' + (imgs ? ', its ' + imgs + ' image(s)' : '') + ' and its review history. Tests and essays are not affected. This cannot be undone.', danger: true, confirmLabel: 'Delete note' }))) return;
    await S.deleteKnowledge(n.id); toast('Note deleted'); if (after) after();
  }

  /* ---------------- list ---------------- */
  function renderList(root, scope, base) {
    const st = { q: '', category: '', status: '', tag: '', flag: '' };
    let view = 'cards';
    try { view = localStorage.getItem('kn-view') || 'cards'; } catch (_) { /* storage blocked */ }
    const statsBox = h('div.grid-4.mb-4'), box = h('div');
    const catSel = select('category', [], '', { empty: 'All categories' }), tagSel = select('tag', [], '', { empty: 'All tags' });
    const filters = h('div.filters',
      h('div.search', icon('search', 16), input('q', '', { placeholder: 'Search title, content, examples, tags…' })),
      catSel, select('status', C.KNOWLEDGE_STATUS.map((s) => [s, STATUS_LABEL[s]]), '', { empty: 'Any status' }), tagSel,
      select('flag', [['pinned', 'Pinned only'], ['due', 'Due for review'], ['images', 'With images']], '', { empty: 'All notes' }));
    const seg = h('div.seg', ['cards', 'table'].map((k) => h('button', { type: 'button', 'aria-pressed': String(k === view), onclick: () => { view = k; try { localStorage.setItem('kn-view', k); } catch (_) { /* ignore */ } seg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.textContent.toLowerCase() === k))); draw(); } }, k === 'cards' ? 'Cards' : 'Table')));
    root.append(h('div.row.between.mb-4', h('p.small.muted', 'Your own theory notes for ' + C.KNOWLEDGE_SCOPE_LABEL[scope] + ' — separate from tests. Collect, organise and review them.'),
      h('div.row', btn('Review', () => IT.App.go(base + '/review'), { icon: 'repeat' }), btn('New note', () => openEditor(scope, null, (n) => IT.App.go(base + '/note/' + n.id)), { variant: 'primary', icon: 'plus' }))),
      statsBox, card(null, h('div', h('div.row.between', filters, seg), box)));
    filters.addEventListener('input', U.debounce(() => { Object.assign(st, readForm(filters)); draw(); }, 150));
    function fillSelects() {
      const cur = catSel.value, curT = tagSel.value;
      clear(catSel).appendChild(h('option', { value: '' }, 'All categories'));
      U.uniq(notesOf(scope).map((n) => n.category).filter(Boolean)).sort().forEach((c) => catSel.appendChild(h('option', { value: c, selected: c === cur }, c)));
      clear(tagSel).appendChild(h('option', { value: '' }, 'All tags'));
      U.uniq([].concat(...notesOf(scope).map((n) => n.tags || []))).sort().forEach((t) => tagSel.appendChild(h('option', { value: t, selected: t === curT }, t)));
    }
    function draw() {
      fillSelects();
      const all = notesOf(scope);
      const byCat = U.groupBy(all, (n) => n.category || 'Uncategorised');
      clear(statsBox).append(
        stat('Notes', all.length, Object.keys(byCat).length + ' categories', { class: 'k-' + (scope === 'reading' ? 'reading' : 'writing') }),
        stat('Due for review', all.filter(isDue).length, all.filter(isDue).length ? h('a', { href: base + '/review' }, 'Start review →') : 'Nothing due'),
        stat('Mastered', all.filter((n) => n.status === 'mastered').length, 'Learning ' + all.filter((n) => n.status === 'learning').length + ' · Reviewing ' + all.filter((n) => n.status === 'reviewing').length),
        stat('Pinned', all.filter((n) => n.pinned).length, all.reduce((s, n) => s + (n.images || []).length, 0) + ' images attached'));
      clear(box);
      const q = st.q.toLowerCase();
      const rows = sortNotes(all.filter((n) => (!st.category || n.category === st.category) && (!st.status || n.status === st.status) && (!st.tag || (n.tags || []).includes(st.tag))
        && (!st.flag || (st.flag === 'pinned' ? n.pinned : st.flag === 'due' ? isDue(n) : (n.images || []).length))
        && (!q || [n.title, n.content, n.examples, n.category, (n.tags || []).join(' ')].join(' ').toLowerCase().includes(q))));
      if (!rows.length) {
        box.appendChild(all.length ? empty('No notes match these filters') : empty('No ' + C.KNOWLEDGE_SCOPE_LABEL[scope] + ' notes yet', 'Collect strategies, rules, templates and examples here. Nothing is generated — you write and organise your own notes.', btn('New note', () => openEditor(scope, null, (n) => IT.App.go(base + '/note/' + n.id)), { variant: 'primary', icon: 'plus' })));
        return;
      }
      if (view === 'table') {
        box.appendChild(IT.Table([
          { key: 'title', label: 'Title', render: (n) => h('a.t-main', { href: base + '/note/' + n.id }, (n.pinned ? '★ ' : '') + n.title), sort: (n) => n.title.toLowerCase() },
          { key: 'category', label: 'Category' },
          { key: 'status', label: 'Status', render: (n) => statusPill(n.status), sort: (n) => C.KNOWLEDGE_STATUS.indexOf(n.status) },
          { key: 'tags', label: 'Tags', sortable: false, render: (n) => (n.tags || []).join(', ') },
          { key: 'due', label: 'Next review', render: (n) => (n.srs && n.srs.due ? U.fmtDate(n.srs.due, { day: '2-digit', month: 'short' }) : h('span.muted', 'new')), sort: (n) => (n.srs && n.srs.due) || '' },
          { key: 'updatedAt', label: 'Updated', render: (n) => U.fmtDate(n.updatedAt), descFirst: true },
        ], { rows, sortKey: null, noun: 'notes', showCount: true, onRowClick: (n) => IT.App.go(base + '/note/' + n.id) }));
        return;
      }
      box.appendChild(h('div.kn-grid', rows.map((n) => h('a.kn-card', { href: base + '/note/' + n.id },
        h('div.row.between', h('div.row', n.category ? pill(n.category, 'accent') : null, statusPill(n.status)), n.pinned ? h('span.kn-pin', { title: 'Pinned' }, '★') : null),
        h('h3.kn-title', n.title),
        h('p.kn-snippet', IT.MD.plain(n.content).slice(0, 160) || h('span.muted', 'No content yet')),
        h('div.row.kn-meta', (n.tags || []).slice(0, 4).map((t) => h('span.badge', t)), (n.images || []).length ? h('span.xs.muted', '🖼 ' + n.images.length) : null, (n.links || []).length ? h('span.xs.muted', '🔗 ' + n.links.length) : null,
          h('span.xs.muted', { style: { marginLeft: 'auto' } }, isDue(n) ? 'Due now' : n.srs && n.srs.due ? 'Review ' + U.fmtDate(n.srs.due, { day: '2-digit', month: 'short' }) : ''))))));
    }
    draw();
    return { refresh: draw };
  }

  /* ---------------- note detail ---------------- */
  function renderNote(root, scope, base, id) {
    function draw() {
      clear(root);
      const n = S.byId('knowledge', id);
      if (!n || n.scope !== scope) { root.appendChild(empty('Note not found', 'It may have been deleted.', btn('Back to Knowledge', () => IT.App.go(base)))); return; }
      const revs = U.sortBy(S.all('knowledgeReviews').filter((r) => r.noteId === id), (r) => r.at || r.date, true);
      root.append(
        h('div.crumbs', h('a', { href: base }, C.KNOWLEDGE_SCOPE_LABEL[scope] + ' · Knowledge'), icon('chevronRight', 12), h('span', n.title)),
        h('div.page-head', h('div', h('div.row', n.category ? pill(n.category, 'accent') : null, statusPill(n.status), n.pinned ? pill('★ Pinned', 'warn') : null), h('h1.page-title.mt-2', n.title)),
          h('div.page-actions',
            btn(n.pinned ? 'Unpin' : 'Pin', async () => { await S.save('knowledge', Object.assign({}, n, { pinned: !n.pinned })); }, { icon: 'flag' }),
            btn('Review now', async () => { reviewOne(n); }, { icon: 'repeat' }),
            btn('Delete', () => deleteNote(n, () => IT.App.go(base)), { variant: 'danger', icon: 'trash' }),
            btn('Edit', () => openEditor(scope, n), { variant: 'primary', icon: 'edit' }))),
        h('div.kn-layout',
          h('div.stack-lg',
            card(null, n.content ? IT.MD.render(n.content) : h('p.muted.small', 'No content yet.')),
            n.examples ? card('Examples', h('div.stack-sm', U.splitLines(n.examples).map((x) => h('div.md-quote', x)))) : null,
            (n.images || []).length ? card('Images (' + n.images.length + ')', h('div.kn-thumbs.kn-thumbs-lg', n.images.map((im) => thumb(im.blobId)))) : null),
          h('div.stack-lg',
            card('Details', IT.UI.kv([['Collection', C.KNOWLEDGE_SCOPE_LABEL[scope]], ['Category', n.category], ['Tags', (n.tags || []).join(', ')], ['Created', U.fmtDateTime(n.createdAt)], ['Updated', U.fmtDateTime(n.updatedAt)], ['Next review', n.srs && n.srs.due ? U.fmtDate(n.srs.due) + ' (every ' + n.srs.interval + 'd)' : 'Not reviewed yet']])),
            (n.links || []).length ? card('Source links', h('div.stack-sm', n.links.map((l) => IT.UI.linkOut(l.url, l.label || l.url)))) : null,
            card('Review history (' + revs.length + ')', revs.length ? h('ul.list-plain', revs.slice(0, 15).map((r) => h('li', h('span', U.fmtDateTime(r.at || r.date)), pill(r.grade, r.correct ? 'success' : 'danger')))) : h('p.muted.small', 'Not reviewed yet.')))));
    }
    function reviewOne(n) {
      modal({ title: 'Review: ' + n.title, size: 'lg', body: (close) => h('div.stack', h('p.small.muted', 'How well did you remember this note?'), h('div.grade-row', GRADES.map(([g, l, sub]) => h('button.btn.g-' + g, { type: 'button', onclick: async () => { await S.reviewKnowledge(n.id, g); toast('Review saved'); close(); } }, l, h('small', sub))))) });
    }
    draw();
    return { refresh: draw };
  }

  /* ---------------- review session ---------------- */
  function renderReview(root, scope, base) {
    const box = h('div');
    root.append(h('div.crumbs', h('a', { href: base }, C.KNOWLEDGE_SCOPE_LABEL[scope] + ' · Knowledge'), icon('chevronRight', 12), h('span', 'Review')), box);
    function setup() {
      clear(box);
      const all = notesOf(scope);
      if (!all.length) { box.appendChild(empty('No notes to review', 'Add some notes first.', btn('New note', () => openEditor(scope), { variant: 'primary', icon: 'plus' }))); return; }
      const catSel = select('category', U.uniq(all.map((n) => n.category).filter(Boolean)).sort(), '', { empty: 'All categories' });
      const modeSel = select('mode', [['due', 'Due notes only (spaced repetition)'], ['all', 'All notes in the category']], 'due');
      const info = h('p.small.muted');
      const pick = () => { const c = catSel.value, m = modeSel.value; return all.filter((n) => (!c || n.category === c) && (m === 'all' || isDue(n))); };
      const upd = () => { info.textContent = pick().length + ' note(s) selected.'; };
      catSel.addEventListener('change', upd); modeSel.addEventListener('change', upd); upd();
      box.appendChild(card('Review ' + C.KNOWLEDGE_SCOPE_LABEL[scope] + ' knowledge', h('div.stack', h('p.small.muted', 'You see the title, try to recall the content, then reveal it and grade yourself. The next review date is scheduled automatically.'),
        h('div.form-grid', field('Category', catSel), field('Which notes', modeSel)), info,
        h('div.row.end', btn('Start', () => { const ns = pick(); if (!ns.length) { toast('Nothing to review with these settings.', 'error'); return; } run(U.sortBy(ns, (n) => (n.srs && n.srs.due) || '0')); }, { variant: 'primary', icon: 'play' })))));
    }
    function run(notes) {
      let i = 0, ok = 0;
      const next = () => {
        clear(box);
        if (i >= notes.length) {
          box.appendChild(h('div.fc-wrap', card(null, h('div.stack', { style: { alignItems: 'center', textAlign: 'center' } }, h('h2', 'Review complete'), h('p.muted', notes.length + ' note(s) · ' + ok + ' remembered'), h('div.row', btn('Back to Knowledge', () => IT.App.go(base)), btn('Review again', setup, { variant: 'primary' }))))));
          return;
        }
        const n = notes[i];
        const reveal = h('div.stack', { hidden: true }, card(null, n.content ? IT.MD.render(n.content) : h('p.muted.small', 'No content.')),
          n.examples ? card('Examples', h('div.stack-sm', U.splitLines(n.examples).map((x) => h('div.md-quote', x)))) : null,
          (n.images || []).length ? h('div.kn-thumbs', n.images.map((im) => thumb(im.blobId))) : null,
          h('div.grade-row', GRADES.map(([g, l, sub]) => h('button.btn.g-' + g, { type: 'button', onclick: async () => { try { await S.reviewKnowledge(n.id, g); } catch (e) { fail(e); } if (g !== 'again') ok++; i++; next(); } }, l, h('small', sub)))));
        const showBtn = btn('Show content', () => { reveal.hidden = false; showBtn.hidden = true; }, { variant: 'primary', icon: 'eye' });
        box.appendChild(h('div.fc-wrap', { style: { maxWidth: '820px' } },
          h('div.row.between', h('span.small.muted', 'Note ' + (i + 1) + ' / ' + notes.length), n.category ? pill(n.category, 'accent') : null),
          h('div.flashcard', { style: { cursor: 'default', minHeight: '180px' } }, h('div.fc-word', { style: { fontSize: '28px' } }, n.title), h('div.fc-sub', 'Recall the key points, then reveal.')),
          h('div.row.end', showBtn), reveal));
      };
      next();
    }
    setup();
    return { refresh() {} };
  }

  /**
   * Render the Knowledge area.
   * @param {Element} root  container (caller already rendered the page header / tabs)
   * @param {'reading'|'writing1'|'writing2'} scope
   * @param {string[]} sub  route segments after ".../knowledge"
   * @param {string} base   hash of the knowledge list, e.g. "#/reading/knowledge"
   */
  function render(root, scope, sub, base) {
    if (sub[0] === 'note' && sub[1]) return renderNote(root, scope, base, sub[1]);
    if (sub[0] === 'review') return renderReview(root, scope, base);
    return renderList(root, scope, base);
  }

  const dueCount = (scope) => S.all('knowledge').filter((n) => (!scope || n.scope === scope) && isDue(n)).length;
  IT.Knowledge = { render, openEditor, dueCount, notesOf, routeOf: (n) => (n.scope === 'reading' ? '#/reading/knowledge' : '#/writing/' + (n.scope === 'writing1' ? 't1' : 't2') + '/knowledge') + '/note/' + n.id };
})(window.IT = window.IT || {});

<script>/* js/views/dashboard.js */
/* Adrian IELTS Lab — Dashboard (bento). Everything is computed live from saved records. */
(function (IT) {
  'use strict';
  const { h, icon, btn, iconBtn, field, input, textarea, select, bandSelect, readForm, modal, toast, clear, card, empty, progress, pill, confirm } = IT.UI;
  const S = IT.Store, U = IT.U, C = IT.C, St = IT.Stats, Ch = IT.Charts, B = IT.Band;
  const SK = { reading: 'R', listening: 'L', writing: 'W', speaking: 'S' };

  /* ---------- band result entry (self-assessed / official) ---------- */
  function openBandEntry(existing, kind) {
    const e = existing || { kind: kind || 'self', date: U.today() };
    const f = h('form.form-grid.cols-3', { onsubmit: (ev) => ev.preventDefault() },
      field('Type', select('kind', [['self', 'Self-assessed'], ['official', 'Official IELTS result']], e.kind)),
      field('Date', input('date', e.date, { type: 'date' })),
      field('Overall', bandSelect('overall', e.overall, 'Auto from 4 skills'), { hint: 'Leave on auto to calculate.' }),
      field('Reading', bandSelect('reading', e.reading)),
      field('Listening', bandSelect('listening', e.listening)),
      field('Writing', bandSelect('writing', e.writing)),
      field('Speaking', bandSelect('speaking', e.speaking)),
      field('Notes', textarea('notes', e.notes, { rows: 2, placeholder: 'e.g. test centre, mock exam, teacher feedback' }), { full: true }));
    modal({ title: existing ? 'Edit band result' : 'Add band result', body: h('div.stack', h('p.muted.small', 'Estimated bands are calculated automatically from your practice. Use this for your own self-assessment or for official IELTS results.'), f),
      actions: [
        existing ? { label: 'Delete', variant: 'danger', icon: 'trash', onClick: async (close) => { if (await confirm({ title: 'Delete this band result?', message: 'This cannot be undone.', danger: true, confirmLabel: 'Delete' })) { await S.remove('bandEntries', existing.id); close(); } return false; } } : null,
        { label: 'Cancel', variant: 'ghost' },
        { label: 'Save', variant: 'primary', onClick: async () => {
          const d = readForm(f);
          ['overall', 'reading', 'listening', 'writing', 'speaking'].forEach((k) => { d[k] = d[k] === '' ? null : Number(d[k]); });
          if (d.overall === null) d.overall = B.overall(d.reading, d.listening, d.writing, d.speaking);
          if ([d.overall, d.reading, d.listening, d.writing, d.speaking].every((x) => x === null)) throw new Error('Enter at least one band.');
          await S.save('bandEntries', Object.assign({}, existing || {}, d));
          toast('Band result saved', 'success');
        } }].filter(Boolean) });
  }

  function bandHistory() {
    const rows = U.sortBy(S.all('bandEntries'), (b) => b.date, true);
    modal({ title: 'Self-assessed & official results', size: 'lg', body: rows.length ? IT.Table([
      { key: 'date', label: 'Date', render: (b) => U.fmtDate(b.date) },
      { key: 'kind', label: 'Type', render: (b) => (b.kind === 'official' ? pill('Official', 'accent') : pill('Self-assessed')) },
      { key: 'overall', label: 'Overall', num: true, render: (b) => U.fmtBand(b.overall) },
      { key: 'reading', label: 'R', num: true, render: (b) => U.fmtBand(b.reading) },
      { key: 'listening', label: 'L', num: true, render: (b) => U.fmtBand(b.listening) },
      { key: 'writing', label: 'W', num: true, render: (b) => U.fmtBand(b.writing) },
      { key: 'speaking', label: 'S', num: true, render: (b) => U.fmtBand(b.speaking) },
      { key: 'x', label: '', sortable: false, cls: 't-acts', render: (b) => iconBtn('edit', 'Edit', () => openBandEntry(b)) },
    ], { rows, sortKey: 'date' }) : empty('No results yet', 'Add a self-assessment or an official IELTS result.'),
    actions: [{ label: 'Close', variant: 'ghost' }, { label: 'Add result', variant: 'primary', icon: 'plus', onClick: () => { openBandEntry(); } }] });
  }

  /* ---------- tasks ---------- */
  function openTask(existing) {
    const t = existing || { due: U.today(), milestone: false };
    const f = h('form.form-grid', { onsubmit: (e) => e.preventDefault() },
      field('Task', input('title', t.title, { placeholder: 'e.g. Finish Cambridge 18 Reading Test 3' }), { required: true, full: true }),
