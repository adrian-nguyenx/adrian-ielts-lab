<style>
/* ===================== DESIGN TOKENS — Soft Bento ===================== */
:root{
  color-scheme:light;
  --bg:#F5F4FA; --surface:#FFFFFF; --surface-2:#F2F0F8; --surface-3:#E9E6F3;
  --border:#E7E4F0; --border-strong:#CFCBDE;
  --text:#1C1A2E; --text-muted:#5F5C75; --on-accent:#FFFFFF;
  --accent:#5B5BD6; --accent-hover:#4A4AC2; --accent-soft:#ECEBFC; --accent-ink:#3D3DAE;
  --success:#14804A; --success-soft:#E1F4E9;
  --warning:#A35A00; --warning-soft:#FFF0D4;
  --danger:#C42F3D;  --danger-soft:#FCE5E8;
  --r:#14A38B; --r-soft:#E2F5F0; --r-ink:#0B6B5C;
  --l:#3B82F6; --l-soft:#E6EEFE; --l-ink:#1D4FB8;
  --w:#EE7A58; --w-soft:#FDEBE4; --w-ink:#A3401F;
  --s:#B064DE; --s-soft:#F3E8FB; --s-ink:#7A35A6;
  --v:#D99A1E; --v-soft:#FBF1DC; --v-ink:#8A5A00;
  --o:#8A879E; --o-soft:#EEEDF3; --o-ink:#4D4A63;
  --hatch:rgba(91,91,214,.13);
  --ring:0 0 0 3px rgba(91,91,214,.35);
  --shadow-1:0 1px 2px rgba(28,26,46,.04),0 2px 8px -2px rgba(28,26,46,.06);
  --shadow-2:0 1px 2px rgba(28,26,46,.04),0 10px 28px -8px rgba(28,26,46,.12);
  --shadow-pop:0 20px 50px -12px rgba(28,26,46,.28);
  --grad-hero:linear-gradient(135deg,#EEEDFD 0%,#F6F0FC 50%,#FDF2EC 100%);
  --grad-accent:linear-gradient(140deg,#6D6DE6 0%,#8A6BE0 100%);
  --topbar-bg:rgba(245,244,250,.85);
  --backdrop:rgba(24,22,44,.42);
  --ins-bg:#DDF5E6; --ins-fg:#0F6A3A; --del-bg:#FCE1E4; --del-fg:#A82434;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:48px;
  --rad-xs:8px; --rad-sm:10px; --rad-md:14px; --rad-lg:20px; --rad-xl:24px; --rad-pill:999px;
  --font-sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:ui-monospace,"Cascadia Code",Consolas,"SF Mono",Menlo,monospace;
  --fs-xs:12px; --fs-sm:13.5px; --fs-md:15px; --fs-lg:17px; --fs-xl:21px; --fs-2xl:30px; --fs-3xl:44px; --fs-display:64px;
  --lh:1.5;
  /* chart colour keys (IT.Charts uses var(--c-<key>)) */
  --c-reading:var(--r); --c-listening:var(--l); --c-writing:var(--w); --c-speaking:var(--s);
  --c-vocabulary:var(--v); --c-other:var(--o); --c-accent:var(--accent);
  --c-success:var(--success); --c-warning:var(--warning); --c-danger:var(--danger);
  --c-writing1:#F3A07F; --c-writing2:var(--w);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111120; --surface:#1A1A2C; --surface-2:#222236; --surface-3:#2B2B42;
    --border:#2C2C44; --border-strong:#41415E;
    --text:#ECEBF6; --text-muted:#A9A7BF; --on-accent:#15152A;
    --accent:#9C9AFF; --accent-hover:#B2B0FF; --accent-soft:rgba(156,154,255,.15); --accent-ink:#C3C2FF;
    --success:#4FD99A; --success-soft:rgba(79,217,154,.13);
    --warning:#F5B84A; --warning-soft:rgba(245,184,74,.14);
    --danger:#FF7D8B;  --danger-soft:rgba(255,125,139,.14);
    --r:#3FCFB4; --r-soft:rgba(63,207,180,.12);  --r-ink:#86E6D3;
    --l:#6EA4FF; --l-soft:rgba(110,164,255,.13); --l-ink:#AECBFF;
    --w:#FF9B7D; --w-soft:rgba(255,155,125,.12); --w-ink:#FFC4B1;
    --s:#CF94F5; --s-soft:rgba(207,148,245,.13); --s-ink:#E4C4FA;
    --v:#F2C25A; --v-soft:rgba(242,194,90,.13); --v-ink:#F7D88F;
    --o:#9A98B3; --o-soft:rgba(154,152,179,.14); --o-ink:#C9C7DB;
    --hatch:rgba(156,154,255,.16);
    --ring:0 0 0 3px rgba(156,154,255,.45);
    --shadow-1:0 1px 0 rgba(255,255,255,.03) inset;
    --shadow-2:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px -10px rgba(0,0,0,.5);
    --shadow-pop:0 24px 60px -12px rgba(0,0,0,.7);
    --grad-hero:linear-gradient(135deg,rgba(156,154,255,.16) 0%,rgba(207,148,245,.07) 55%,rgba(255,155,125,.07) 100%);
    --grad-accent:linear-gradient(140deg,#8E8CFA 0%,#B092F2 100%);
    --topbar-bg:rgba(17,17,32,.82);
    --backdrop:rgba(0,0,0,.6);
    --ins-bg:rgba(79,217,154,.18); --ins-fg:#8BEBBB; --del-bg:rgba(255,125,139,.18); --del-fg:#FFAAB4;
    --c-writing1:#FFC0A8;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111120; --surface:#1A1A2C; --surface-2:#222236; --surface-3:#2B2B42;
  --border:#2C2C44; --border-strong:#41415E;
  --text:#ECEBF6; --text-muted:#A9A7BF; --on-accent:#15152A;
  --accent:#9C9AFF; --accent-hover:#B2B0FF; --accent-soft:rgba(156,154,255,.15); --accent-ink:#C3C2FF;
  --success:#4FD99A; --success-soft:rgba(79,217,154,.13);
  --warning:#F5B84A; --warning-soft:rgba(245,184,74,.14);
  --danger:#FF7D8B;  --danger-soft:rgba(255,125,139,.14);
  --r:#3FCFB4; --r-soft:rgba(63,207,180,.12);  --r-ink:#86E6D3;
  --l:#6EA4FF; --l-soft:rgba(110,164,255,.13); --l-ink:#AECBFF;
  --w:#FF9B7D; --w-soft:rgba(255,155,125,.12); --w-ink:#FFC4B1;
  --s:#CF94F5; --s-soft:rgba(207,148,245,.13); --s-ink:#E4C4FA;
  --v:#F2C25A; --v-soft:rgba(242,194,90,.13); --v-ink:#F7D88F;
  --o:#9A98B3; --o-soft:rgba(154,152,179,.14); --o-ink:#C9C7DB;
  --hatch:rgba(156,154,255,.16);
  --ring:0 0 0 3px rgba(156,154,255,.45);
  --shadow-1:0 1px 0 rgba(255,255,255,.03) inset;
  --shadow-2:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px -10px rgba(0,0,0,.5);
  --shadow-pop:0 24px 60px -12px rgba(0,0,0,.7);
  --grad-hero:linear-gradient(135deg,rgba(156,154,255,.16) 0%,rgba(207,148,245,.07) 55%,rgba(255,155,125,.07) 100%);
  --grad-accent:linear-gradient(140deg,#8E8CFA 0%,#B092F2 100%);
  --topbar-bg:rgba(17,17,32,.82);
  --backdrop:rgba(0,0,0,.6);
  --ins-bg:rgba(79,217,154,.18); --ins-fg:#8BEBBB; --del-bg:rgba(255,125,139,.18); --del-fg:#FFAAB4;
  --c-writing1:#FFC0A8;
}
/* skill colour scopes: set --k / --k-soft / --k-ink */
.k-reading,.skill-reading{--k:var(--r);--k-soft:var(--r-soft);--k-ink:var(--r-ink)}
.k-listening,.skill-listening{--k:var(--l);--k-soft:var(--l-soft);--k-ink:var(--l-ink)}
.k-writing,.skill-writing,.skill-writing1,.skill-writing2{--k:var(--w);--k-soft:var(--w-soft);--k-ink:var(--w-ink)}
.k-speaking,.skill-speaking{--k:var(--s);--k-soft:var(--s-soft);--k-ink:var(--s-ink)}
.k-vocabulary,.skill-vocabulary{--k:var(--v);--k-soft:var(--v-soft);--k-ink:var(--v-ink)}
.k-other,.skill-other,.skill-manual,.skill-grammar,.skill-mock{--k:var(--o);--k-soft:var(--o-soft);--k-ink:var(--o-ink)}
.k-accent{--k:var(--accent);--k-soft:var(--accent-soft);--k-ink:var(--accent-ink)}

</style>
<style>
/* ===================== BASE ===================== */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs-md)/var(--lh) var(--font-sans);-webkit-font-smoothing:antialiased;overflow-x:clip;min-height:100vh}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-.01em;line-height:1.2}
h1{font-size:var(--fs-2xl);font-weight:700} h2{font-size:var(--fs-lg);font-weight:650} h3{font-size:var(--fs-md);font-weight:650} h4{font-size:var(--fs-sm);font-weight:650}
p{margin:0}
a{color:var(--accent-ink)} a:hover{color:var(--accent)}
.muted{color:var(--text-muted)} .small{font-size:var(--fs-sm)} .xs{font-size:var(--fs-xs)} .bold{font-weight:650}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.02em}
.mono{font-family:var(--font-mono);font-size:.92em}
.icon{flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
button{font:inherit;color:inherit}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nowrap{white-space:nowrap}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pre{white-space:pre-wrap}

/* layout helpers */
.stack{display:flex;flex-direction:column;gap:var(--sp-3)} .stack-lg{display:flex;flex-direction:column;gap:var(--sp-5)} .stack-sm{display:flex;flex-direction:column;gap:var(--sp-2)}
.row{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap} .row-nw{display:flex;align-items:center;gap:var(--sp-2)}
.between{justify-content:space-between} .end{justify-content:flex-end} .grow{flex:1;min-width:0}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-4)}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-4)}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-4)}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--sp-4)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-4)}
.form-grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.form-grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.field-full{grid-column:1/-1}
.divider{border:0;border-top:1px solid var(--border);margin:var(--sp-4) 0}
.mt-2{margin-top:var(--sp-2)} .mt-4{margin-top:var(--sp-4)} .mt-6{margin-top:var(--sp-6)} .mb-4{margin-bottom:var(--sp-4)}

/* ===================== SHELL ===================== */
.topbar{position:sticky;top:0;z-index:30;background:var(--topbar-bg);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--border)}
.topbar-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:var(--sp-3);padding:10px var(--sp-6)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px;cursor:pointer;font-family:var(--font-display);font-weight:700;font-size:var(--fs-md);white-space:nowrap;text-decoration:none;color:var(--text)}
.logo{display:grid;grid-template-columns:repeat(2,13px);gap:3px}
.logo i{width:13px;height:13px;border-radius:4px;display:block}
.logo i:nth-child(1){background:var(--r)} .logo i:nth-child(2){background:var(--l)} .logo i:nth-child(3){background:var(--w)} .logo i:nth-child(4){background:var(--s)}
.nav{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--rad-pill);padding:4px;margin-left:auto}
.nav-tab{display:flex;align-items:center;gap:7px;border:0;background:none;padding:7px 14px;border-radius:var(--rad-pill);color:var(--text-muted);font-size:var(--fs-sm);font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.nav-tab:hover{color:var(--text)}
.nav-tab[aria-current="page"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1),0 0 0 1px var(--border)}
.top-actions{display:flex;align-items:center;gap:var(--sp-2)}
.more{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:230px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rad-md);box-shadow:var(--shadow-pop);padding:6px;z-index:40}
.menu a,.menu button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:9px 12px;border-radius:var(--rad-sm);text-align:left;font-size:var(--fs-sm);cursor:pointer;color:var(--text);text-decoration:none}
.menu a:hover,.menu a:focus-visible,.menu button:hover{background:var(--surface-2)}
.menu a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 4px}
.bnav{display:none}
main{max-width:1320px;margin:0 auto;padding:var(--sp-6) var(--sp-6) var(--sp-10)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap;margin-bottom:var(--sp-5)}
.page-sub{color:var(--text-muted);font-size:var(--fs-sm);margin-top:4px}
.page-actions{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--text-muted);margin-bottom:var(--sp-3)}
.crumbs a{color:var(--text-muted);text-decoration:none} .crumbs a:hover{color:var(--text)}
.boot{display:grid;place-items:center;min-height:60vh;color:var(--text-muted)}
.fatal{max-width:640px;margin:10vh auto;padding:var(--sp-6)}

/* ===================== COMPONENTS ===================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--rad-sm);border:1px solid transparent;font-weight:600;font-size:var(--fs-sm);cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn-primary:hover:not(:disabled){background:var(--accent-hover)}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border-strong)}
.btn-secondary:hover:not(:disabled){background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--text-muted)}
.btn-ghost:hover:not(:disabled){background:var(--surface-2);color:var(--text)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-danger:hover:not(:disabled){background:var(--danger);color:#fff}
.btn-success{background:var(--success-soft);color:var(--success)}
.btn-sm{height:32px;padding:0 12px;font-size:var(--fs-xs)}
.btn-lg{height:48px;padding:0 22px;font-size:var(--fs-md)}
.btn-icon{width:40px;padding:0}
.btn-sm.btn-icon{width:32px}
.btn-ghost.btn-icon:hover.danger-hover{color:var(--danger);background:var(--danger-soft)}
.icon-btn{width:40px;height:40px;padding:0;display:inline-grid;place-items:center;border-radius:var(--rad-sm);border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--text-muted)}
.icon-btn:hover{color:var(--text);background:var(--surface-2)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad-xl);box-shadow:var(--shadow-1);padding:var(--sp-5);min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-4);flex-wrap:wrap}
.card-title{font-size:var(--fs-md)}
.card-actions{display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center}
.card-flat{box-shadow:none;background:var(--surface-2);border-color:transparent}
.card-hero{background:var(--grad-hero)}
.card-tint{background:linear-gradient(160deg,var(--k-soft) 0%,var(--surface) 75%)}
.eyebrow{font-size:var(--fs-xs);font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)}

.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--rad-pill);font-size:var(--fs-xs);font-weight:650;white-space:nowrap;background:var(--surface-2);color:var(--text-muted)}
.pill-new{background:var(--accent-soft);color:var(--accent-ink)}
.pill-learning{background:var(--warning-soft);color:var(--warning)}
.pill-reviewing{background:var(--l-soft);color:var(--l-ink)}
.pill-mastered{background:var(--success-soft);color:var(--success)}
.pill-draft{background:var(--surface-3);color:var(--text-muted)}
.pill-written{background:var(--accent-soft);color:var(--accent-ink)}
.pill-corrected{background:var(--l-soft);color:var(--l-ink)}
.pill-revised{background:var(--success-soft);color:var(--success)}
.pill-warn,.pill-warning{background:var(--warning-soft);color:var(--warning)}
.pill-danger{background:var(--danger-soft);color:var(--danger)}
.pill-success,.pill-fixed{background:var(--success-soft);color:var(--success)}
.pill-open{background:var(--danger-soft);color:var(--danger)}
.pill-accent{background:var(--accent-soft);color:var(--accent-ink)}
.skill-tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--rad-pill);font-size:var(--fs-xs);font-weight:650;white-space:nowrap;background:var(--k-soft);color:var(--k-ink)}
.skill-tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--k)}
.badge{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:700;border:1px solid var(--border-strong);color:var(--text-muted);white-space:nowrap}
.badge.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.badge.dashed{border-style:dashed}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.label{font-size:var(--fs-sm);font-weight:600}
.req{color:var(--danger)}
.hint{font-size:var(--fs-xs);color:var(--text-muted)}
.input{width:100%;height:42px;padding:0 14px;border-radius:var(--rad-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font:inherit;font-size:var(--fs-sm);transition:border-color .15s,box-shadow .15s;min-width:0}
textarea.input{height:auto;min-height:88px;padding:10px 14px;resize:vertical;line-height:1.55}
textarea.input.essay{min-height:280px;font-size:var(--fs-md)}
.input::placeholder{color:var(--text-muted);opacity:.85}
.input:hover{border-color:var(--text-muted)}
.input:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
.input:disabled,.input[readonly]{background:var(--surface-2);color:var(--text-muted)}
select.input{appearance:none;-webkit-appearance:none;padding-right:36px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--text-muted) 50%),linear-gradient(135deg,var(--text-muted) 50%,transparent 50%);background-position:calc(100% - 19px) 18px,calc(100% - 14px) 18px;background-size:5px 5px;background-repeat:no-repeat}
.input-sm{height:34px;padding:0 10px}
select.input.input-sm{background-position:calc(100% - 17px) 14px,calc(100% - 12px) 14px}
.check{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:var(--fs-sm)}
.check input{appearance:none;-webkit-appearance:none;margin:0;width:20px;height:20px;flex:none;border:1.5px solid var(--border-strong);border-radius:7px;background:var(--surface);display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.check input::after{content:"";width:5px;height:10px;border:solid var(--on-accent);border-width:0 2.2px 2.2px 0;transform:rotate(45deg) translate(-1px,-1px);opacity:0}
.check input:checked{background:var(--accent);border-color:var(--accent)}
.check input:checked::after{opacity:1}
.check input:focus-visible{box-shadow:var(--ring);outline:none}
.search{position:relative;flex:1 1 240px;min-width:0}
.search .icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-muted)}
.search .input{padding-left:40px}

.progress{position:relative;height:10px;border-radius:var(--rad-pill);background:var(--surface-3)}
.progress-fill{height:100%;border-radius:inherit;background:var(--k,var(--accent));transition:width .3s}
.progress-warn .progress-fill,.progress-warning .progress-fill{background:var(--warning)}
.progress-success .progress-fill{background:var(--success)}
.progress-marker{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:2px;background:var(--text)}
.progress-sm{height:6px}

.tabs{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--rad-pill);padding:4px;gap:2px;max-width:100%}
.tab{border:0;background:none;padding:7px 14px;border-radius:var(--rad-pill);font-size:var(--fs-sm);font-weight:600;color:var(--text-muted);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1),0 0 0 1px var(--border)}
.tab-count{font-size:11px;background:var(--surface-3);color:var(--text-muted);border-radius:var(--rad-pill);padding:0 7px;line-height:18px}
.tab.active .tab-count{background:var(--accent-soft);color:var(--accent-ink)}
.tabs-sub{background:transparent;border:0;padding:0;border-bottom:1px solid var(--border);border-radius:0;display:flex;gap:var(--sp-4)}
.tabs-sub .tab{border-radius:0;padding:10px 2px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs-sub .tab.active{box-shadow:none;background:none;border-bottom-color:var(--accent);color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:34px;padding:0 13px;border-radius:var(--rad-pill);border:1px solid var(--border);background:var(--surface);color:var(--text-muted);font-size:var(--fs-sm);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{color:var(--text);border-color:var(--border-strong)}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--rad-pill);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:var(--rad-pill);font-size:var(--fs-xs);font-weight:650;color:var(--text-muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1),0 0 0 1px var(--border)}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--sp-2);border:1.5px dashed var(--border-strong);border-radius:var(--rad-lg);padding:var(--sp-8) var(--sp-5);color:var(--text-muted)}
.empty-title{font-family:var(--font-display);font-weight:650;color:var(--text);font-size:var(--fs-md)}
.empty-text{font-size:var(--fs-sm);max-width:440px}
.empty .btn{margin-top:var(--sp-2)}
.empty.compact{padding:var(--sp-5) var(--sp-4)}

.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--rad-md);background:var(--accent-soft);color:var(--accent-ink);font-size:var(--fs-sm)}
.notice.warn{background:var(--warning-soft);color:var(--warning)}
.notice.danger{background:var(--danger-soft);color:var(--danger)}
.notice.ok{background:var(--success-soft);color:var(--success)}
.notice .icon{margin-top:2px}

#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{opacity:0;transform:translateY(16px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:var(--rad-pill);font-size:var(--fs-sm);font-weight:600;box-shadow:var(--shadow-pop);transition:opacity .2s,transform .25s;max-width:100%}
.toast.show{opacity:1;transform:none}
.toast-error{background:var(--danger);color:#fff;border-radius:var(--rad-md)}
.toast-success::before{content:"✓ ";color:var(--success)}

.modal-overlay{position:fixed;inset:0;z-index:70;background:var(--backdrop);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;opacity:0;transition:opacity .15s}
.modal-overlay.show{opacity:1}
.modal{width:min(620px,100%);background:var(--surface);color:var(--text);border-radius:var(--rad-xl);box-shadow:var(--shadow-pop);display:flex;flex-direction:column;transform:translateY(8px) scale(.98);transition:transform .18s ease-out;margin:auto 0}
.modal-overlay.show .modal{transform:none}
.modal-sm{width:min(440px,100%)} .modal-lg{width:min(860px,100%)} .modal-xl{width:min(1100px,100%)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-5) var(--sp-6) 0}
.modal-title{font-size:var(--fs-lg)}
.modal-body{padding:var(--sp-5) var(--sp-6)}
.modal-foot{display:flex;justify-content:flex-end;gap:var(--sp-2);padding:var(--sp-4) var(--sp-6);border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 var(--rad-xl) var(--rad-xl);flex-wrap:wrap}

.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--rad-lg);background:var(--surface)}
.table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.table th{text-align:left;font-size:var(--fs-xs);font-weight:650;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
.table th.sortable{cursor:pointer;user-select:none} .table th.sortable:hover{color:var(--text)}
.table th.sorted::after{content:" ↓"} .table th.sorted.asc::after{content:" ↑"}
.table td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tbody tr:last-child td{border-bottom:0}
.table tbody tr:hover td{background:var(--surface-2)}
.table tbody tr.clickable{cursor:pointer}
.table .t-main{font-weight:700;font-family:var(--font-display);font-size:var(--fs-md)}
.table .t-num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.table .t-acts{text-align:right;white-space:nowrap;width:1%}
.table-scroll{overflow-x:auto;max-width:100%}
.table-foot{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);padding:10px 14px;font-size:var(--fs-xs);color:var(--text-muted);border-top:1px solid var(--border);flex-wrap:wrap}

.filters{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:center;margin-bottom:var(--sp-4)}
.filters .input{flex:0 1 180px;width:auto}
.filters .search .input{width:100%}

.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0;font-size:var(--fs-sm)}
.kv dt{color:var(--text-muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.prose{font-size:var(--fs-md);line-height:1.65;overflow-wrap:anywhere}
.prose p{margin:0 0 .8em} .prose p:last-child{margin-bottom:0}
.textbox{background:var(--surface-2);border-radius:var(--rad-md);padding:var(--sp-4);white-space:pre-wrap;line-height:1.65;overflow-wrap:anywhere;max-height:520px;overflow:auto}

/* stat */
.stat{display:flex;flex-direction:column;gap:4px;padding:var(--sp-4) var(--sp-5);background:var(--surface);border:1px solid var(--border);border-radius:var(--rad-xl);box-shadow:var(--shadow-1);min-width:0}
.stat-label{font-size:var(--fs-xs);font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted)}
.stat-value{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.02em;font-size:var(--fs-2xl);line-height:1.1}
.stat-value small{font-size:var(--fs-md);color:var(--text-muted);font-weight:600;margin-left:3px}
.stat-sub{font-size:var(--fs-xs);color:var(--text-muted)}
.stat-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--k-soft,var(--accent-soft));color:var(--k-ink,var(--accent-ink))}
.stat.mini{padding:var(--sp-3) var(--sp-4);border-radius:var(--rad-lg);box-shadow:none;background:var(--surface-2);border-color:transparent}
.stat.mini .stat-value{font-size:var(--fs-xl)}

/* ===================== BENTO DASHBOARD ===================== */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--sp-4);grid-auto-flow:dense}
.c-2{grid-column:span 2}.c-3{grid-column:span 3}.c-4{grid-column:span 4}.c-5{grid-column:span 5}.c-6{grid-column:span 6}.c-7{grid-column:span 7}.c-8{grid-column:span 8}.c-12{grid-column:span 12}
.hero{background:var(--grad-hero);padding:var(--sp-6);display:flex;flex-direction:column;gap:var(--sp-5)}
.legend{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-4)}
.legend .li{display:flex;align-items:center;gap:8px;font-size:var(--fs-xs);color:var(--text-muted)}
.legend .sw{width:22px;height:14px;border-radius:5px}
.band-grid{display:grid;grid-template-columns:minmax(220px,.9fr) 2fr;gap:var(--sp-4)}
.overall{background:var(--surface);border-radius:var(--rad-lg);padding:var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-3);box-shadow:var(--shadow-2);position:relative;overflow:hidden}
.overall::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--grad-accent)}
.overall .big{font-size:var(--fs-display);line-height:1;color:var(--accent-ink)}
.overall .big small{font-size:.5em;margin-right:4px;opacity:.7}
.overall .big.none{opacity:.35}
.unoff{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:650;color:var(--warning);background:var(--warning-soft);padding:3px 9px;border-radius:var(--rad-pill);align-self:flex-start}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.skill-tile{background:linear-gradient(160deg,var(--k-soft) 0%,var(--surface) 75%);border:1px solid var(--border);border-radius:var(--rad-lg);padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3);min-width:0}
.st-head{display:flex;align-items:center;gap:10px}
.sk{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--k);color:#fff;font-family:var(--font-display);font-weight:800;font-size:var(--fs-sm);flex:none}
[data-theme="dark"] .sk{color:#15152A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sk{color:#15152A}}
.st-head h3{flex:1}
.tgt{font-size:var(--fs-xs);font-weight:650;color:var(--k-ink);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.bands{display:flex;flex-direction:column;gap:6px}
.band{border-radius:var(--rad-sm);padding:6px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.band .bk{font-size:var(--fs-xs);font-weight:650;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band b{font-family:var(--font-display);font-size:var(--fs-lg);font-variant-numeric:tabular-nums;line-height:1.2}
.band-self{border:1.5px dashed var(--border-strong);color:var(--text)}
.band-self .bk{color:var(--text-muted)}
.band-est{background:repeating-linear-gradient(135deg,var(--hatch) 0 5px,transparent 5px 10px),var(--surface);border:1px solid var(--border);color:var(--text)}
.band-est .bk{color:var(--warning)}
.band-off{background:var(--text);color:var(--bg)}
.band-off .bk{opacity:.8}
.band-none b{opacity:.45;font-weight:500}
.band-off.band-none{background:transparent;color:var(--text);border:1px solid var(--border)}
.count .big{font-size:var(--fs-3xl);line-height:1}
.count .unit{font-size:var(--fs-lg);font-weight:600;color:var(--text-muted);margin-left:6px}
.weeks{display:grid;grid-template-columns:repeat(var(--n,26),1fr);gap:3px;margin-top:var(--sp-4)}
.weeks i{height:16px;border-radius:4px;background:var(--surface-3)}
.weeks i.done{background:var(--accent);opacity:.85}
.weeks i.now{background:var(--accent);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.priority{background:linear-gradient(150deg,var(--k-soft,var(--w-soft)),var(--surface) 80%);display:flex;flex-direction:column;gap:var(--sp-3)}
.priority .gap{display:flex;align-items:baseline;gap:8px}
.priority .gap .num{font-size:var(--fs-2xl);color:var(--k-ink,var(--w-ink))}
.streak-days{display:flex;gap:5px;margin-top:4px}
.streak-days i{flex:1;height:8px;border-radius:4px;background:var(--w);opacity:.9}
.streak-days i.miss{background:var(--surface-3);opacity:1}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.tasks li{border-radius:var(--rad-md);padding:8px 10px;margin:0 -10px;display:flex;align-items:flex-start;gap:10px}
.tasks li:hover{background:var(--surface-2)}
.tasks .tx{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.tasks .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tasks li.done .t{text-decoration:line-through;color:var(--text-muted)}
.goal{display:flex;flex-direction:column;gap:8px}
.goal-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.goal-warn{display:flex;gap:8px;align-items:flex-start;font-size:var(--fs-xs);color:var(--warning);font-weight:600}
.goal.behind{background:var(--warning-soft);border-radius:var(--rad-md);padding:12px;margin:-4px -12px}
.goal.done-goal .goal-row .bold{color:var(--success)}

/* ===================== CHARTS ===================== */
.chart{width:100%;min-width:0}
.chart-svg{display:block;width:100%;height:auto;overflow:visible}
.chart-svg text{font:600 11.5px var(--font-sans);fill:var(--text-muted)}
.chart-svg .grid{stroke:var(--border);stroke-width:1}
.chart-svg .series{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart-svg .dot{stroke:var(--surface);stroke-width:2}
.chart-svg .target{stroke-width:1.5;stroke-dasharray:4 5;opacity:.7}
.chart-svg .bar{opacity:.9} .chart-svg .bar:hover{opacity:1}
.chart-svg .val{fill:var(--text)}
.chart-svg.donut{width:160px;height:160px;flex:none}
.chart-svg .donut-total{font:700 22px var(--font-display);fill:var(--text)}
.chart-donut{display:flex;align-items:center;gap:var(--sp-5);flex-wrap:wrap}
.chart-donut .chart-legend{flex-direction:column;flex:1;min-width:150px;margin:0}
.chart-legend{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-4);margin-top:var(--sp-3)}
.legend-item{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:600;color:var(--text-muted)}
.legend-item i{width:10px;height:10px;border-radius:3px;flex:none}
.chart-empty{display:grid;place-items:center;text-align:center;min-height:140px;border:1.5px dashed var(--border-strong);border-radius:var(--rad-lg);color:var(--text-muted);font-size:var(--fs-sm);padding:var(--sp-4)}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(110px,1.2fr) 2fr minmax(70px,auto);align-items:center;gap:10px;font-size:var(--fs-sm)}
.hbar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-track{height:10px;border-radius:var(--rad-pill);background:var(--surface-3);overflow:hidden}
.hbar-fill{height:100%;border-radius:inherit;background:var(--accent)}
.hbar-fill.warn{background:var(--warning)}
.hbar-val{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-muted);font-size:var(--fs-xs);white-space:nowrap}
.heatmap .hm{fill:var(--surface-3)}
.heatmap .hm-1{fill:var(--accent);opacity:.3} .heatmap .hm-2{fill:var(--accent);opacity:.55} .heatmap .hm-3{fill:var(--accent);opacity:.8} .heatmap .hm-4{fill:var(--accent)}
.chart-heatmap .chart-svg{max-width:760px}
.spark{display:inline-block;vertical-align:middle}

/* ===================== FEATURE PIECES ===================== */
/* test editor parts */
.part-tabs{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.part-tab{flex:1 1 140px;border:1px solid var(--border);background:var(--surface);border-radius:var(--rad-lg);padding:10px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.part-tab:hover{border-color:var(--border-strong)}
.part-tab.active{border-color:var(--k,var(--accent));box-shadow:0 0 0 1px var(--k,var(--accent));background:linear-gradient(160deg,var(--k-soft,var(--accent-soft)),var(--surface) 80%)}
.part-tab .pt-name{font-weight:700;font-family:var(--font-display)}
.part-tab .pt-score{font-size:var(--fs-xs);color:var(--text-muted)}
.qtype-table{width:100%;border-collapse:collapse}
.qtype-table td,.qtype-table th{padding:6px 4px;text-align:left;font-size:var(--fs-sm)}
.qtype-table th{font-size:var(--fs-xs);color:var(--text-muted);font-weight:650;text-transform:uppercase;letter-spacing:.04em}
.qtype-table .input{height:36px}
.qtype-table td.n{width:96px}
.qtype-table td.x{width:44px}
.score-big{font-family:var(--font-display);font-weight:700;font-size:var(--fs-3xl);line-height:1;font-variant-numeric:tabular-nums}
.score-big small{font-size:.45em;color:var(--text-muted);font-weight:600}
.parts-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--sp-3)}
.part-card{border:1px solid var(--border);border-radius:var(--rad-lg);padding:var(--sp-3) var(--sp-4);background:linear-gradient(160deg,var(--k-soft),var(--surface) 80%);display:flex;flex-direction:column;gap:4px;min-width:0}

/* vocab picker */
.vp{display:flex;flex-direction:column;gap:var(--sp-3)}
.vp-search{position:relative}
.vp-results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--border);border-radius:var(--rad-md);box-shadow:var(--shadow-pop);z-index:20;max-height:280px;overflow:auto;padding:4px}
.vp-opt{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:var(--rad-sm);cursor:pointer;font-size:var(--fs-sm)}
.vp-opt:hover,.vp-opt.hl{background:var(--surface-2)}
.vp-list{display:flex;flex-direction:column;gap:6px}
.vp-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--rad-md);background:var(--surface)}
.vp-item .w{font-weight:700;font-family:var(--font-display)}
.vp-item .ctx{font-size:var(--fs-xs);color:var(--text-muted);font-style:italic}

/* diff */
.diff{white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere;background:var(--surface-2);border-radius:var(--rad-md);padding:var(--sp-4)}
.diff ins{background:var(--ins-bg);color:var(--ins-fg);text-decoration:none;border-radius:3px;padding:0 1px}
.diff del{background:var(--del-bg);color:var(--del-fg);border-radius:3px;padding:0 1px}
.diff del+ins{margin-left:3px}

/* timeline */
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--border)}
.timeline li{position:relative;padding:0 0 var(--sp-4) 36px}
.timeline .tl-dot{position:absolute;left:4px;top:4px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--k,var(--accent))}
.timeline .tl-card{border:1px solid var(--border);border-radius:var(--rad-md);padding:var(--sp-3) var(--sp-4);background:var(--surface)}

/* flashcards / quiz */
.fc-wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:var(--sp-4)}
.flashcard{min-height:280px;border-radius:var(--rad-xl);background:var(--grad-hero);border:1px solid var(--border);box-shadow:var(--shadow-2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:var(--sp-8) var(--sp-6);gap:var(--sp-3);cursor:pointer;user-select:none}
.flashcard .fc-word{font-family:var(--font-display);font-size:var(--fs-3xl);font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.flashcard .fc-sub{color:var(--text-muted)}
.flashcard .fc-answer{font-size:var(--fs-lg);font-weight:600}
.grade-row{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-2)}
.grade-row .btn{height:52px;flex-direction:column;gap:0;line-height:1.2}
.grade-row .btn small{font-weight:500;font-size:11px;opacity:.8}
.g-again{background:var(--danger-soft);color:var(--danger)} .g-hard{background:var(--warning-soft);color:var(--warning)}
.g-good{background:var(--success-soft);color:var(--success)} .g-easy{background:var(--accent-soft);color:var(--accent-ink)}
.quiz-result.ok{color:var(--success)} .quiz-result.bad{color:var(--danger)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-dow{font-size:var(--fs-xs);font-weight:650;color:var(--text-muted);text-transform:uppercase;text-align:center;padding:4px 0}
.cal-day{min-height:104px;border:1px solid var(--border);border-radius:var(--rad-md);padding:6px;background:var(--surface);display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0;text-align:left}
.cal-day:hover{border-color:var(--border-strong)}
.cal-day.out{opacity:.45}
.cal-day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cal-day .d{font-size:var(--fs-xs);font-weight:700}
.cal-ev{font-size:11px;line-height:1.3;padding:2px 6px;border-radius:6px;background:var(--k-soft);color:var(--k-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-ev.done{text-decoration:line-through;opacity:.7}
.cal-ev.log{background:var(--surface-2);color:var(--text-muted)}
.cal-more{font-size:11px;color:var(--text-muted)}
.plan-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--rad-md);background:var(--surface)}
.plan-item.done .t{text-decoration:line-through;color:var(--text-muted)}

/* speaking */
.timer{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-weight:700;font-size:var(--fs-display);line-height:1;text-align:center}
.timer.warn{color:var(--warning)} .timer.over{color:var(--danger)}
.cue{background:var(--grad-hero);border-radius:var(--rad-lg);padding:var(--sp-5);border:1px solid var(--border)}
.cue .q{font-family:var(--font-display);font-size:var(--fs-xl);font-weight:650}
.cue ul{margin:var(--sp-2) 0 0;padding-left:20px}
.rec-dot{width:12px;height:12px;border-radius:50%;background:var(--danger);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
audio{width:100%;max-width:520px;height:40px}
.crit-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-3)}

/* settings / misc */
.drop{border:1.5px dashed var(--border-strong);border-radius:var(--rad-lg);padding:var(--sp-5);text-align:center;color:var(--text-muted)}
.list-plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.list-plain li{display:flex;justify-content:space-between;gap:8px;font-size:var(--fs-sm)}

/* ===================== RESPONSIVE ===================== */
@media (max-width:1180px){ .nav-tab{padding:7px 10px} .nav-tab .icon{display:none} }
@media (max-width:960px){ .brand-name{display:none} .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))} .form-grid.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))} .crit-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:1279px){
  .bento{grid-template-columns:repeat(6,minmax(0,1fr))}
  .m-2{grid-column:span 2}.m-3{grid-column:span 3}.m-6{grid-column:span 6}
}
@media (max-width:768px){
  .topbar-in{padding:10px var(--sp-4)}
  .brand-name{display:inline;font-size:var(--fs-sm)}
  .nav{display:none}
  .top-actions{margin-left:auto}
  main{padding:var(--sp-4) var(--sp-4) calc(96px + env(safe-area-inset-bottom))}
  h1{font-size:24px}
  .bnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px -12px rgba(0,0,0,.25)}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:var(--rad-sm);font-size:10.5px;font-weight:650;color:var(--text-muted);min-width:0;text-decoration:none}
  .bnav a .icon{width:22px;height:22px}
  .bnav a[aria-current="page"]{color:var(--accent-ink)}
  .bnav a[aria-current="page"] .icon{background:var(--accent-soft);border-radius:10px;padding:2px 10px;width:44px;box-sizing:border-box}
  #toasts{bottom:calc(84px + env(safe-area-inset-bottom))}
  .bento{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-3)}
  .bento>.card,.bento>.tile{grid-column:span 2}
  .bento>.stat{grid-column:span 1}
  .bento>.stat.wide{grid-column:span 2}
  .card{border-radius:var(--rad-lg);padding:var(--sp-4)}
  .hero{padding:var(--sp-4)}
  .band-grid{grid-template-columns:1fr}
  .stat-value{font-size:24px}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .form-grid,.form-grid.cols-3{grid-template-columns:1fr}
  .filters .input{flex:1 1 140px}
  .table th,.table td{padding:8px 10px}
  .table-wrap.responsive{background:none;border:0;overflow:visible}
  .table-wrap.responsive .table thead{display:none}
  .table-wrap.responsive .table,.table-wrap.responsive tbody,.table-wrap.responsive tr,.table-wrap.responsive td{display:block;width:100%}
  .table-wrap.responsive tr{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad-lg);padding:6px 14px;margin-bottom:var(--sp-3);box-shadow:var(--shadow-1)}
  .table-wrap.responsive td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--border);text-align:right}
  .table-wrap.responsive td::before{content:attr(data-label);color:var(--text-muted);font-size:var(--fs-xs);font-weight:600;text-align:left;flex:none}
  .table-wrap.responsive td.t-first{padding-top:10px;text-align:left}
  .table-wrap.responsive td.t-first::before{content:none}
  .table-wrap.responsive td:last-child{border-bottom:0}
  .table-wrap.responsive tbody tr:hover td{background:none}
  .table-wrap.responsive td.t-acts{width:100%;justify-content:flex-end}
  .modal-body{padding:var(--sp-4)}
  .modal-head{padding:var(--sp-4) var(--sp-4) 0}
  .modal-foot{padding:var(--sp-3) var(--sp-4)}
  .modal-overlay{padding:12px 8px}
  .cal{gap:3px}
  .cal-day{min-height:62px;padding:4px}
  .cal-ev{font-size:0;height:6px;padding:0;border-radius:3px;background:var(--k)}
  .cal-ev.log{background:var(--border-strong)}
  .hbar{grid-template-columns:1fr 70px;}
  .hbar-track{grid-column:1/-1;grid-row:2}
  .tabs{display:flex;overflow-x:auto;flex-wrap:nowrap}
  .grade-row .btn small{display:none}
  .timer{font-size:48px}
}
@media (max-width:560px){ .skills{grid-template-columns:1fr} .grid-4{grid-template-columns:1fr 1fr} }
@media (max-width:340px){ .brand-name{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.topbar,.bnav,.page-actions,.card-actions,#toasts{display:none!important} body{background:#fff} .card{box-shadow:none;break-inside:avoid}}

/* ===================== v1.1 additions ===================== */
/* Vocabulary: actions inside the Word cell (table shows exactly 7 columns) */
.word-cell{display:flex;align-items:center;gap:6px;min-width:150px}
.word-cell .t-main{flex:1;min-width:0}
.word-acts{display:inline-flex;opacity:.35;transition:opacity .15s}
.table tr:hover .word-acts,.word-acts:focus-within{opacity:1}
.word-acts .btn-icon{width:30px;height:30px}
/* Writing: essay + plan side by side */
.essay-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:var(--sp-4);align-items:start}
.essay-side{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;padding-right:2px}
.bs-block{border:1px solid var(--border);border-radius:var(--rad-md);padding:var(--sp-3);background:var(--surface);display:flex;flex-direction:column;gap:8px}
.bs-block.k-writing{background:linear-gradient(160deg,var(--w-soft),var(--surface) 70%)}
.bs-head{display:flex;align-items:center;gap:6px}
.bs-head .bs-title{flex:1;font-weight:700;font-family:var(--font-display);font-size:var(--fs-sm)}
.bs-head .btn-icon{width:30px;height:30px}
.bs-step{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:start}
.bs-step label{font-size:var(--fs-xs);font-weight:650;color:var(--text-muted);padding-top:9px}
.bs-step textarea.input{min-height:42px}
.bs-line{display:grid;grid-template-columns:150px 110px 1fr auto;gap:6px;align-items:start}
.bs-line .input{height:36px}
.bs-line textarea.input{min-height:36px;height:36px;padding-top:7px}
.bs-dist{display:flex;gap:6px;flex-wrap:wrap}
.plan-view{display:flex;flex-direction:column;gap:8px;font-size:var(--fs-sm)}
.plan-view .pv-row{display:grid;grid-template-columns:110px 1fr;gap:8px}
.plan-view .pv-k{color:var(--text-muted);font-size:var(--fs-xs);font-weight:650;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
@media (max-width:1100px){ .essay-layout{grid-template-columns:1fr} .essay-side{position:static;max-height:none;overflow:visible} }
@media (max-width:768px){ .bs-step{grid-template-columns:1fr} .bs-step label{padding-top:0} .bs-line{grid-template-columns:1fr 1fr} .bs-line textarea.input{grid-column:1/-1} .word-acts{opacity:1} }

/* ===================== Knowledge (v1.4) ===================== */
.kn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--sp-3)}
.kn-card{display:flex;flex-direction:column;gap:8px;padding:var(--sp-4);border:1px solid var(--border);border-radius:var(--rad-lg);background:var(--surface);color:var(--text);text-decoration:none;box-shadow:var(--shadow-1);transition:border-color .15s,transform .1s;min-width:0}
.kn-card:hover{border-color:var(--border-strong);transform:translateY(-1px);color:var(--text)}
.kn-title{font-size:var(--fs-md);overflow-wrap:anywhere}
.kn-snippet{font-size:var(--fs-sm);color:var(--text-muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kn-meta{gap:6px;margin-top:auto}
.kn-pin{color:var(--warning);font-size:18px;line-height:1}
.kn-layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:var(--sp-4);align-items:start}
.kn-toolbar{gap:2px;margin-bottom:4px}
.kn-toolbar .btn-sm{padding:0 10px;font-weight:700}
textarea.kn-editor{min-height:240px;font-family:var(--font-mono);font-size:13.5px}
.kn-preview{border:1px solid var(--border);border-radius:var(--rad-sm);padding:var(--sp-4);min-height:240px;background:var(--surface-2)}
.kn-thumbs{display:flex;flex-wrap:wrap;gap:8px}
.kn-thumb{position:relative;width:110px;height:84px;border-radius:var(--rad-sm);overflow:hidden;border:1px solid var(--border);background:var(--surface-2);display:grid;place-items:center}
.kn-thumbs-lg .kn-thumb{width:180px;height:130px}
.kn-thumb img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.kn-thumb-x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;cursor:pointer}
.kn-full{max-width:100%;height:auto;display:block;margin:0 auto;border-radius:var(--rad-sm)}
.md{font-size:var(--fs-md);line-height:1.65;overflow-wrap:anywhere}
.md h3,.md h4,.md h5{margin:1em 0 .4em} .md h3:first-child,.md h4:first-child,.md h5:first-child,.md p:first-child{margin-top:0}
.md h3{font-size:var(--fs-xl)} .md h4{font-size:var(--fs-lg)} .md h5{font-size:var(--fs-md)}
.md p{margin:0 0 .7em} .md ul,.md ol{margin:0 0 .7em;padding-left:22px} .md li{margin:2px 0}
.md code{font-family:var(--font-mono);font-size:.9em;background:var(--surface-3);padding:1px 5px;border-radius:5px}
.md mark{background:var(--warning-soft);color:inherit;padding:0 3px;border-radius:3px}
.md-quote{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 var(--rad-sm) var(--rad-sm) 0;margin:0 0 .7em;font-size:var(--fs-sm)}
@media (max-width:960px){ .kn-layout{grid-template-columns:1fr} }

/* ===================== Cloud sync (v1.5) ===================== */
.sync-slot{display:inline-flex}
.sync-slot .cs-pill[data-compact]{width:40px;height:40px;border:1px solid var(--border);border-radius:var(--rad-sm);background:var(--surface)}
.sync-slot .cs-pill[data-compact]:hover{background:var(--surface-2)}
.cs-root.cs-root{--cs-surface:var(--surface);--cs-surface2:var(--surface-2);--cs-border:var(--border);--cs-text:var(--text);--cs-muted:var(--text-muted);--cs-accent:var(--accent);--cs-ink:var(--on-accent);--cs-danger:var(--danger)}

<script>/* js/core/constants.js */
/* Adrian IELTS Lab — enums and labels shared by every view. */
(function (IT) {

<script>/* js/core/db.js */
/* Adrian IELTS Lab — event bus + IndexedDB wrapper. */
(function (IT) {
  'use strict';

  /* ---------- Event bus ---------- */
  const listeners = {};
  IT.bus = {
    on(evt, fn) { (listeners[evt] = listeners[evt] || []).push(fn); return () => IT.bus.off(evt, fn); },
    off(evt, fn) { listeners[evt] = (listeners[evt] || []).filter((f) => f !== fn); },
    emit(evt, payload) { (listeners[evt] || []).slice().forEach((f) => { try { f(payload); } catch (e) { console.error(e); } }); },
  };

  /* ---------- Schema ----------
   * Each migration runs once when the DB version increases.
   * Never edit an old migration; add a new one. */
  const SCHEMA_VERSION = 1;
  const STORE_DEFS = {
    settings: [],
    bandEntries: [['date', 'date']],
    vocab: [['wordKey', 'wordKey', { unique: true }], ['createdAt', 'createdAt'], ['status', 'status']],
    vocabLinks: [['vocabId', 'vocabId'], ['refId', 'refId'], ['skill', 'skill']],
    vocabReviews: [['vocabId', 'vocabId'], ['date', 'date']],
    readingTests: [['date', 'date']],
    listeningTests: [['date', 'date']],
    sectionAttempts: [['testId', 'testId']],
    essays: [['task', 'task'], ['date', 'date']],
    corrections: [['essayId', 'essayId']],
    revisions: [['essayId', 'essayId']],
    speakingQuestions: [['part', 'part']],
    speakingSessions: [['date', 'date'], ['questionId', 'questionId']],
    blobs: [],
    mistakes: [['refId', 'refId'], ['skill', 'skill'], ['date', 'date']],
    studyLogs: [['date', 'date'], ['refId', 'refId']],
    calendarPlans: [['date', 'date']],
    goals: [],
    tasks: [['due', 'due']],
    // Knowledge notes (Reading / Writing Task 1 / Writing Task 2) — fully separate from tests
    knowledge: [['scope', 'scope']],
    knowledgeReviews: [['noteId', 'noteId']],
  };
  const STORES = Object.keys(STORE_DEFS);

  function req2p(req) {
    return new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  class Database {
    constructor(name) { this.name = name; this.db = null; }

    /** Which stores / indexes are missing from an open database. */
    static missing(db, tx) {
      const out = [];
      STORES.forEach((name) => {
        if (!db.objectStoreNames.contains(name)) { out.push(name); return; }
        if (tx) {
          const os = tx.objectStore(name);
          STORE_DEFS[name].forEach(([idx]) => { if (!os.indexNames.contains(idx)) out.push(name + '.' + idx); });
        }
      });
      return out;
    }

    /** Create any missing store or index. Never deletes or changes existing data. */
    static repair(db, tx) {
      STORES.forEach((name) => {
        const os = db.objectStoreNames.contains(name) ? tx.objectStore(name) : db.createObjectStore(name, { keyPath: 'id' });
        STORE_DEFS[name].forEach(([idx, path, opts]) => { if (!os.indexNames.contains(idx)) os.createIndex(idx, path, opts || {}); });
      });
    }

    _openAt(version) {
      return new Promise((resolve, reject) => {
        const r = version ? indexedDB.open(this.name, version) : indexedDB.open(this.name);
        r.onupgradeneeded = () => Database.repair(r.result, r.transaction);
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
        r.onblocked = () => reject(new Error('Database is blocked by another open tab. Close other tabs of this app and reload.'));
      });
    }

    async open() {
      if (this.db) return this.db;
      if (!window.indexedDB) throw new Error('IndexedDB is not supported in this browser.');
      // Open at whatever version exists (creates it if new), then self-heal if anything is missing.
      let db = await this._openAt(null);
      let missing = Database.missing(db, null);
      if (!missing.length) {
        try { const tx = db.transaction(STORES, 'readonly'); missing = Database.missing(db, tx); } catch (_) { missing = ['?']; }
      }
      if (missing.length) {
        const v = db.version + 1;
        db.close();
        db = await this._openAt(v);
      }
      this.db = db;
      this.db.onversionchange = () => { this.db.close(); this.db = null; IT.bus.emit('db:versionchange'); };
      return this.db;
    }

    close() { if (this.db) { this.db.close(); this.db = null; } }

    deleteDatabase() {
      this.close();
      return new Promise((resolve, reject) => {
        const r = indexedDB.deleteDatabase(this.name);
        r.onsuccess = () => resolve(); r.onerror = () => reject(r.error); r.onblocked = () => resolve();
      });
    }

    async all(store) { const db = await this.open(); return req2p(db.transaction(store).objectStore(store).getAll()); }
    async get(store, id) { const db = await this.open(); return req2p(db.transaction(store).objectStore(store).get(id)); }
    async byIndex(store, index, value) { const db = await this.open(); return req2p(db.transaction(store).objectStore(store).index(index).getAll(value)); }
    async count(store) { const db = await this.open(); return req2p(db.transaction(store).objectStore(store).count()); }

    /**
     * Atomic multi-store transaction.
     * fn(t) receives helpers: t.get, t.put, t.del, t.all, t.byIndex — all return promises bound to this transaction.
     * Resolves with fn's return value after the transaction commits; rejects (and rolls back) on any error.
     */
    async tx(stores, fn) {
      const db = await this.open();
      stores = Array.isArray(stores) ? stores : [stores];
      return new Promise((resolve, reject) => {
        const t = db.transaction(stores, 'readwrite');
        let result, failed = null;
        const h = {
          get: (s, id) => req2p(t.objectStore(s).get(id)),
          put: (s, obj) => req2p(t.objectStore(s).put(obj)),
          del: (s, id) => req2p(t.objectStore(s).delete(id)),
          all: (s) => req2p(t.objectStore(s).getAll()),
          byIndex: (s, i, v) => req2p(t.objectStore(s).index(i).getAll(v)),
          clear: (s) => req2p(t.objectStore(s).clear()),
          abort: (err) => { failed = err; try { t.abort(); } catch (_) { /* already finished */ } },
        };
        t.oncomplete = () => resolve(result);
        t.onabort = () => reject(failed || t.error || new Error('Transaction aborted'));
        t.onerror = () => { /* handled by onabort */ };
        Promise.resolve()
          .then(() => fn(h))
          .then((r) => { result = r; })
          .catch((err) => h.abort(err));
      });
    }
  }

  IT.SCHEMA_VERSION = SCHEMA_VERSION;
  IT.STORES = STORES;
  IT.Database = Database;
  IT.DB_NAME = 'adrian-ielts-tracker';
  // Default instance (tests create their own with a different name)
  IT.db = new Database(IT.DB_NAME);
})(window.IT = window.IT || {});

</script>
<script>/* js/core/band.js */
/* Adrian IELTS Lab — band conversion helpers.
 * All estimates here are UNOFFICIAL approximations based on commonly published
 * IELTS raw-score conversion tables (Academic Reading, Listening, out of 40). */
(function (IT) {
  'use strict';

  // [minRaw, band] sorted descending
  const READING_ACADEMIC = [[39, 9], [37, 8.5], [35, 8], [33, 7.5], [30, 7], [27, 6.5], [23, 6], [19, 5.5], [15, 5], [13, 4.5], [10, 4], [8, 3.5], [6, 3], [4, 2.5], [2, 2], [1, 1], [0, 0]];
  const LISTENING = [[39, 9], [37, 8.5], [35, 8], [32, 7.5], [30, 7], [26, 6.5], [23, 6], [18, 5.5], [16, 5], [13, 4.5], [10, 4], [8, 3.5], [6, 3], [4, 2.5], [2, 2], [1, 1], [0, 0]];

  function lookup(table, raw) {
    for (const [min, band] of table) if (raw >= min) return band;
    return 0;
  }

  /**
   * Estimate a band from correct/total. If total != 40 the score is scaled to 40
   * and `scaled` is set so the UI can flag it.
   * @returns {{band:number, raw40:number, scaled:boolean}|null}
   */
  function fromRaw(kind, correct, total) {
    correct = Number(correct); total = Number(total);
    if (!total || total <= 0 || isNaN(correct)) return null;
    const scaled = total !== 40;
    const raw40 = scaled ? Math.round((correct / total) * 40) : correct;
    const table = kind === 'listening' ? LISTENING : READING_ACADEMIC;
    return { band: lookup(table, Math.max(0, Math.min(40, raw40))), raw40, scaled };
  }

  /** IELTS-style rounding to nearest 0.5 (x.25 → x.5, x.75 → x+1). */
  function roundBand(x) {
    if (x === null || x === undefined || isNaN(x)) return null;
    return Math.round(Number(x) * 2 + 1e-9) / 2;
  }

  /** Overall from the four skill bands (all four required). */
  function overall(r, l, w, s) {
    const a = [r, l, w, s];
    if (a.some((x) => x === null || x === undefined || isNaN(x))) return null;
    return roundBand((Number(r) + Number(l) + Number(w) + Number(s)) / 4);
  }

  /** Average of criteria → band (nearest 0.5). */
  function fromCriteria(list) {
    const v = list.filter((x) => x !== null && x !== undefined && x !== '' && !isNaN(x)).map(Number);
    if (!v.length) return null;
    return roundBand(v.reduce((s, x) => s + x, 0) / v.length);
  }

  /** Writing component: Task 2 weighs double. Either may be missing. */
  function writing(t1, t2) {
    const has1 = t1 !== null && t1 !== undefined, has2 = t2 !== null && t2 !== undefined;
    if (has1 && has2) return { band: roundBand((Number(t1) + 2 * Number(t2)) / 3), partial: false };
    if (has2) return { band: Number(t2), partial: 'T2 only' };
    if (has1) return { band: Number(t1), partial: 'T1 only' };
    return null;
  }

  const BAND_OPTIONS = [];
  for (let b = 0; b <= 9; b += 0.5) BAND_OPTIONS.push(b);

  IT.Band = { READING_ACADEMIC, LISTENING, fromRaw, roundBand, overall, fromCriteria, writing, BAND_OPTIONS };
})(window.IT = window.IT || {});

</script>
<script>/* js/core/srs.js */
/* Adrian IELTS Lab — spaced repetition (simplified SM-2). */
(function (IT) {
  'use strict';
  const U = IT.U;
  const GRADES = ['again', 'hard', 'good', 'easy'];

  function initial() { return { ease: 2.5, interval: 0, reps: 0, lapses: 0, due: null, last: null }; }

  /**
   * Apply a grade and return the new SRS state (pure).
   * @param {object} srs  current state
   * @param {'again'|'hard'|'good'|'easy'} grade
   * @param {string} [onDate] YYYY-MM-DD (defaults to today)
   */
  function schedule(srs, grade, onDate) {
    const s = Object.assign(initial(), srs || {});
    const d = onDate || U.today();
    if (grade === 'again') {
      s.lapses += 1; s.reps = 0; s.interval = 1; s.ease = Math.max(1.3, s.ease - 0.2);
    } else if (grade === 'hard') {
      s.interval = Math.max(1, Math.round((s.interval || 1) * 1.2)); s.ease = Math.max(1.3, s.ease - 0.15); s.reps += 1;
    } else if (grade === 'good') {
      s.interval = s.reps === 0 ? 1 : s.reps === 1 ? 3 : Math.max(s.interval + 1, Math.round(s.interval * s.ease)); s.reps += 1;
    } else if (grade === 'easy') {
      s.interval = s.reps === 0 ? 4 : Math.max(s.interval + 2, Math.round(s.interval * s.ease * 1.3)); s.ease += 0.15; s.reps += 1;
    } else throw new Error('Unknown grade: ' + grade);
    s.ease = Math.round(s.ease * 100) / 100;
    s.last = d;
    s.due = U.addDays(d, s.interval);
    return s;
  }

  /** Learning status derived from the SRS state after a review. */
  function deriveStatus(s) {
    if (!s || !s.reps) return 'learning';
    if (s.interval >= 21 && s.reps >= 4) return 'mastered';
    if (s.interval >= 7) return 'reviewing';
    return 'learning';
  }

  /** Is the word due for review on date d? New words (never reviewed) are always due. */
  function isDue(v, d) {
    d = d || U.today();
    if (!v.srs || !v.srs.due) return true;
    return v.srs.due <= d;
  }

  IT.SRS = { GRADES, initial, schedule, deriveStatus, isDue };
})(window.IT = window.IT || {});

</script>
<script>/* js/core/diff.js */
/* Adrian IELTS Lab — word-level diff (LCS). */
(function (IT) {
  'use strict';

  function tokenize(text) {
    // keep whitespace (incl. newlines) as separate tokens so the output preserves layout
    return String(text || '').split(/(\s+)/).filter((t) => t.length);
  }

  /**
   * Returns an array of {op:'eq'|'add'|'del', text}.
   * Whitespace tokens are compared too but merged into neighbouring ops for display.
   */
  function diffWords(a, b) {
    const A = tokenize(a), B = tokenize(b);
    const n = A.length, m = B.length;
    // Trim common prefix/suffix to shrink the table
    let pre = 0; while (pre < n && pre < m && A[pre] === B[pre]) pre++;
    let suf = 0; while (suf < n - pre && suf < m - pre && A[n - 1 - suf] === B[m - 1 - suf]) suf++;
    const a2 = A.slice(pre, n - suf), b2 = B.slice(pre, m - suf);
    const N = a2.length, M = b2.length;
    const out = [];
    if (pre) out.push({ op: 'eq', text: A.slice(0, pre).join('') });

    if (N * M > 9e6) { // safety guard for very long texts
      if (N) out.push({ op: 'del', text: a2.join('') });
      if (M) out.push({ op: 'add', text: b2.join('') });
    } else {
      const W = M + 1;
      const L = new Uint32Array((N + 1) * W);
      for (let i = N - 1; i >= 0; i--) for (let j = M - 1; j >= 0; j--) {
        L[i * W + j] = a2[i] === b2[j] ? L[(i + 1) * W + j + 1] + 1 : Math.max(L[(i + 1) * W + j], L[i * W + j + 1]);
      }
      let i = 0, j = 0;
      const push = (op, text) => { const last = out[out.length - 1]; if (last && last.op === op) last.text += text; else out.push({ op, text }); };
      while (i < N && j < M) {
        if (a2[i] === b2[j]) { push('eq', a2[i]); i++; j++; }
        else if (L[(i + 1) * W + j] >= L[i * W + j + 1]) { push('del', a2[i]); i++; }
        else { push('add', b2[j]); j++; }
      }
      while (i < N) push('del', a2[i++]);
      while (j < M) push('add', b2[j++]);
    }
    if (suf) { const t = A.slice(n - suf).join(''); const last = out[out.length - 1]; if (last && last.op === 'eq') last.text += t; else out.push({ op: 'eq', text: t }); }
    return out;
  }

  function stats(parts) {
    let added = 0, removed = 0;
    parts.forEach((p) => {
      const w = p.text.split(/\s+/).filter(Boolean).length;
      if (p.op === 'add') added += w; else if (p.op === 'del') removed += w;
    });
    return { added, removed };
  }

  IT.Diff = { diffWords, stats };
})(window.IT = window.IT || {});

<script>/* js/core/store.js */
/* Adrian IELTS Lab — domain data layer.
 * The ONLY place that writes to IndexedDB. Keeps an in-memory snapshot (IT.Store.data)
 * that views read synchronously; every write updates the snapshot and emits `data:changed`. */
(function (IT) {
  'use strict';
  const U = IT.U, C = IT.C;

  const CACHED = IT.STORES.filter((s) => s !== 'blobs');

  const DEFAULT_SETTINGS = {
    id: 'app',
    targets: { overall: null, reading: null, listening: null, writing: null, speaking: null },
    examDate: null,
    weeklyHoursTarget: null,
    dailyMinutesTarget: null,
    priorityTopics: [],
    theme: 'system',
    autoLogPractice: false,
  };

  /** Every recording blob of a Speaking session (multiple takes + the legacy single audioBlobId). */
  function sessionBlobIds(s) { return U.uniq([s.audioBlobId].concat((s.recordings || []).map((r) => r.blobId)).filter(Boolean)); }

  class ValidationError extends Error { constructor(msg) { super(msg); this.name = 'ValidationError'; } }
  const fail = (m) => { throw new ValidationError(m); };

  class Store {
    constructor(database) {

      this.data = {};
      this._idx = {};
      CACHED.forEach((s) => { this.data[s] = []; });
      this.settings = U.clone(DEFAULT_SETTINGS);
      this.loaded = false;
    }

    /* ---------------- loading & cache ---------------- */
    async load() {
      await this.dbi.open();
      const res = await Promise.all(CACHED.map((s) => this.dbi.all(s)));
      CACHED.forEach((s, i) => { this.data[s] = res[i] || []; });
      this._idx = {};
      const st = this.data.settings.find((x) => x.id === 'app');
      this.settings = this._mergeSettings(st);

    }
    _mergeSettings(st) {

      s.targets = Object.assign({}, DEFAULT_SETTINGS.targets, (st && st.targets) || {});
