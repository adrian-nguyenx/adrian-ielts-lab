      try { this.opts.render(); } catch (e) { console.warn('CloudSync: render failed', e); }
    },

    /* ---------- pushing local changes ---------- */
    changed() { this.queue(); },
    queue() {
      if (!this.merged || this.applying) return;
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.push(), 500);
    },
    push() {
      clearTimeout(this.timer);
      if (!this.merged || !this.user || this.applying) return;
      const P = this.parts(), B = this.meta.base, now = Date.now();
      const sets = Object.keys(P).filter(k => (!B[k] || B[k].l !== P[k].h) && this.inflight[k] !== P[k].h);
      const dels = Object.keys(B).filter(k => !P[k] && this.inflight[k] !== 'del');
      if (!sets.length && !dels.length) return;
      const { doc, setDoc, deleteDoc } = this.fs;
      const ref = k => doc(this.db, 'users', this.user.uid, 'parts', docId(k));
      const run = (k, tag, promise, done) => {
        this.inflight[k] = tag; this.pending++;
        this.setState(navigator.onLine === false ? 'offline' : 'saving');
        promise.then(done).catch(e => this.fail(e)).finally(() => { if (this.inflight[k] === tag) delete this.inflight[k]; this.pending--; this.settle(); });
      };
      sets.forEach(k => {
        const h = P[k].h, j = P[k].s();
        if (j.length > MAX_DOC) {
          if (!this.tooBig[k]) { this.tooBig[k] = 1; this.toast(`"${k}" is over 1 MB and cannot sync — it stays on this device only.`, 'error'); }
          return;
        }
        this.meta.lt[k] = now;
        run(k, h, setDoc(ref(k), { j, t: now, dev: this.dev }), () => { this.meta.base[k] = { l: h, c: strHash(j) }; this.saveMeta(); });
      });
      dels.forEach(k => {
        this.meta.lt[k] = now;
        run(k, 'del', deleteDoc(ref(k)), () => { delete this.meta.base[k]; this.saveMeta(); });
      });
      this.saveMeta();
    },
    settle() {
      if (this.pending > 0 || !this.user || !this.merged) return;
      this.lastSync = new Date();
      if (this.state !== 'error') this.setState(navigator.onLine === false ? 'offline' : 'synced');
    },
    fail(e) {
      console.warn('Cloud sync error:', e);
      this.lastError = e && e.code === 'permission-denied' ? 'The cloud refused the request (permission-denied). Check the Firestore rules.' : String((e && (e.code || e.message)) || e);
      this.setState('error');
    },

    /* ---------- connecting ---------- */
    async start() {
      if (this.fs) return;
      this.setState('connecting');
      try {
        const sdk = this.opts.sdk;
        const [appMod, authMod, fsMod] = await Promise.all(['firebase-app.js', 'firebase-auth.js', 'firebase-firestore.js'].map(f => import(sdk + f)));
        this.fs = fsMod; this.authApi = authMod;
        const app = appMod.initializeApp(this.opts.firebaseConfig, 'cloudsync');
        this.auth = authMod.initializeAuth(app, { persistence: [authMod.indexedDBLocalPersistence, authMod.browserLocalPersistence, authMod.inMemoryPersistence] });
        this.db = fsMod.initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
        authMod.onAuthStateChanged(this.auth, u => this.onUser(u));
      } catch (e) {
        console.warn('Cloud sync unavailable:', e);
        this.fs = null;
        this.setState('unavailable');
      }
    },
    onUser(u) {
      if (this.unsub) { this.unsub(); this.unsub = null; }
      this.user = u || null; this.merged = false; this.cloudSnapshot = null; this.lastError = '';
      if (!u) { this.setState('off'); return; }
      this.loadMeta(u.uid);
      this.setState('connecting');
      const col = this.fs.collection(this.db, 'users', u.uid, 'parts');
      this.unsub = this.fs.onSnapshot(col, snap => this.onSnap(snap), e => this.fail(e));
    },
    onSnap(snap) {
      if (!this.merged) {
        if (snap.metadata.fromCache) return; // wait for the server's answer
        const cloud = {};
        snap.forEach(d => { const v = d.data(); cloud[keyOf(d.id)] = { j: v.j, t: v.t || 0 }; });
        this.cloudSnapshot = cloud;
        if (!this.meta.linked) { this.setState('link'); this.linkDialog(); }
        else if (!this.merging) { this.merging = true; this.firstMerge(cloud).finally(() => { this.merging = false; }); }
        return;
      }
      const changes = [];
      snap.docChanges().forEach(ch => {
        const d = ch.doc;
        if (d.metadata.hasPendingWrites) return; // our own write echoing back
        const k = keyOf(d.id), b = this.meta.base[k];
        if (ch.type === 'removed') { if (b) changes.push({ k, j: null, t: Date.now() }); return; }
        const v = d.data();
        if (b && b.c === strHash(v.j)) return; // already have this version
        changes.push({ k, j: v.j, t: v.t || 0 });
      });
      if (!changes.length) return;
      const P = this.parts();
      // keep a local edit that is newer than the incoming one; push() sends it afterwards
      const take = changes.filter(c => {
        const b = this.meta.base[c.k], L = P[c.k];
        const editedHere = L ? (!b || b.l !== L.h) : !!b;
        return !editedHere || (c.t || 0) >= (this.meta.lt[c.k] || 0);
      });
      this.applyRemote(take).then(() => { this.queue(); this.settle(); });
    },
    // Reconcile after this device was offline or closed: per document, whichever side changed wins.
    async firstMerge(cloud) {
      const P = this.parts(), B = this.meta.base, lt = this.meta.lt;
      const take = [];
      new Set([...Object.keys(P), ...Object.keys(cloud), ...Object.keys(B)]).forEach(k => {
        const L = P[k], C = cloud[k], b = B[k], cH = C ? strHash(C.j) : null;
        if (L && C) {
          if (L.h === cH) { B[k] = { l: L.h, c: cH }; return; }
          const editedHere = !b || b.l !== L.h, editedThere = !b || b.c !== cH;
          if (!editedHere && editedThere) take.push({ k, j: C.j, t: C.t });
          else if (editedHere && editedThere && (C.t || 0) > (lt[k] || 0)) take.push({ k, j: C.j, t: C.t });
        } else if (C) {
          if (!b || (b.c !== cH && (C.t || 0) > (lt[k] || 0))) take.push({ k, j: C.j, t: C.t }); // else: deleted here, push() deletes it
        } else if (L) {
          if (b && b.l === L.h) take.push({ k, j: null, t: Date.now() }); // deleted on another device
        } else delete B[k];
      });
      await this.applyRemote(take);
      this.merged = true;
      this.push();
      this.settle();
    },

    /* ---------- first sign-in on a device ---------- */
    linkDialog() {
      if (this.linking || !this.cloudSnapshot) return;
      this.linking = true;
      const cloud = this.cloudSnapshot, done = () => { this.linking = false; };
      const here = this.describe(this.opts.getState());
      if (!Object.keys(cloud).length) {
        this.dialog({
          title: 'Set up cloud sync', onClose: done,
          body: `<p>Your cloud is empty. Upload this device's data so your other devices can use it?</p><p class="cs-small">This device: ${esc(here)}.</p>`,
          actions: [{ label: 'Not now', onClick: done }, { label: 'Upload to cloud', cls: 'primary', onClick: () => { done(); this.useLocal(); } }],
        });
        return;
      }
      let there = Object.keys(cloud).length + ' parts';
      try { const cur = {}; Object.keys(cloud).forEach(k => { cur[k] = JSON.parse(cloud[k].j); }); there = this.describe(this.assemble(cur)); } catch (e) {}
      this.dialog({
        title: 'Cloud data found', onClose: done,
        body: `<p>Your cloud already has data: <b>${esc(there)}</b>.</p><p>This device has ${esc(here)}.</p>
          <p class="cs-small">Pick the copy to keep; the other is replaced. Using the cloud data is right for a new phone or browser. A backup of this device's data is kept in the browser either way.</p>`,
        actions: [
          { label: 'Replace cloud with this device', cls: 'danger left', onClick: () => { done(); this.confirmReplaceCloud(); } },
          { label: 'Use cloud data here', cls: 'primary', onClick: () => { done(); this.useCloud(); } },
        ],
      });
    },
    confirmReplaceCloud() {
      this.dialog({
        title: 'Replace cloud data?', onClose: () => this.linkDialog(),
        body: '<p>This overwrites the data in your cloud — and so on every other device — with this device\'s data.</p>',
        actions: [{ label: 'Cancel', onClick: () => this.linkDialog() }, { label: 'Replace cloud', cls: 'primary', onClick: () => this.useLocal() }],
      });
    },
    backupLocal() { lsSet(this.ns + '.backup', JSON.stringify(this.opts.getState())); },
    async useCloud() {
      this.backupLocal();
      const cloud = this.cloudSnapshot || {}, P = this.parts();
      const changes = Object.keys(cloud).map(k => ({ k, j: cloud[k].j, t: cloud[k].t }));
      Object.keys(P).forEach(k => { if (!cloud[k]) changes.push({ k, j: null, t: 0 }); });
      this.meta.base = {}; this.meta.lt = {};
      await this.applyRemote(changes);
      this.meta.linked = true; this.saveMeta();
      this.merged = true;
      this.push(); this.settle();
      this.toast('Cloud data loaded on this device');
    },
    useLocal() {
      this.backupLocal();
      const cloud = this.cloudSnapshot || {};
      this.meta.base = {}; this.meta.lt = {};
      // every cloud document gets overwritten or, if this device doesn't have it, deleted
      Object.keys(cloud).forEach(k => { this.meta.base[k] = { l: '', c: strHash(cloud[k].j) }; });
      this.meta.linked = true; this.saveMeta();
      this.merged = true;
      this.push(); this.settle();
      this.toast('Uploading this device\'s data…');
    },

    /* ---------- UI ---------- */
    setState(s) {
      this.state = s;
      const label = LABEL[s] || s;
      document.querySelectorAll('[data-cs-pill]').forEach(p => {
        p.dataset.csState = s;
        p.querySelector('.cs-label').textContent = s === 'error' ? 'Sync error — tap for details' : label;
        p.title = this.user ? `${label} · ${this.user.email}` : label;
        p.setAttribute('aria-label', 'Cloud sync: ' + label);
      });
      if (this.opts && this.opts.onStatus) { try { this.opts.onStatus(s, label, this.user); } catch (e) {} }
      const info = document.getElementById('cs-info');
      if (info && this.user) info.innerHTML = this.infoHTML();
    },
    label() { return LABEL[this.state] || this.state; },
    infoHTML() {
      return `<div>Signed in as <b>${esc(this.user.email)}</b></div>
        <div>Status: <b>${esc(this.label())}</b>${this.lastSync ? ` · last saved ${this.lastSync.toLocaleTimeString()}` : ''}</div>
        ${this.lastError ? `<div class="cs-err">${esc(this.lastError)}</div>` : ''}
        <div class="cs-small">Edits show up on your other signed-in devices within a second or two. Edits made offline are kept and uploaded when you reconnect.</div>`;
    },
    open() {
      if (this.state === 'link') { this.linkDialog(); return; }
      if (this.state === 'unavailable') {
        this.dialog({ title: 'Cloud sync', body: '<p>The sync service could not be loaded. Check your internet connection, then reload the page.</p>', actions: [{ label: 'Close' }, { label: 'Reload', cls: 'primary', onClick: () => location.reload() }] });
        return;
      }
      if (!this.fs) { this.toast('Cloud sync is still loading…'); return; }
      if (!this.user) { this.signInDialog(); return; }
      this.dialog({
        title: 'Cloud sync', body: `<div id="cs-info" style="display:grid;gap:6px">${this.infoHTML()}</div>`,
        actions: [
          { label: 'Sign out', cls: 'left', onClick: () => { this.signOut(); } },
          { label: 'Close' },
          { label: 'Sync now', cls: 'primary', onClick: () => { this.lastError = ''; this.push(); this.settle(); return false; } },
        ],
      });
    },
    signInDialog() {
      const root = this.dialog({
        title: 'Sign in to sync',
        body: `<p class="cs-small">Use the account created in this app's Firebase project. Your data syncs to every device where you sign in.</p>
          <label class="cs-field"><span>Email</span><input class="cs-input" type="email" id="cs-email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false"></label>
          <label class="cs-field"><span>Password</span><input class="cs-input" type="password" id="cs-pass" autocomplete="current-password"></label>
          <div class="cs-err" id="cs-err" role="alert"></div>
          <div><button type="button" class="cs-btn link" id="cs-reset">Forgot password?</button></div>`,
        actions: [{ label: 'Cancel' }, { label: 'Sign in', cls: 'primary', onClick: () => { this.signIn(); return false; } }],
      });
      root.querySelector('#cs-reset').onclick = () => this.resetPassword();
      root.querySelector('#cs-pass').addEventListener('keydown', e => { if (e.key === 'Enter') this.signIn(); });
    },
    async signIn() {
      const email = document.getElementById('cs-email').value.trim(), pass = document.getElementById('cs-pass').value, err = document.getElementById('cs-err');
      if (!email || !pass) { err.textContent = 'Enter your email and password.'; return; }
      err.textContent = 'Signing in…';
      try { await this.authApi.signInWithEmailAndPassword(this.auth, email, pass); this.closeDialog(); this.toast('Signed in — syncing…'); }
      catch (e) { const el = document.getElementById('cs-err'); if (el) el.textContent = this.authMsg(e); }
    },
    async resetPassword() {
      const el = document.getElementById('cs-email'), err = document.getElementById('cs-err'), email = el ? el.value.trim() : '';
      if (!email) { err.textContent = 'Type your email above first.'; return; }
      try { await this.authApi.sendPasswordResetEmail(this.auth, email); err.textContent = 'If that account exists, a reset link has been sent to it.'; }
      catch (e) { err.textContent = this.authMsg(e); }
    },
    authMsg(e) {
      const c = (e && e.code) || '';
      const M = {
        'auth/invalid-credential': 'Wrong email or password.', 'auth/wrong-password': 'Wrong email or password.', 'auth/user-not-found': 'Wrong email or password.',
        'auth/invalid-email': 'That email address is not valid.', 'auth/user-disabled': 'This account is disabled.',
        'auth/too-many-requests': 'Too many attempts — wait a few minutes, then try again.',
        'auth/network-request-failed': 'Cannot reach the sign-in server. Check your internet connection.',
        'auth/operation-not-allowed': 'Email/password sign-in is not enabled in this Firebase project.',
        'auth/unauthorized-domain': 'This website address is not in the Firebase project\'s authorized domains.',
      };
      return M[c] || `Sign-in failed (${c || (e && e.message) || 'unknown error'}).`;
    },
    async signOut() {
      this.push();
      try { await this.authApi.signOut(this.auth); this.toast('Signed out — your data stays on this device'); }
      catch (e) { this.toast('Could not sign out', 'error'); }
    },
    // For confirm texts of destructive actions in the app.
    note() { return this.user ? ' This also changes your cloud data, so every signed-in device follows.' : ''; },

    /* ---------- tiny dialog + toast (independent of the host app) ---------- */
    dialog({ title, body, actions = [{ label: 'Close' }], onClose }) {
      this.closeDialog(true);
      const bd = document.createElement('div');
      bd.className = 'cs-backdrop cs-root';
      bd.innerHTML = `<div class="cs-modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="cs-head"><b>${esc(title)}</b><button type="button" class="cs-x" aria-label="Close">×</button></div>
        <div class="cs-body">${body}</div>
        <div class="cs-foot"></div></div>`;
      const close = () => { this.closeDialog(); if (onClose) onClose(); };
      bd._onClose = onClose;
      bd.querySelector('.cs-x').onclick = close;
      bd.addEventListener('mousedown', e => { if (e.target === bd) close(); });
      const foot = bd.querySelector('.cs-foot');
      actions.forEach(a => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'cs-btn ' + (a.cls || ''); b.textContent = a.label;
        b.onclick = () => { const r = a.onClick ? a.onClick() : undefined; if (r !== false) this.closeDialog(); };
        foot.appendChild(b);
      });
      document.body.appendChild(bd);
      this._dlg = bd;
      const first = bd.querySelector('.cs-input'); if (first) setTimeout(() => first.focus(), 50);
      return bd;
    },
    closeDialog() { if (this._dlg) { this._dlg.remove(); this._dlg = null; } },
    isDialogOpen() { return !!this._dlg; },
    toast(msg, type) {
      let box = document.querySelector('.cs-toasts');
      if (!box) { box = document.createElement('div'); box.className = 'cs-toasts cs-root'; box.setAttribute('aria-live', 'polite'); document.body.appendChild(box); }
      const t = document.createElement('div'); t.className = 'cs-toast' + (type ? ' ' + type : ''); t.textContent = msg;
      box.appendChild(t); setTimeout(() => t.remove(), 3500);
    },
    _test: { strHash, docId, keyOf },
  };
  window.CloudSync = CloudSync;
})();

<script>/* js/sync.js */
/* Adrian IELTS Lab — cloud sync between phone and computer (CloudSync + Firebase).
 *
 * Every saved record becomes its own cloud document  "<store>:<id>"  (users/{uid}/parts/...),
 * so no document comes near Firestore's 1 MB limit and an edit only uploads what changed.
 * Knowledge images sync too, as  "img:<blobId>"  (compressed when large).
 * Speaking recordings stay on the device where they were recorded (audio is too big to sync).
 * Per device (never synced): light/dark theme and the "last backup" date. */
(function (IT) {
  'use strict';
  const S = IT.Store, U = IT.U;
  const STORES = () => IT.STORES.filter((s) => s !== 'blobs');
  const LOCAL_ONLY = ['settings.app.theme', 'settings.app.lastBackup'];
  const IMG_MAX_BYTES = 600 * 1024; // compress larger images before upload
  const images = new Map(); // blobId -> { type, name, dataUrl }  (synchronous copy for getState)

  /* ---------- images ---------- */
  const referencedImageIds = () => new Set([].concat(...S.all('knowledge').map((n) => (n.images || []).map((i) => i.blobId))));
  function toDataUrl(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); }); }
  function fromDataUrl(url) {
    const m = /^data:([^;,]*)(;base64)?,(.*)$/s.exec(url || '');
    if (!m) return null;
    const bin = m[2] ? atob(m[3]) : decodeURIComponent(m[3]);
    const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return new Blob([a], { type: m[1] || 'application/octet-stream' });
  }
  async function compress(blob) {
    if (blob.size <= IMG_MAX_BYTES || !/^image\//.test(blob.type) || !window.createImageBitmap) return blob;
    try {
      const bmp = await createImageBitmap(blob);
      const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const out = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.8));
      return out && out.size < blob.size ? out : blob;
    } catch (_) { return blob; }
  }
  /** Keep the in-memory image copies in step with the notes. Returns true if anything changed. */
  async function refreshImages() {
    const ids = referencedImageIds();
    let changed = false;
    for (const id of Array.from(images.keys())) if (!ids.has(id)) { images.delete(id); changed = true; }
    for (const id of ids) {
      if (images.has(id)) continue;
      const b = await S.getBlob(id);
      if (!b) continue;
      const small = await compress(b.data);
      images.set(id, { type: small.type || b.type, name: b.name || '', dataUrl: await toDataUrl(small) });
      changed = true;
    }
    return changed;
  }

  /* ---------- state ⇄ cloud documents ---------- */
  function getState() {
    const s = {};
    STORES().forEach((st) => { const m = {}; S.all(st).forEach((r) => { m[r.id] = r; }); s[st] = m; });
    s.images = {}; images.forEach((v, k) => { s.images[k] = v; });
    return s;
  }
  function split(s) {
    const out = {};
    Object.keys(s || {}).forEach((st) => {
      const m = s[st] || {};
      Object.keys(m).forEach((id) => { out[(st === 'images' ? 'img' : st) + ':' + id] = m[id]; });
    });
    return out;
  }
  function join(p) {
    const s = {}; STORES().forEach((st) => { s[st] = {}; }); s.images = {};
    Object.keys(p || {}).forEach((k) => {
      const i = k.indexOf(':'); if (i < 1) return;
      const st = k.slice(0, i), id = k.slice(i + 1);
      if (st === 'img') s.images[id] = p[k];
      else if (s[st]) s[st][id] = p[k];
    });
    return s;
  }
  /** Write a merged state into IndexedDB (only what differs), then reload the in-memory copy. */
  async function setState(s) {
    s = s || {};
    const want = s.images || {};
    for (const id of Object.keys(want)) {
      if (!(await S.getBlob(id))) {
        const blob = fromDataUrl(want[id].dataUrl);
        if (blob) await S.dbi.tx(['blobs'], (t) => t.put('blobs', { id, type: blob.type, size: blob.size, data: blob, name: want[id].name || '', createdAt: U.nowIso() }));
      }
      images.set(id, want[id]);
    }
    for (const id of Array.from(images.keys())) if (!want[id]) { images.delete(id); await S.deleteBlob(id); }
    await S.dbi.tx(STORES(), async (t) => {
      for (const st of STORES()) {
        const target = s[st] || {};
        for (const r of S.all(st)) if (!target[r.id]) await t.del(st, r.id);
        for (const id of Object.keys(target)) {
          const cur = S.byId(st, id);
          if (!cur || JSON.stringify(cur) !== JSON.stringify(target[id])) await t.put(st, target[id]);
        }
      }
    });
    await S.load();
    if (IT.App && IT.App.applyTheme) IT.App.applyTheme();
    IT.bus.emit('data:changed', { stores: IT.STORES, remote: true });
  }
  function describe(s) {
    const n = (st) => Object.keys((s && s[st]) || {}).length;
    const parts = [[n('vocab'), 'words'], [n('readingTests') + n('listeningTests'), 'tests'], [n('essays'), 'essays'], [n('speakingSessions'), 'speaking sessions'], [n('knowledge'), 'notes']];
    const txt = parts.filter(([x]) => x).map(([x, l]) => x + ' ' + l).join(' · ');
    return txt || 'no study data yet';
  }

  /* ---------- start ---------- */
  let pushTimer = null;
  function onLocalChange(e) {
    if (e && e.remote) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(async () => {
      try { await refreshImages(); } catch (err) { console.warn('Sync: image copy failed', err); }
      if (window.CloudSync && CloudSync.opts) CloudSync.changed();
    }, 200);
  }

  async function init() {
    const cfg = IT.SYNC_CONFIG;
    if (!cfg || !cfg.apiKey || !window.CloudSync) return false;
    try { await refreshImages(); } catch (err) { console.warn('Sync: image copy failed', err); }
    CloudSync.init({
      firebaseConfig: cfg,
      appName: 'Adrian IELTS Lab',
      storageKey: 'adrian-ielts-lab',
      getState, setState, split, join, describe,
      localOnly: LOCAL_ONLY,
      render: () => { if (IT.App) IT.App.rerender(); },
      isBusy: () => !!document.querySelector('.modal-overlay') || (IT.App && IT.App.isDirty()),
      mount: '#sync-slot',
      onStatus: (state, label, user) => IT.bus.emit('sync:status', { state, label, user }),
    });
    IT.bus.on('data:changed', onLocalChange);
    return true;
  }

  const enabled = () => !!(IT.SYNC_CONFIG && IT.SYNC_CONFIG.apiKey && window.CloudSync);
  const note = () => (window.CloudSync && CloudSync.opts ? CloudSync.note() : '');
  IT.Sync = { init, enabled, note, open: () => window.CloudSync && CloudSync.opts && CloudSync.open(), _internals: { getState, setState, split, join, refreshImages, images } };

  // test hooks for the two-device mock test (local and remote edits land in different documents)
  window.CS_TEST_HOOKS = {
    localEdit: (s, tag) => { s.tasks = s.tasks || {}; s.tasks.task_cstest = { id: 'task_cstest', title: tag, due: U.today(), done: false, createdAt: U.nowIso(), updatedAt: U.nowIso() }; },
    readLocal: (s) => ((s.tasks || {}).task_cstest || {}).title,
    remoteKey: 'goals:goal_cstest',
    remoteEdit: (v, tag) => ({ id: 'goal_cstest', metric: 'readingTests', target: 1, period: 'weekly', from: U.today(), to: U.addDays(U.today(), 30), title: tag, createdAt: U.nowIso(), updatedAt: U.nowIso() }),
    remoteRead: (s) => ((s.goals || {}).goal_cstest || {}).title,
  };
})(window.IT = window.IT || {});

</script>
<!-- shell -->
<script>/* js/app.js */
/* Adrian IELTS Lab — app shell, router, theme, global search. Loaded last. */
(function (IT) {
  'use strict';
  const { h, icon, clear, $, toast } = IT.UI;
  const S = IT.Store, U = IT.U;
  IT.views = IT.views || {};

  const MAIN = [
    { key: 'dashboard', label: 'Dashboard', short: 'Home', icon: 'grid' },
    { key: 'vocab', label: 'Vocabulary', short: 'Vocab', icon: 'cards' },
    { key: 'reading', label: 'Reading', short: 'Reading', icon: 'book' },
    { key: 'listening', label: 'Listening', short: 'Listen', icon: 'headphones' },
    { key: 'writing', label: 'Writing', short: 'Writing', icon: 'pen' },
    { key: 'speaking', label: 'Speaking', short: 'Speak', icon: 'mic' },
  ];
  const MORE = [
    { key: 'calendar', label: 'Study Calendar', icon: 'calendar' },
    { key: 'log', label: 'Study Log', icon: 'timer' },
    { key: 'mistakes', label: 'Mistake Bank', icon: 'alert' },
    { key: 'goals', label: 'Goals & Milestones', icon: 'flag' },
    { key: 'reports', label: 'Reports', icon: 'grid' },
    { key: 'settings', label: 'Settings & Backup', icon: 'download' },
  ];

  let mainEl, current = { view: null, params: [], ctrl: null };
  let dirty = false, lastHash = location.hash;

  /* ---------------- theme ---------------- */
  function effectiveTheme() {
    const t = S.settings.theme;
    if (t === 'light' || t === 'dark') return t;
    return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function applyTheme() {
    const t = S.settings.theme;
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    try { localStorage.setItem('ielts-theme', t || 'system'); } catch (_) { /* storage blocked */ }
    const b = $('#themeBtn'); if (b) { clear(b).appendChild(icon(effectiveTheme() === 'dark' ? 'sun' : 'moon', 18)); b.title = 'Switch to ' + (effectiveTheme() === 'dark' ? 'light' : 'dark') + ' mode'; }
  }
  async function toggleTheme() {
    const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
    await S.saveSettings({ theme: next });
    applyTheme();
    toast((next === 'dark' ? 'Dark' : 'Light') + ' mode on');
  }

  /* ---------------- shell ---------------- */
  function buildShell() {
    const menu = h('div.menu', { hidden: true, role: 'menu' },
      MORE.map((m) => h('a', { href: '#/' + m.key, role: 'menuitem', dataset: { key: m.key } }, icon(m.icon, 16), m.label)),
      h('hr'),
      h('button', { type: 'button', role: 'menuitem', onclick: () => { closeMenu(); openSearch(); } }, icon('search', 16), 'Search everything', h('span.muted.xs', { style: { marginLeft: 'auto' } }, 'Ctrl K')));
    const moreBtn = h('button.btn.btn-secondary#moreBtn', { type: 'button', 'aria-haspopup': 'true', 'aria-expanded': 'false', onclick: (e) => { e.stopPropagation(); menu.hidden ? openMenu() : closeMenu(); } }, h('span', 'More'), icon('chevronDown', 14));
    function openMenu() { menu.hidden = false; moreBtn.setAttribute('aria-expanded', 'true'); const f = menu.querySelector('a'); if (f) f.focus(); }
    function closeMenu() { menu.hidden = true; moreBtn.setAttribute('aria-expanded', 'false'); }
    document.addEventListener('click', (e) => { if (!menu.hidden && !e.target.closest('.more')) closeMenu(); });
    menu.addEventListener('click', (e) => { if (e.target.closest('a')) closeMenu(); });
    menu.addEventListener('keydown', (e) => {
      const items = Array.from(menu.querySelectorAll('a,button')); const i = items.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
      if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
      if (e.key === 'Escape') { closeMenu(); moreBtn.focus(); }
    });

    const top = h('header.topbar', h('div.topbar-in',
      h('a.brand', { href: '#/dashboard', 'aria-label': "Adrian IELTS Lab — Dashboard" }, h('span.logo', h('i'), h('i'), h('i'), h('i')), h('span.brand-name', "Adrian IELTS Lab")),
      h('nav.nav', { 'aria-label': 'Main' }, MAIN.map((m) => h('a.nav-tab', { href: '#/' + m.key, dataset: { key: m.key } }, icon(m.icon, 16), m.label))),
      h('div.top-actions',
        h('button.icon-btn', { type: 'button', title: 'Search everything (Ctrl+K)', 'aria-label': 'Search everything', onclick: openSearch }, icon('search', 18)),
        h('div.more', moreBtn, menu),
        IT.Sync && IT.Sync.enabled() ? h('span#sync-slot.sync-slot', { 'data-cs-compact': '', title: 'Cloud sync' }) : null,
        h('button.icon-btn#themeBtn', { type: 'button', 'aria-label': 'Toggle light / dark mode', onclick: toggleTheme }))));
    const bnav = h('nav.bnav', { 'aria-label': 'Main (mobile)' }, MAIN.map((m) => h('a', { href: '#/' + m.key, dataset: { key: m.key } }, icon(m.icon, 22), m.short)));
    mainEl = h('main#main', { tabindex: '-1' });
    const app = $('#app'); clear(app);
    app.appendChild(top); app.appendChild(mainEl); app.appendChild(bnav);
  }
  function markNav(view) {
    document.querySelectorAll('[data-key]').forEach((a) => { if (a.dataset.key === view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    const mb = $('#moreBtn'); if (mb) mb.classList.toggle('btn-primary', MORE.some((m) => m.key === view));
    if (mb) mb.classList.toggle('btn-secondary', !MORE.some((m) => m.key === view));
  }

  /* ---------------- router ---------------- */
  function parse() {
    const raw = (location.hash || '#/dashboard').replace(/^#\/?/, '');
    const [path, qs] = raw.split('?');
    const seg = path.split('/').filter(Boolean).map(decodeURIComponent);
    const q = {}; (qs || '').split('&').filter(Boolean).forEach((kv) => { const [k, v] = kv.split('='); q[decodeURIComponent(k)] = decodeURIComponent(v || ''); });
    return { view: seg[0] || 'dashboard', params: seg.slice(1), query: q };
  }
  function render(keepScroll) {
    const r = parse();
    const v = IT.views[r.view] || IT.views.dashboard;
    const name = IT.views[r.view] ? r.view : 'dashboard';
    markNav(name);
    const y = window.scrollY;
    clear(mainEl);
    dirty = false;
    try {
      current = { view: name, params: r.params, query: r.query, ctrl: v.render(mainEl, r.params, r.query) || null };
    } catch (e) {
      console.error(e);
      mainEl.appendChild(h('div.card', h('h2', 'Something went wrong'), h('p.muted', e.message)));
    }
    const titles = Object.fromEntries(MAIN.concat(MORE).map((m) => [m.key, m.label]));
    document.title = (titles[name] ? titles[name] + ' · ' : '') + "Adrian IELTS Lab";
    if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
  }
  function onHash() {
    if (dirty && !window.confirm('You have unsaved changes on this page. Leave without saving?')) {
      history.replaceState(null, '', lastHash || '#/dashboard');
      return;
    }
    lastHash = location.hash;
    render(false);
  }
  const refresh = U.debounce(() => {
    if (!current.ctrl) return;
    if (typeof current.ctrl.refresh === 'function') current.ctrl.refresh();
    else if (current.ctrl.autoRefresh) render(true);
  }, 60);

  /* ---------------- global search ---------------- */
  function searchIndex(q) {
    q = U.normalizeWord(q);
    if (!q) return [];
    const hit = (...xs) => xs.some((x) => x && String(x).toLowerCase().includes(q));
    const out = [];
    S.all('vocab').forEach((v) => { if (hit(v.word, v.meaningVi, v.definitionEn, v.topic, v.notes)) out.push({ group: 'Vocabulary', label: v.word, sub: v.meaningVi || v.definitionEn, href: '#/vocab/word/' + v.id }); });
    S.all('readingTests').forEach((t) => { if (hit(t.name, t.notes, ...t.parts.map((p) => p.title + ' ' + p.topic))) out.push({ group: 'Reading tests', label: t.name, sub: U.fmtDate(t.date), href: '#/reading/' + t.id }); });
    S.all('listeningTests').forEach((t) => { if (hit(t.name, t.notes, ...t.parts.map((p) => p.title + ' ' + p.topic))) out.push({ group: 'Listening tests', label: t.name, sub: U.fmtDate(t.date), href: '#/listening/' + t.id }); });
    S.all('essays').forEach((e) => { if (hit(e.title, e.prompt, e.topic, e.type, e.original)) out.push({ group: 'Writing Task ' + e.task, label: e.title || e.prompt.slice(0, 60), sub: U.fmtDate(e.date) + ' · ' + (e.type || ''), href: IT.C.REF.essay.route(e.id, e) }); });
    S.all('corrections').forEach((c) => { const e = S.byId('essays', c.essayId); if (e && hit(c.comments, c.correctedText, c.source)) out.push({ group: 'Corrections', label: (e.title || 'Essay') + ' — ' + (c.source || 'correction'), sub: U.fmtDate(c.date), href: IT.C.REF.essay.route(e.id, e) + '?tab=corrections' }); });
    S.all('revisions').forEach((r) => { const e = S.byId('essays', r.essayId); if (e && hit(r.content, r.changeNotes)) out.push({ group: 'Revisions', label: (e.title || 'Essay') + ' — v' + r.versionNo, sub: U.fmtDate(r.date), href: IT.C.REF.essay.route(e.id, e) + '?tab=revisions' }); });
    S.all('speakingQuestions').forEach((x) => { if (hit(x.text, x.topic, x.notes, x.ideas)) out.push({ group: 'Speaking questions', label: x.text, sub: 'Part ' + x.part + (x.topic ? ' · ' + x.topic : ''), href: '#/speaking/question/' + x.id }); });
    S.all('speakingSessions').forEach((x) => { if (hit(x.questionText, x.topic, x.transcript, x.answer, x.notes)) out.push({ group: 'Speaking sessions', label: x.questionText || x.topic || 'Session', sub: U.fmtDate(x.date), href: '#/speaking/session/' + x.id }); });
    S.all('mistakes').forEach((m) => { if (hit(m.category, m.context, m.correction, m.cause, m.lesson)) out.push({ group: 'Mistakes', label: m.category, sub: (m.context || '').slice(0, 80), href: '#/mistakes?id=' + m.id }); });
    S.all('knowledge').forEach((n) => { if (hit(n.title, n.content, n.examples, n.category, (n.tags || []).join(' '))) out.push({ group: 'Knowledge · ' + IT.C.KNOWLEDGE_SCOPE_LABEL[n.scope], label: n.title, sub: n.category || '', href: IT.Knowledge.routeOf(n) }); });
    S.all('studyLogs').forEach((l) => { if (hit(l.content, l.result, l.difficulties, l.next)) out.push({ group: 'Study log', label: l.content || IT.C.SKILL_LABEL[l.skill], sub: U.fmtDate(l.date) + ' · ' + U.fmtMinutes(l.minutes), href: '#/log?id=' + l.id }); });
    return out.slice(0, 80);
  }
  function openSearch() {
    const inp = IT.UI.input('q', '', { placeholder: 'Search words, tests, essays, sessions, mistakes, logs…' });
    const list = h('div.stack-sm', { style: { maxHeight: '60vh', overflow: 'auto' } });
    const run = U.debounce(() => {
      clear(list);
      const res = searchIndex(inp.value);
      if (!inp.value.trim()) { list.appendChild(h('p.muted.small', 'Type to search across everything you have saved.')); return; }
      if (!res.length) { list.appendChild(IT.UI.empty('No matches', 'Try a different word.')); return; }
      const groups = U.groupBy(res, 'group');
      Object.keys(groups).forEach((g) => {
        list.appendChild(h('div.eyebrow.mt-2', g + ' · ' + groups[g].length));
        groups[g].forEach((r) => list.appendChild(h('a.vp-opt', { href: r.href, onclick: () => m.close() }, h('span.grow', h('span.bold', r.label), r.sub ? h('span.muted.xs', { style: { display: 'block' } }, r.sub) : null), icon('chevronRight', 14))));
      });
    }, 120);
    inp.addEventListener('input', run);
    const m = IT.UI.modal({ title: 'Search everything', size: 'lg', body: h('div.stack', h('div.search', icon('search', 16), inp), list) });
    run();
  }

  /* ---------------- boot ---------------- */
  async function boot() {
    const app = $('#app');
    try {
      await S.load();
    } catch (e) {
      console.error(e);
      clear(app).appendChild(h('div.fatal.card', h('h1', 'Storage is not available'),
        h('p.mt-2', 'This browser blocked IndexedDB, so the tracker cannot save data. Open index.html in a normal (non-private) window of Chrome, Edge or Firefox.'),
        h('p.muted.small.mt-2', 'Details: ' + e.message)));
      return;
    }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    buildShell();
    applyTheme();
    if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
    IT.bus.on('data:changed', refresh);
    IT.bus.on('db:versionchange', () => toast('The database was upgraded in another tab. Please reload this page.', 'error', 10000));
    window.addEventListener('hashchange', onHash);
    window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
    document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); } });
    if (!location.hash) history.replaceState(null, '', '#/dashboard');
    lastHash = location.hash;
    render(false);
    if (IT.Sync) IT.Sync.init().catch((e) => console.warn('Cloud sync could not start', e));
  }

  IT.App = {
    go(hash) { if (location.hash === hash) render(true); else location.hash = hash; },
    rerender() { render(true); },
    setDirty(v) { dirty = !!v; },
    isDirty() { return dirty; },
    openSearch, applyTheme,
    current: () => current,
  };
  document.addEventListener('DOMContentLoaded', boot);
})(window.IT = window.IT || {});

</script>
